<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f4b">
<title>작업관리 · 근무현황</title>
<!-- 앱 설치(PWA): 휴대폰 홈 화면에 아이콘으로 설치, 전체 화면으로 열림 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작업관리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 글꼴: Pretendard (인터넷이 안 되면 맑은 고딕으로 표시) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 한국도로공사 CI 색상 기반: ex Dark Blue(남색) · ex Blue(주색) · ex Red(포인트) */
  :root {
    --ex-navy: #0b1f4b;
    --ex-navy-2: #15336f;
    --ex-blue: #0072ce;
    --ex-blue-weak: #e8f2fc;
    --ex-red: #e4002b;

    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-2: #f8f9fc;
    --text: #111a2e;
    --muted: #5b6577;
    --line: #e3e7ee;
    --primary: var(--ex-blue);
    --primary-weak: var(--ex-blue-weak);

    --work: #0d8a5b;   --work-bg: #e6f5ee;
    --leave: #667085;  --leave-bg: #f0f2f5;
    --out: #b86400;    --out-bg: #fff3e0;
    --trip: #4b3fb8;   --trip-bg: #eeecfb;
    --field: #0072ce;  --field-bg: #e8f2fc;
    --late: #d92d20;   --late-bg: #feeceb;

    --radius: 14px;
    --shadow: 0 1px 2px rgba(11, 31, 75, .06), 0 6px 20px rgba(11, 31, 75, .05);
    --shadow-lg: 0 10px 30px rgba(11, 31, 75, .12);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    background: linear-gradient(135deg, var(--ex-navy) 0%, var(--ex-navy-2) 100%);
    color: #fff; position: sticky; top: 0; z-index: 20;
    box-shadow: 0 2px 0 var(--ex-red), 0 6px 18px rgba(11, 31, 75, .18);
  }
  .topbar-inner {
    max-width: 1160px; margin: 0 auto; padding: 14px 20px 10px;
    display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
  .brand-mark { width: 4px; height: 34px; border-radius: 2px; background: var(--ex-red); flex: none; }
  .brand small { display: block; color: rgba(255, 255, 255, .7); font-size: 12px; letter-spacing: .02em; }
  .brand small.org { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 13px; color: rgba(255, 255, 255, .85); }
  .ex-logo { height: 28px; width: auto; display: block; flex: none; margin-left: -4px; }
  .brand b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .top-right { display: flex; align-items: center; gap: 12px; }
  .clock { font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .75); font-size: 13px; white-space: nowrap; }
  .clock b { color: #fff; font-size: 15px; font-weight: 700; }
  .userchip {
    display: flex; align-items: center; gap: 8px; padding: 3px 4px 3px 3px;
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .16); border-radius: 999px; font-size: 14px;
  }
  .userchip .uname { font-weight: 600; }
  .userchip .btn { background: rgba(255, 255, 255, .14); border-color: transparent; color: #fff; border-radius: 999px; }
  .userchip .btn:hover { background: rgba(255, 255, 255, .24); }
  .install-btn {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
    background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: #fff;
  }
  .install-btn:hover { background: rgba(255, 255, 255, .22); border-color: rgba(255, 255, 255, .4); }

  .nav { max-width: 1160px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; }
  .nav button {
    position: relative; border: 0; background: none; padding: 10px 12px 12px; color: rgba(255, 255, 255, .7);
    white-space: nowrap; font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .nav button:hover { color: #fff; }
  .nav button.on { color: #fff; }
  .nav button.on::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #fff;
  }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .nav .l-short { display: none; }
  .count {
    display: inline-block; min-width: 20px; padding: 0 6px;
    border-radius: 999px; background: var(--ex-red); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center;
  }

  main { max-width: 1160px; margin: 0 auto; padding: 24px 20px 56px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 4px; }
  h2 { font-size: 15px; font-weight: 700; margin: 32px 0 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--ex-blue); }
  .muted { color: var(--muted); }

  /* ---------- 버튼 · 입력 ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 600;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .btn:hover { border-color: #c9d0dc; }
  .btn.primary { background: var(--ex-blue); border-color: var(--ex-blue); color: #fff; box-shadow: 0 2px 6px rgba(0, 114, 206, .25); }
  .btn.primary:hover { background: #0063b4; }
  .btn.danger { background: var(--late); border-color: var(--late); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.small { padding: 5px 12px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .btn.cur { background: var(--c); border-color: var(--c); color: #fff; opacity: 1; }
  .inp, .memo {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    transition: border-color .15s, box-shadow .15s;
  }
  .inp:focus, .memo:focus, .pin input:focus { outline: none; border-color: var(--ex-blue); box-shadow: 0 0 0 3px rgba(0, 114, 206, .15); }
  .memo { font-size: 14px; }
  textarea.inp { min-height: 80px; resize: vertical; }
  .err { color: var(--late); font-size: 13px; width: 100%; margin: 0; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ---------- 아바타 ---------- */
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--ex-blue-weak); color: var(--ex-navy-2); font-weight: 800; font-size: 16px;
  }
  .avatar.sup { background: var(--ex-navy); color: #fff; }
  .avatar.sm { width: 28px; height: 28px; font-size: 13px; background: #fff; color: var(--ex-navy); }
  .avatar.emoji, .emoji-opt {
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-weight: 400; line-height: 1;
  }
  .avatar.emoji { font-size: 23px; background: var(--ex-blue-weak); }
  .avatar.sup.emoji { background: #e4e9f4; }
  .avatar.sm.emoji { font-size: 17px; background: #fff; }

  /* 내 아이콘 고르기 */
  .avatar-btn { position: relative; border: 0; background: none; padding: 0; border-radius: 50%; flex: none; }
  .avatar-btn:hover .avatar { box-shadow: 0 0 0 3px rgba(0, 114, 206, .18); }
  .avatar-btn:focus-visible { outline: 2px solid var(--ex-blue); outline-offset: 2px; }
  .avatar-btn .edit {
    position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--ex-blue); color: #fff; font-size: 10px; display: grid; place-items: center; border: 2px solid #fff;
  }
  .avatar-picker { width: 100%; border-top: 1px solid var(--line); padding-top: 12px; }
  .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; margin-top: 8px; }
  .emoji-opt {
    height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
    font-size: 25px; display: grid; place-items: center; transition: all .15s;
  }
  .emoji-opt:hover { border-color: #c9d0dc; background: var(--surface-2); }
  .emoji-opt.on { border-color: var(--ex-blue); background: var(--ex-blue-weak); box-shadow: 0 0 0 2px rgba(0, 114, 206, .2); }
  .emoji-opt .avatar { width: 30px; height: 30px; font-size: 13px; }
  .avatar.svgav, .avatar.sup.svgav { background: #eef1f6; }
  .avatar.svgav svg { width: 74%; height: 74%; margin-top: 18%; }
  .avatar.svgav.center svg { width: 64%; height: 64%; margin-top: 0; }
  .avatar.svgav.full { overflow: hidden; background: #e8f0fa; }
  .avatar.svgav.full svg { width: 96%; height: 96%; margin-top: 10%; }
  .emoji-opt.svgav svg { width: 30px; height: 30px; }
  /* ex CI 심벌: 원본 로고의 ex 부분(79×24)만 보이게 */
  .exmark {
    display: block; width: 80%; aspect-ratio: 79 / 24;
    background-repeat: no-repeat; background-size: 265.8% auto; background-position: 0 50%;
  }
  .avatar.svgav.ci, .avatar.sup.svgav.ci { background: #fff; box-shadow: inset 0 0 0 1px #dfe4ec; }
  .emoji-opt .exmark { width: 36px; }
  .card .avatar.svgav.ci { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--c, var(--line)), inset 0 0 0 1px #dfe4ec; }
  @media (max-width: 640px) {
    .card .avatar.svgav.ci { box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px var(--c, var(--line)), inset 0 0 0 1px #dfe4ec; }
  }

  /* ---------- 사용자 선택 ---------- */
  .login {
    max-width: 560px; margin: 16px auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 28px; box-shadow: var(--shadow-lg);
  }
  .login h2 { margin-top: 24px; }
  .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pick button {
    display: flex; align-items: center; gap: 12px; text-align: left;
    border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .pick button:hover, .pick button.on { border-color: var(--ex-blue); background: var(--ex-blue-weak); box-shadow: 0 0 0 3px rgba(0, 114, 206, .1); }
  .pick b { display: block; font-size: 15px; }
  .pick small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick button > span:last-child { min-width: 0; }
  .pin {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding: 14px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
  }
  .pin label { font-weight: 700; font-size: 14px; margin-right: 4px; }
  .pin input { width: 120px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; letter-spacing: 6px; text-align: center; }

  /* ---------- 현황판 ---------- */
  .board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
  .board-head h1 { margin: 0; }
  .board-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .summary { display: flex; gap: 6px; flex-wrap: wrap; }
  .summary > span {
    padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
    color: var(--c); background: var(--cb); display: inline-flex; align-items: center; gap: 4px;
  }
  .summary b { font-weight: 800; }

  /* 상태 아이콘 */
  /* 선 아이콘 (이모지 대신, 어느 기기에서나 같은 모양) */
  .st-ico, .ic { display: inline-grid; place-items: center; flex: none; line-height: 0; }
  .st-ico { width: 1.15em; height: 1.15em; margin-right: 5px; }
  .st-ico svg, .ic svg { width: 100%; height: 100%; stroke-width: 2.1; }
  .ic { width: 1.1em; height: 1.1em; vertical-align: -0.18em; }
  .ic + * , .ic-gap { margin-left: 4px; }
  .badge, .chip, .summary > span, .seg .btn { display: inline-flex; align-items: center; justify-content: center; }
  .btn:disabled .st-ico { opacity: .6; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .grid.six { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
  .card {
    position: relative; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 18px 16px 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--line)); }
  .card.mine { border-color: rgba(0, 114, 206, .45); box-shadow: 0 0 0 3px rgba(0, 114, 206, .1), var(--shadow); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .name { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; white-space: nowrap; }
  .role { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me { font-size: 10.5px; font-weight: 700; background: var(--ex-blue); color: #fff; border-radius: 4px; padding: 1px 5px; vertical-align: 2px; margin-left: 2px; }
  .badge {
    font-weight: 700; font-size: 13px; padding: 4px 11px; border-radius: 999px; color: var(--c); background: var(--cb);
    white-space: nowrap; flex: none;
  }
  .kv {
    display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; margin: 0; font-size: 14px;
    padding: 10px 12px; background: var(--surface-2); border-radius: 10px;
  }
  .kv dt { color: var(--muted); }
  .kv-mini { display: none; }
  .kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .note { margin: 0; font-size: 14px; color: var(--text); padding: 8px 12px; background: var(--surface-2); border-radius: 10px; }
  .late-txt { color: var(--late); }
  .st-work  { --c: var(--work);  --cb: var(--work-bg); }
  .st-leave { --c: var(--leave); --cb: var(--leave-bg); }
  .st-out   { --c: var(--out);   --cb: var(--out-bg); }
  .st-trip  { --c: var(--trip);  --cb: var(--trip-bg); }
  .st-field { --c: var(--field); --cb: var(--field-bg); }
  .st-late  { --c: var(--late);  --cb: var(--late-bg); }
  .card.st-late { background: linear-gradient(180deg, #fff6f5 0%, #fff 100%); border-color: #f6c9c5; }
  .card.st-late .badge { background: var(--late); color: #fff; }
  .card.st-late .kv { background: #fff0ee; }

  .mystatus { margin-top: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .mystatus .lbl { font-weight: 800; font-size: 14px; color: var(--ex-navy); }
  .mystatus .memo { flex: 1; width: auto; min-width: 180px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }

  /* 작업 요청 */
  .banner.info { background: var(--ex-blue-weak); color: var(--ex-navy-2); border-color: #bcd9f5; }
  .banner > span { display: inline-flex; align-items: center; gap: 6px; }
  .wo-list { display: flex; flex-direction: column; gap: 12px; }
  .wo-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .wo-card.urgent { border-color: #f3c7c4; }
  .wo-card.unread { border-color: rgba(0, 114, 206, .45); box-shadow: 0 0 0 3px rgba(0, 114, 206, .1), var(--shadow); }
  .wo-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wo-title { font-size: 15.5px; margin-right: auto; }
  .wo-progress { font-size: 12.5px; font-weight: 800; color: var(--out); background: var(--out-bg); padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
  .wo-progress.done { color: var(--work); background: var(--work-bg); }
  .wo-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .wo-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .wo-detail { margin: 0; font-size: 14px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; white-space: pre-wrap; }
  .wo-acks { display: flex; flex-direction: column; gap: 6px; }
  .ack { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; padding: 7px 10px; border-radius: 10px; }
  .ack b { font-weight: 800; }
  .ack em { font-style: normal; color: var(--text); flex-basis: 100%; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 22px; }
  .ack.yes { background: var(--work-bg); color: var(--work); }
  .ack.yes span { color: #3b6d55; }
  .ack.no { background: var(--surface-2); color: var(--muted); }
  .ack .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--out); flex: none; }
  .wo-foot { display: flex; justify-content: flex-end; }
  .wo-myack { font-size: 13.5px; font-weight: 700; color: var(--work); background: var(--work-bg); padding: 8px 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .wo-ack-form { display: flex; flex-direction: column; gap: 6px; }
  .ack-lbl { font-weight: 700; font-size: 13px; color: var(--ex-navy); }
  .ack-lbl small { font-weight: 500; color: var(--muted); }
  .ack-inp { min-height: 84px; resize: vertical; font-size: 14px; line-height: 1.55; }
  .ack-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ack-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wo-ack-form .btn { flex: none; display: inline-flex; align-items: center; gap: 5px; min-width: 120px; justify-content: center; }
  .wo-myack .ack-note { flex-basis: 100%; margin: 0; padding-left: 22px; font-weight: 500; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .opts.wo-to .opt > span { display: flex; flex-direction: column; line-height: 1.25; padding: 8px 4px; }
  .opts.wo-to .opt > span small { font-weight: 500; font-size: 11.5px; color: inherit; opacity: .75; }
  .opts.wo-pri { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 280px; }
  /* 우선순위: 보통 = 녹색, 긴급 = 빨강 */
  .wo-pri .pri-normal input:checked + span { background: var(--work); border-color: var(--work); box-shadow: 0 2px 6px rgba(13, 138, 91, .28); }
  .wo-pri .pri-urgent input:checked + span { background: var(--late); border-color: var(--late); box-shadow: 0 2px 6px rgba(217, 45, 32, .28); }
  .wo-pri .pri-normal input:focus-visible + span { outline-color: var(--work); }
  .wo-pri .pri-urgent input:focus-visible + span { outline-color: var(--late); }
  #order-form .btn.primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

  .banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-weight: 700;
    background: #fff8ec; color: var(--out); border: 1px solid #f7dfb5;
  }

  /* 최근 상태 변경 */
  .loglist { list-style: none; margin: 0; padding: 4px 18px; }
  .loglist li { display: flex; align-items: center; gap: 8px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
  .loglist li:last-child { border-bottom: 0; }
  .loglist time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 42px; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: var(--c); background: var(--cb); white-space: nowrap; }

  /* ---------- 승인 요청 ---------- */
  .layout2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 16px; }
  .form { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
  .field > .lbl { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .field > .lbl small { font-weight: 500; color: var(--muted); }
  .opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; inset: 0; }
  .opt > span {
    display: flex; align-items: center; justify-content: center; text-align: center; min-height: 42px; padding: 6px 4px;
    border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--surface);
    transition: all .15s;
  }
  .opt input:checked + span { border-color: var(--ex-blue); background: var(--ex-blue); color: #fff; box-shadow: 0 2px 6px rgba(0, 114, 206, .25); }
  .opt input:focus-visible + span { outline: 2px solid var(--ex-blue); outline-offset: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mt6 { margin-top: 8px; }
  .form > .btn.primary { padding: 13px; font-size: 16px; border-radius: 12px; }

  .checks { display: flex; flex-direction: column; gap: 8px; }
  .check {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: all .15s;
  }
  .check:has(input:checked) { border-color: #9fd6bd; background: var(--work-bg); }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--work); flex: none; }
  .check b { display: block; font-size: 14px; }
  .check small { color: var(--muted); font-size: 13px; }
  .safety-ok { color: var(--work); font-size: 13px; font-weight: 600; }
  .tag { font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
  .tag.req { background: var(--late-bg); color: var(--late); }
  .tag.opt { background: var(--leave-bg); color: var(--leave); }

  .reqlist { list-style: none; margin: 0; padding: 0; }
  .reqlist li { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .reqlist li:last-child { border-bottom: 0; }
  .reqlist .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .reason { color: var(--late); background: var(--late-bg); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
  .empty { padding: 20px; color: var(--muted); margin: 0; text-align: center; }

  /* ---------- 승인 관리 ---------- */
  .actions { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card .seg .btn:not(.small) { flex: 1; padding: 10px; }
  .instr-lbl { font-weight: 700; font-size: 13px; color: var(--ex-navy); }
  .instr-lbl small { font-weight: 500; color: var(--muted); }
  .instr-inp { min-height: 0; font-size: 14px; resize: vertical; }
  .instr {
    display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px;
    background: var(--ex-blue-weak); border-left: 3px solid var(--ex-blue); font-size: 13.5px;
  }
  .instr b { color: var(--ex-navy-2); font-size: 12.5px; }
  .mystatus-instr { width: 100%; }

  /* 요청 수정 */
  .form.editing { border-color: var(--ex-blue); box-shadow: 0 0 0 3px rgba(0, 114, 206, .12), var(--shadow); }
  .edit-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-radius: 10px; background: var(--ex-blue-weak); color: var(--ex-navy-2); font-size: 14px;
  }
  .reqlist li.is-editing { background: var(--ex-blue-weak); }
  .editing-tag { font-size: 12.5px; font-weight: 700; color: var(--ex-blue); }
  .edited { color: var(--out); font-weight: 700; }
  /* 오늘 외근 타임라인 */
  .timeline { padding: 16px 0 14px; margin-bottom: 14px; --who: 92px; }
  .tl-head { display: flex; justify-content: space-between; align-items: center; padding: 0 18px 10px; }
  .tl-head b { font-size: 15px; color: var(--ex-navy); display: inline-flex; align-items: center; gap: 6px; }
  .tl-head b .ic { color: var(--ex-blue); }
  .tl-head .muted { font-size: 12.5px; }
  .tl-body { position: relative; padding: 0 18px; }
  .tl-row { display: grid; grid-template-columns: var(--who) 1fr; column-gap: 10px; align-items: center; min-height: 40px; }
  .tl-who { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; min-width: 0; white-space: nowrap; }
  .tl-scale { position: relative; height: 22px; }
  .tl-scale span { position: absolute; top: 2px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tl-scale span:first-child { transform: none; }
  .tl-scale span:last-child { transform: translateX(-100%); }
  .tl-track {
    position: relative; height: 32px; border-radius: 10px; background-color: var(--surface-2);
    background-image: linear-gradient(to right, rgba(15, 23, 42, .07) 1px, transparent 1px);
    background-size: calc(100% / var(--n)) 100%;
  }
  .tl-row + .tl-row { border-top: 1px dashed transparent; }
  .tl-bar {
    position: absolute; top: 4px; bottom: 4px; min-width: 6px; border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: default;
  }
  .tl-bar span { overflow: hidden; text-overflow: ellipsis; }
  .tl-bar.joinR { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tl-bar.joinL { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .tl-bar.active { background: linear-gradient(180deg, #2b93e6, var(--ex-blue)); color: #fff; box-shadow: 0 2px 6px rgba(0, 114, 206, .28); }
  .tl-bar.planned { background: #e3effc; color: var(--ex-navy-2); box-shadow: inset 0 0 0 1.5px rgba(0, 114, 206, .35); }
  .tl-bar.late { background: repeating-linear-gradient(135deg, #e5484d 0 6px, #f0716f 6px 12px); color: #fff; }
  .tl-bar.done { background: #cfd6e2; color: #33415a; }
  .tl-bar.approved { background: #e8f7ef; color: #0d6b47; box-shadow: inset 0 0 0 1.5px #7fcfa6; }
  .tl-bar.pending { background: #fff5e3; color: #8a5300; box-shadow: inset 0 0 0 1.5px #f3c071; }
  .tl-empty { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); }
  .tl-nowwrap { position: absolute; top: 0; bottom: 0; left: calc(18px + var(--who) + 10px); right: 18px; pointer-events: none; }
  .tl-now { position: absolute; top: 20px; bottom: 0; width: 2px; margin-left: -1px; background: var(--ex-red); border-radius: 2px; }
  .tl-now em {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; font-weight: 800;
    color: #fff; background: var(--ex-red); padding: 1px 6px; border-radius: 999px; white-space: nowrap;
  }
  .tl-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 12px 18px 0; font-size: 12px; color: var(--muted); }
  .tl-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .tl-key { display: inline-block; width: 18px; height: 10px; border-radius: 3px; }
  .tl-key.active { background: var(--ex-blue); }
  .tl-key.planned { background: #e3effc; box-shadow: inset 0 0 0 1.5px rgba(0, 114, 206, .35); }
  .tl-key.late { background: repeating-linear-gradient(135deg, #e5484d 0 3px, #f0716f 3px 6px); }
  .tl-key.done { background: #cfd6e2; }
  .tl-key.approved { background: #e8f7ef; box-shadow: inset 0 0 0 1.5px #7fcfa6; }
  .tl-key.pending { background: #fff5e3; box-shadow: inset 0 0 0 1.5px #f3c071; }
  @media (max-width: 640px) {
    .timeline { --who: 62px; padding-top: 14px; }
    .tl-head, .tl-legend { padding-left: 14px; padding-right: 14px; }
    .tl-body { padding: 0 14px; }
    .tl-row { column-gap: 8px; }
    .tl-who { font-size: 12.5px; gap: 4px; }
    .tl-who .avatar { display: none; }
    .tl-scale span.odd { display: none; }
    .tl-nowwrap { left: calc(14px + var(--who) + 8px); right: 14px; }
    .tl-bar { padding: 0 5px; font-size: 11px; }
  }

  /* 근무현황 안의 탭 */
  .subtabs {
    margin-top: 18px; display: flex; gap: 6px; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  }
  .subtabs button {
    position: relative; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; background: transparent; padding: 11px 10px; border-radius: 11px;
    font-weight: 700; font-size: 14.5px; letter-spacing: -0.02em; color: #4b5568; white-space: nowrap;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .subtabs button:hover:not(.on) { background: #f2f5fa; color: var(--ex-navy); }
  .subtabs button.on {
    color: var(--ex-navy);
    background: linear-gradient(180deg, #f1f7fe 0%, #e3effc 100%);
    box-shadow: inset 0 0 0 1px rgba(0, 114, 206, .28), 0 2px 8px rgba(0, 114, 206, .12);
  }
  /* 선택된 탭 아래 ex 레드 포인트 */
  .subtabs button.on::after {
    content: ""; position: absolute; left: 50%; bottom: 5px; width: 22px; height: 3px; margin-left: -11px;
    border-radius: 3px; background: var(--ex-red);
  }
  .subtabs button:focus-visible { outline: 2px solid var(--ex-blue); outline-offset: 2px; }
  .sub-ico { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #eef2f8; color: var(--ex-navy-2); flex: none; }
  .sub-ico svg { width: 16px; height: 16px; }
  .subtabs button.on .sub-ico { background: #fff; color: var(--ex-blue); box-shadow: 0 1px 2px rgba(0, 114, 206, .15); }
  .subtabs .l-short { display: none; }
  .sub-count {
    min-width: 22px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 800; line-height: 20px; text-align: center;
    background: #eef2f8; color: var(--ex-navy-2); font-variant-numeric: tabular-nums;
  }
  .subtabs button.on .sub-count { background: var(--ex-blue); color: #fff; }
  .subtab-body > :first-child { margin-top: 14px; }

  .editing-card { border-color: var(--ex-blue); box-shadow: 0 0 0 3px rgba(0, 114, 206, .12), var(--shadow); }
  .sup-edit { display: flex; flex-direction: column; gap: 10px; }
  .sup-edit label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ex-navy); min-width: 0; }
  .sup-edit .inp { font-weight: 400; font-size: 14px; padding: 8px 10px; }
  .sup-edit .row2 { gap: 10px; }
  .sup-edit .row2.dates { grid-template-columns: 1fr; }

  /* ---------- 공지 티커 ---------- */
  .notice-bar {
    margin-top: 16px; display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 10px 0 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    cursor: pointer; transition: border-color .15s, box-shadow .15s;
  }
  .notice-bar:hover { border-color: rgba(0, 114, 206, .45); }
  .notice-bar:focus-visible { outline: 2px solid var(--ex-blue); outline-offset: 2px; }
  .nt-tag {
    flex: none; font-weight: 800; font-size: 13px; color: #fff; background: var(--ex-navy);
    padding: 6px 12px; border-radius: 8px; letter-spacing: -0.01em;
  }
  .nt-window { flex: 1; min-width: 0; height: 26px; overflow: hidden; }
  .nt-list { list-style: none; margin: 0; padding: 0; will-change: transform; }
  .nt-list li { height: 26px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .nt-title { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .nt-meta { flex: none; color: var(--muted); font-size: 12.5px; }
  .nt-default .nt-title { color: var(--ex-navy-2); }
  .nt-default .ic { color: var(--ex-blue); margin-right: 6px; }
  .nt-count { flex: none; font-size: 12px; font-weight: 700; color: var(--ex-blue); background: var(--ex-blue-weak); padding: 2px 8px; border-radius: 999px; }
  .nt-more { flex: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 2px; }
  @media (prefers-reduced-motion: reduce) { .nt-list { transition: none !important; } }

  /* ---------- 공지사항 게시판 ---------- */
  .notice-list { list-style: none; margin: 0; padding: 0; }
  .notice-list li { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .notice-list li:last-child { border-bottom: 0; }
  .nl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .nl-title { font-size: 15px; }
  .nl-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .nl-body { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; }
  .avatar.xs { width: 22px; height: 22px; font-size: 11px; }
  .avatar.xs.emoji { font-size: 14px; }

  /* ---------- 오늘 외근 이력 ---------- */
  .tablewrap { overflow-x: auto; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
  .hist th, .hist td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  .hist th { color: var(--muted); font-weight: 700; font-size: 12.5px; background: var(--surface-2); }
  .hist tbody tr:hover { background: #fafbfd; }
  .hist tr:last-child td { border-bottom: 0; }
  .hist td.wrap { white-space: normal; min-width: 140px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ex-navy); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow-lg); z-index: 50; max-width: calc(100% - 32px);
  }
  .proto-note { margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }

  /* ---------- 태블릿 ---------- */
  @media (max-width: 860px) {
    .layout2 { grid-template-columns: 1fr; }
    .grid.six { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* ---------- 휴대폰 ---------- */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    .topbar-inner { padding: 12px 16px; gap: 8px; }
    .brand-mark { height: 30px; }
    .brand b { font-size: 15.5px; }
    .brand small { font-size: 11px; }
    .top-right { width: 100%; justify-content: space-between; }
    .clock { font-size: 12px; }
    .userchip { font-size: 13px; }

    /* 메뉴는 화면 아래 고정 탭으로 */
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .97); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(11, 31, 75, .08);
      backdrop-filter: blur(8px);
    }
    .nav button {
      flex: 1; flex-direction: column; gap: 2px; padding: 6px 4px; color: var(--muted); font-size: 11.5px; border-radius: 10px;
    }
    .nav button.on { color: var(--ex-blue); background: var(--ex-blue-weak); }
    .nav button.on::after { display: none; }
    .nav svg { width: 22px; height: 22px; }
    .nav .l-full { display: none; }
    .nav .l-short { display: inline; }
    .nav .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; line-height: 18px; font-size: 11px; }

    main { padding: 18px 16px 104px; }
    h1 { font-size: 20px; }
    h2 { margin-top: 26px; }
    .board-head { align-items: flex-start; flex-direction: column; gap: 10px; }
    .summary > span { padding: 4px 10px; font-size: 12px; }

    .mystatus { padding: 12px; gap: 10px; }
    .mystatus .lbl { flex: 1; }
    .mystatus .seg { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .mystatus .seg .btn { padding: 10px 0; font-size: 14px; }
    .mystatus .memo { min-width: 0; width: 100%; flex: none; padding: 11px 12px; }

    /* 6명 카드: 2칸 × 3줄 */
    .grid.six { gap: 10px; }
    .grid.six .card { padding: 12px 12px 12px 15px; gap: 8px; border-radius: 12px; }
    .grid.six .who { gap: 8px; }
    .grid.six .avatar { width: 28px; height: 28px; font-size: 12px; }
    .grid.six .avatar.emoji { font-size: 18px; }
    .grid.six .card-head { flex-direction: column; align-items: flex-start; gap: 6px; }
    .grid.six .name { font-size: 15px; }
    .grid.six .badge { font-size: 12px; padding: 3px 9px; }
    .grid.six .kv { display: none; }
    .grid.six .kv-mini {
      display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px;
      background: var(--surface-2); font-size: 12.5px;
    }
    .card.st-late .kv-mini { background: #fff0ee; }
    .kv-mini .loc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }
    .kv-mini .time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .grid.six .note { font-size: 12.5px; padding: 6px 10px; }
    .notice-bar { height: 46px; gap: 8px; margin-top: 12px; }
    .nt-tag { font-size: 12px; padding: 5px 9px; }
    .nt-meta { display: none; }
    .nt-title { font-size: 13.5px; }
    .subtabs { margin-top: 12px; gap: 4px; padding: 5px; border-radius: 14px; }
    .subtabs button { flex-direction: column; gap: 3px; padding: 9px 2px 11px; font-size: 12.5px; border-radius: 10px; }
    .subtabs button.on::after { bottom: 4px; width: 16px; margin-left: -8px; height: 2.5px; }
    .sub-ico { width: 24px; height: 24px; border-radius: 7px; }

    .subtabs .l-full { display: none; }
    .subtabs .l-short { display: inline; }
    .sub-count { position: absolute; top: 5px; right: calc(50% - 26px); min-width: 17px; font-size: 10.5px; line-height: 16px; padding: 0 4px; }

    .grid { grid-template-columns: 1fr; }
    .login { padding: 22px 18px; border-radius: 16px; margin-top: 4px; }
    .pick { gap: 8px; }
    .pick button { padding: 10px; gap: 8px; }
    .pick .avatar { width: 30px; height: 30px; font-size: 13px; }

    .form { padding: 18px 16px; }
    .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opt > span { min-height: 46px; font-size: 15px; }
    .row2 { grid-template-columns: 1fr; }
    .inp, .memo { font-size: 16px; } /* 아이폰 입력 시 자동 확대 방지 */
    .btn { min-height: 40px; }
    .btn.small { min-height: 36px; }

    /* 이력 표 → 카드형 목록 */
    .tablewrap { overflow: visible; background: transparent; border: 0; box-shadow: none; }
    table.hist, .hist tbody, .hist tr, .hist td { display: block; }
    .hist thead { display: none; }
    .hist tr {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
      padding: 10px 14px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
    }
    .hist td { border: 0; padding: 2px 0; white-space: normal; font-size: 13px; }
    .hist td[data-label]::before { content: attr(data-label); display: inline-block; width: 78px; color: var(--muted); font-size: 12px; }
    .hist td.c-name { font-size: 15px; grid-column: 1; }

    .toast { bottom: calc(84px + env(safe-area-inset-bottom)); }

  /* =========================================================
     2026 디자인 리프레시 — 최신 트렌드 반영
     · 은은한 그라데이션 배경 · 큰 라운드 · 얇은 테두리 + 부드러운 그림자
     · 아바타 상태 링(카드 왼쪽 굵은 띠 대신) · 알약형 메뉴 · 떠 있는 하단 메뉴(휴대폰)
     CI 색상(ex 남색 · 블루 · 레드)은 그대로 유지
     ========================================================= */
  :root {
    --bg: #f4f6fb;
    --line: #e6e9f1;
    --surface-2: #f6f8fc;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .04);
    --shadow-lg: 0 12px 32px rgba(16, 24, 40, .10);
    --ring: 0 0 0 4px rgba(0, 114, 206, .14);
  }
  body {
    background:
      radial-gradient(1100px 520px at -8% -12%, rgba(0, 114, 206, .09), transparent 60%),
      radial-gradient(900px 480px at 108% -6%, rgba(228, 0, 43, .045), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  h1 { font-size: 24px; letter-spacing: -0.035em; }
  h2 { font-size: 14.5px; letter-spacing: -0.02em; }
  h2::before { height: 14px; border-radius: 4px; background: linear-gradient(180deg, var(--ex-blue), #39a0f0); }

  /* 상단 바: 깊은 남색 + 은은한 광택 */
  .topbar {
    background:
      radial-gradient(600px 200px at 85% -40%, rgba(57, 160, 240, .28), transparent 70%),
      linear-gradient(120deg, #0a1a44 0%, #0f2c66 55%, #12397f 100%);
  }

  /* 카드 · 패널: 얇은 테두리 + 큰 라운드, 왼쪽 굵은 띠 대신 아바타 상태 링 */
  .panel, .card, .notice-bar, .mystatus, .subtabs, .login { border-color: rgba(15, 23, 42, .07); }
  .panel { border-radius: 18px; }
  .card { border-radius: 20px; padding: 18px; transition: transform .2s ease, box-shadow .2s ease; }
  .card::before { display: none; }
  .card .avatar { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--c, var(--line)); }
  .card.mine { border-color: rgba(0, 114, 206, .35); box-shadow: var(--ring), var(--shadow); }
  .card.st-late { background: linear-gradient(180deg, #fff5f4 0%, #fff 70%); border-color: #f5cdc9; }
  .kv, .note, .kv-mini { background: var(--surface-2); border-radius: 12px; }
  @media (hover: hover) {
    .grid .card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(16, 24, 40, .08); }
  }
  .badge { padding: 5px 11px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6); }

  .notice-bar { border-radius: 16px; }
  .nt-tag { border-radius: 10px; background: linear-gradient(135deg, var(--ex-navy), var(--ex-navy-2)); }
  .mystatus { border-radius: 18px; }
  .subtabs { border-radius: 18px; }
  .banner { border-radius: 14px; }
  .summary > span { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7); }

  /* 버튼 · 입력 */
  .btn { border-radius: 12px; }
  .btn.small { border-radius: 10px; }
  .btn.primary { background: linear-gradient(180deg, #1786e0 0%, var(--ex-blue) 100%); border-color: #0068bd; }
  .btn.primary:hover { background: linear-gradient(180deg, #0f7bd4 0%, #0063b4 100%); }
  .inp, .memo { background: var(--surface-2); border-color: #e1e6ef; border-radius: 12px; }
  .inp:focus, .memo:focus, .pin input:focus { background: #fff; box-shadow: var(--ring); }
  .opt > span, .check { border-radius: 12px; }

  /* 로그인 */
  .login { border-radius: 24px; box-shadow: var(--shadow-lg); }
  .pick button { border-radius: 14px; }

  /* 알림 메시지 */
  .toast {
    border-radius: 999px; padding: 12px 22px;
    background: rgba(11, 31, 75, .92); backdrop-filter: blur(10px);
  }

  /* PC: 상단 메뉴를 알약형으로 */
  @media (min-width: 641px) {
    .nav { gap: 6px; padding-bottom: 10px; }
    .nav button { border-radius: 999px; padding: 8px 16px; }
    .nav button:hover { background: rgba(255, 255, 255, .08); }
    .nav button.on { background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
    .nav button.on::after { display: none; }
  }

  /* 휴대폰: 떠 있는 하단 메뉴 */
  @media (max-width: 640px) {
    .nav {
      left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
      padding: 6px; border-radius: 22px; border: 1px solid rgba(15, 23, 42, .06);
      background: rgba(255, 255, 255, .9); backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(16, 24, 40, .16);
    }
    .nav button { border-radius: 16px; }
    main { padding-bottom: 116px; }
    .toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
    .card { padding: 13px 12px; border-radius: 16px; }
    .grid.six .card { border-radius: 16px; padding: 13px 12px; }
    .card .avatar { box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px var(--c, var(--line)); }
    .login { border-radius: 20px; }
  }
  /* ---------- 복귀 · 작업 결과 보고 ---------- */
  .return-form {
    flex-basis: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px; margin-top: 2px;
    background: var(--surface-2); border: 1px solid rgba(0, 114, 206, .25); border-radius: 14px;
  }
  .reqlist .return-form { margin-top: 6px; }
  .rf-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ex-navy); }
  .rf-head .muted { font-size: 13px; margin-left: 4px; }
  .rf-head .ic { color: var(--ex-blue); }
  .opts.rf-outcome { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rf-outcome .opt > span { flex-direction: column; gap: 1px; line-height: 1.25; padding: 8px 4px; }
  .rf-outcome .opt small { font-size: 11.5px; font-weight: 500; opacity: .75; }
  .rf-outcome .oc-out input:checked + span { background: var(--out); border-color: var(--out); box-shadow: none; }
  .rf-outcome .oc-late input:checked + span { background: var(--late); border-color: var(--late); box-shadow: none; }
  .rf-outcome .oc-work input:checked + span { background: var(--work); border-color: var(--work); box-shadow: none; }
  .return-form textarea { resize: vertical; min-height: 0; font-size: 14px; }
  .return-form .seg .btn { flex: 1; padding: 10px; }
  .result {
    display: flex; flex-direction: column; gap: 3px; padding: 8px 12px; border-radius: 10px; font-size: 13.5px;
    background: var(--cb, var(--surface-2)); border-left: 3px solid var(--c, var(--line));
  }
  .result.res-work { --c: var(--work); --cb: var(--work-bg); }
  .result.res-out { --c: var(--out); --cb: var(--out-bg); }
  .result.res-late { --c: var(--late); --cb: var(--late-bg); }
  .result b { display: flex; align-items: center; gap: 4px; color: var(--ex-navy-2); font-size: 12.5px; }
  .result .chip { background: #fff; }
  .res-note { font-size: 13px; color: var(--text); white-space: normal; }
  .sched-hint {
    flex-basis: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px;
    padding: 8px 12px; border-radius: 12px; background: var(--trip-bg); color: var(--trip);
  }
  .sched-hint span { color: var(--text); }
  .sched-hint .btn { margin-left: auto; }

  /* ---------- 외근 이력: 기간 조회 ---------- */
  .hist-filter { margin-top: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .hf-ranges { gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 12px; }
  .hf-ranges .btn { border-color: transparent; background: transparent; color: var(--muted); }
  .hf-ranges .btn.on { background: var(--surface); color: var(--ex-blue); border-color: rgba(0, 114, 206, .3); box-shadow: 0 1px 3px rgba(16, 24, 40, .08); }
  .hf-period { font-weight: 700; font-size: 14px; color: var(--ex-navy); font-variant-numeric: tabular-nums; }
  .hf-dates { display: inline-flex; align-items: center; gap: 6px; }
  .hf-dates .inp, .hf-who { width: auto; padding: 6px 10px; font-size: 14px; }
  .hf-who { margin-left: auto; }
  .hf-export { display: inline-flex; align-items: center; gap: 5px; color: var(--work); border-color: rgba(13, 138, 91, .35); }
  .hf-export:hover { background: var(--work-bg); border-color: var(--work); }
  .hist-sum { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 10px; }
  .hist-sum span {
    padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    color: var(--c, var(--ex-navy)); background: var(--cb, var(--surface)); border: 1px solid rgba(15, 23, 42, .06);
  }
  .hist-sum span.zero { opacity: .45; }
  .hist td.c-date { font-weight: 700; color: var(--ex-navy-2); font-variant-numeric: tabular-nums; }
  .hist td.c-result { white-space: normal; min-width: 150px; max-width: 260px; }
  .hist td.c-result .chip { margin-right: 4px; }

  @media (max-width: 860px) {
    .hf-who { margin-left: 0; }
  }
  @media (max-width: 640px) {
    .opts.rf-outcome { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .rf-outcome .opt > span { min-height: 46px; font-size: 14px; }
    .rf-outcome .opt small { display: none; }
    .hist-filter { padding: 10px; }
    .hf-ranges { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .hf-ranges .btn { padding: 6px 0; }
    .hf-period { flex: 1 1 100%; }
    .hf-dates { width: 100%; }
    .hf-dates .inp { flex: 1; min-width: 0; }
    .hf-who { flex: 1; min-width: 0; }
    .hist td.c-date { grid-column: 1; grid-row: 1; font-size: 12.5px; align-self: center; }
    .hist tr:has(.c-date) td.c-name { grid-column: 1 / -1; }
    .hist td.c-result { max-width: none; }
  }
  /* ---------- 공동작업 ---------- */
  :root { --co: #8c3a86; --co-bg: #f6ebf5; }
  .co-tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 6px; border-radius: 999px;
    background: var(--co-bg); color: var(--co); font-size: 12px; font-weight: 700; white-space: nowrap; max-width: 100%;
  }
  .co-tag svg { width: 13px; height: 13px; flex: none; }
  .co-tag span { overflow: hidden; text-overflow: ellipsis; }
  .co-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kv-mini .co-tag { align-self: flex-start; margin-top: 2px; font-size: 11.5px; }
  .co-plus { font-size: 12px; font-weight: 700; color: var(--co); }
  .co-members { display: flex; flex-wrap: wrap; gap: 4px; }
  .co-m { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 8px; background: var(--co-bg); color: var(--co); font-weight: 700; font-size: 13px; }
  .co-m small { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--co); border-radius: 4px; padding: 0 4px; }
  .co-m em { font-style: normal; font-size: 11px; color: var(--late); font-weight: 700; }
  .co-owner { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; color: var(--co); }
  .co-pick input:checked + span { background: var(--co); border-color: var(--co); box-shadow: 0 2px 6px rgba(140, 58, 134, .25); }
  .co-pick input:disabled + span { cursor: not-allowed; }
  .co-pick input:disabled:checked + span { opacity: .85; }
  .hist td.c-name .co-tag { margin-top: 3px; font-size: 11.5px; }
  /* 타임라인: 공동작업은 자홍색 계열 */
  .tl-bar.co.active { background: linear-gradient(180deg, #a34d9c, var(--co)); color: #fff; box-shadow: 0 2px 6px rgba(140, 58, 134, .3); }
  .tl-bar.co.planned { background: var(--co-bg); color: #6d2a68; box-shadow: inset 0 0 0 1.5px rgba(140, 58, 134, .4); }
  .tl-bar.co.done { background: #e9d6e7; color: #5e2a5a; }
  .tl-bar.co.approved { background: var(--co-bg); color: #6d2a68; box-shadow: inset 0 0 0 1.5px #7fcfa6; }
  .tl-bar.co.pending { background: var(--co-bg); color: #6d2a68; box-shadow: inset 0 0 0 1.5px #f3c071; }
  .tl-co { display: inline-grid; place-items: center; flex: none; width: 13px; height: 13px; margin-right: 3px; font-style: normal; }
  .tl-co svg { width: 13px; height: 13px; }
  .tl-key.co { background: linear-gradient(180deg, #a34d9c, var(--co)); }
  .co-key { color: var(--co); font-weight: 700; }
  /* =========================================================
     휴가 · 출장 일정표 — 2026 리디자인
     · 주 이동 알약 · 요약 카드(벤토) · 여러 날 이어지는 일정 막대 · 오늘 열 강조
     · 등록 양식: 큰 구분 타일 · 빠른 날짜 칩 · 기간 자동 계산 · 날짜 타일 목록
     ========================================================= */
  .sc-week { --cal-cols: 150px repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, .62fr)); }
  .wk-nav {
    display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px;
    background: rgba(255, 255, 255, .85); backdrop-filter: blur(10px);
    border: 1px solid rgba(15, 23, 42, .07); box-shadow: 0 4px 16px rgba(16, 24, 40, .06);
  }
  .wk-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--ex-navy);
    display: grid; place-items: center; transition: background .15s;
  }
  .wk-btn svg { width: 18px; height: 18px; }
  .wk-btn:hover { background: var(--ex-blue-weak); color: var(--ex-blue); }
  .wk-label { display: flex; flex-direction: column; align-items: center; min-width: 150px; line-height: 1.2; padding: 0 4px; }
  .wk-label b { font-size: 15px; letter-spacing: -0.02em; color: var(--ex-navy); font-variant-numeric: tabular-nums; }
  .wk-label span { font-size: 11.5px; font-weight: 700; color: var(--ex-blue); }
  .wk-today {
    height: 36px; padding: 0 16px; border-radius: 999px; border: 0; font-weight: 800; font-size: 13px;
    background: linear-gradient(180deg, #1786e0, var(--ex-blue)); color: #fff; box-shadow: 0 2px 8px rgba(0, 114, 206, .3);
  }
  .wk-today:disabled { background: var(--surface-2); color: #6b7385; box-shadow: none; cursor: default; }

  /* 주간 달력 */
  .cal { margin-top: 18px; padding: 0; overflow: hidden; border-radius: 18px; }
  .cal-scroll { overflow-x: auto; }
  .cal-head, .cal-row { display: grid; grid-template-columns: var(--cal-cols); min-width: 720px; }
  .cal-head { background: linear-gradient(180deg, #f8fafd, #f2f5fa); border-bottom: 1px solid var(--line); }
  .dh { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 12px; }
  .dh.corner { align-items: flex-start; justify-content: flex-end; padding-left: 16px; font-size: 12px; font-weight: 800; color: var(--muted); }
  .dh .dn { font-size: 11.5px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
  .dh .dd {
    min-width: 34px; height: 34px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; grid-auto-flow: column;
    font-size: 17px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .dh .dd small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .dh.weekend .dn, .dh.weekend .dd { color: #6b7385; }
  .dh.today .dn { color: var(--ex-blue); }
  .dh.today .dd { background: linear-gradient(160deg, #2b93e6, var(--ex-blue)); color: #fff; box-shadow: 0 4px 12px rgba(0, 114, 206, .35); }
  .dh.today .dd small { color: rgba(255, 255, 255, .8); }
  .dh em { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; border-radius: 3px 3px 0 0; background: var(--ex-red); font-size: 0; }
  .cal-body .cal-row { position: relative; border-bottom: 1px solid var(--line); transition: background .15s; }
  .cal-body .cal-row:last-child { border-bottom: 0; }
  .cal-row:hover { background: rgba(0, 114, 206, .025); }
  .cal-row.mine .who-cell b::after { content: "본인"; font-size: 10px; font-weight: 700; background: var(--ex-blue); color: #fff; border-radius: 4px; padding: 1px 4px; margin-left: 4px; vertical-align: 1px; }
  .who-cell { grid-column: 1; grid-row: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; min-width: 0; z-index: 1; }
  .who-cell span { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .who-cell b { font-size: 14px; white-space: nowrap; }
  .who-cell small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-cell .avatar.sm { width: 32px; height: 32px; background: var(--surface-2); }
  .cal-bg { grid-row: 1 / -1; border-left: 1px solid #edf0f5; }
  .cal-bg.weekend { background: repeating-linear-gradient(135deg, #fafbfd 0 6px, #f5f7fb 6px 12px); }
  .cal-bg.today { background: linear-gradient(180deg, rgba(0, 114, 206, .08), rgba(0, 114, 206, .035)); border-left-color: rgba(0, 114, 206, .18); }
  .cal-bg.today + .cal-bg { border-left-color: rgba(0, 114, 206, .18); }

  /* 일정 막대 */
  .ev {
    position: relative; z-index: 2; align-self: center; margin: 3px 4px; min-width: 0;
    display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border-radius: 11px;
    background: var(--cb); color: var(--c); font-size: 12.5px; line-height: 1.2; cursor: default;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);
    transition: transform .15s, box-shadow .15s;
  }
  .ev:hover { transform: translateY(-1px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent), 0 6px 14px color-mix(in srgb, var(--c) 18%, transparent); }
  .ev-ic { flex: none; width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center; background: var(--c); color: #fff; }
  .ev-ic svg { width: 13px; height: 13px; }
  .ev b { flex: none; font-weight: 800; white-space: nowrap; }
  .ev small { min-width: 0; font-size: 11.5px; font-weight: 500; color: var(--text); opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.pending { background: rgba(255, 255, 255, .9); box-shadow: none; outline: 1.5px dashed color-mix(in srgb, var(--c) 70%, transparent); outline-offset: -1.5px; }
  .ev.pending .ev-ic { background: color-mix(in srgb, var(--c) 18%, #fff); color: var(--c); }
  .ev.co { --c: var(--co); --cb: var(--co-bg); }
  .ev.cont-l { margin-left: 0; border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
  .ev.cont-r { margin-right: 0; border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
  .cal-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 12px 16px; border-top: 1px solid var(--line); background: #fbfcfe; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .lg i { width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; background: var(--c); color: #fff; font-style: normal; }
  .lg i svg { width: 11px; height: 11px; }
  .lg.st-co { --c: var(--co); }
  .lg-pending i { background: #fff; outline: 1.5px dashed var(--c); outline-offset: -1.5px; }
  .cal-agenda { display: none; }

  /* 등록 양식 + 다가오는 일정 */
  .sc-bottom { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  .sc-form { padding: 20px; display: flex; flex-direction: column; gap: 18px; border-radius: 18px; }
  .form-head { display: flex; align-items: center; gap: 12px; }
  .form-head div { display: flex; flex-direction: column; line-height: 1.3; }
  .form-head b { font-size: 16px; letter-spacing: -0.02em; }
  .form-head small { font-size: 12.5px; color: var(--muted); }
  .fh-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ex-blue); background: var(--ex-blue-weak); box-shadow: inset 0 0 0 1px rgba(0, 114, 206, .18); }
  .fh-ic svg { width: 20px; height: 20px; }
  .sc-form .field > .lbl { display: flex; align-items: center; gap: 8px; }
  .type-tiles { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
  .tile { position: relative; cursor: pointer; }
  .tile input { position: absolute; opacity: 0; inset: 0; }
  .tile-in {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 12px 11px; border-radius: 16px;
    border: 1.5px solid var(--line); background: var(--surface); transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
  }
  .tile:hover .tile-in { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); transform: translateY(-1px); }
  .tile-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--cb); color: var(--c); margin-bottom: 4px; transition: background .15s, color .15s; }
  .tile-ic svg { width: 20px; height: 20px; }
  .tile-in b { font-size: 15px; }
  .tile-in small { font-size: 11.5px; color: var(--muted); }

<script>
/* =========================================================
   저장소 — 1단계는 브라우저 localStorage.
   2단계에서는 load()/save()만 서버 API 호출로 바꾸면 된다.
   ========================================================= */
const STORE_KEY = 'gj-maint-proto-v15';
const SESSION_KEY = 'gj-maint-proto-user';
const SEED = JSON.parse(document.getElementById('seed').textContent);

function freshState() {
  const s = JSON.parse(JSON.stringify(SEED));
  s.clockStart = Date.now(); // 시제품 시계: baseTime부터 실제 시간만큼 흐른다
  return s;
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const s = freshState();
  save(s);
  return s;
}
function save(s = state) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}
// 마지막으로 선택한 사용자를 기억 (브라우저를 닫았다 열어도 유지, "변경"을 누를 때까지)
function getSessionUser() { try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; } }
function setSessionUser(id) {
  try { id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

let state = load();
let currentUserId = getSessionUser();
let view = 'board';
let pinTarget = null;
let pinError = '';

/* ---------- 시간 ---------- */
const pad = n => String(n).padStart(2, '0');
function now() { return new Date(new Date(state.baseTime).getTime() + (Date.now() - state.clockStart)); }
function toLocalISO(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
}
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function fmtDT(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return sameDay(d, now()) ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
function fmtClock() {
  const d = now();
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DAYS[d.getDay()]}) <b>${pad(d.getHours())}:${pad(d.getMinutes())}</b>`;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 공동작업: 등록한 직원(requesterId) + 함께 작업하는 직원(coWorkerIds)
const members = r => [r.requesterId, ...(r.coWorkerIds || [])];
const isMember = (r, id) => members(r).includes(id);

  if (!isCoWork(r)) return '';

  return `<span class="co-tag" title="공동작업: ${esc(namesOf(members(r)))}">${IC.team}<span>공동${others.length ? ' · ' + esc(namesOf(others)) : ''}</span></span>`;

function statusView(u) {
  if (u.status === '외근') {
    const r = reqById(u.currentRequestId);
    if (r && new Date(r.expectedReturnAt) < now()) {
      const lateMin = Math.floor((now() - new Date(r.expectedReturnAt)) / 60000);
      return { label: '복귀 지연', cls: 'late', req: r, lateMin };

function navTabs(u) {

}

        <button type="button" class="btn" data-action="cancel-return">취소</button>
      </div>
    </form>`;
}
function resultHTML(r, compact) {
  if (!r.result) return '';
  const cls = OUTCOME_CLS[r.result.outcome] || 'work';
  return compact
    ? `<span class="chip st-${cls}">${esc(r.result.outcome)}</span>${r.result.note ? ` <span class="res-note">${esc(r.result.note)}</span>` : ''}`
    : `<div class="result res-${cls}"><b>${ic('clipboard')} 작업 결과 · <span class="chip st-${cls}">${esc(r.result.outcome)}</span></b>${r.result.note ? `<span>${esc(r.result.note)}</span>` : ''}</div>`;
}

function doReturn(outcome, note) {
  const u = me();
  const r = reqById(u.currentRequestId);
  const at = toLocalISO(now());
  if (r) { r.status = '복귀 완료'; r.returnedAt = at; r.result = { outcome, note }; r.returnedBy = u.id; }
  // 공동작업은 함께 나간 직원 모두 복귀 처리
  const team = r ? members(r).map(userById).filter(w => w && w.status === '외근' && w.currentRequestId === r.id) : [u];
  if (!team.includes(u)) team.push(u);
  team.forEach(w => setStatus(w, '근무', r ? `${r.id} 복귀 · ${outcome}${w.id !== u.id ? ` (${u.name} 처리)` : ''}` : '복귀'));
  returnOpen = false; returnDraft.outcome = ''; returnDraft.note = '';
  commit();
  const late = r ? Math.floor((new Date(at) - new Date(r.expectedReturnAt)) / 60000) : 0;
  const others = team.filter(w => w.id !== u.id);
  const coTxt = others.length ? ` 공동작업자(${others.map(w => w.name).join(', ')})도 함께 "근무"로 바뀝니다.` : '';
  toast((late > 0 ? `복귀 처리했습니다. (예상보다 ${late}분 늦음)` : '복귀 처리했습니다.') + ' 작업 결과를 감독원에게 보고했습니다.' + coTxt);
}

// 요청 상태 표시 (출발 전 승인 / 복귀 지연 구분)
function reqLabel(r) {
  if (r.status === '외근 중' && new Date(r.expectedReturnAt) < now()) return { label: '복귀 지연', cls: 'late' };
  if (r.status === '승인') return isStartLate(r) ? { label: '출발 지연', cls: 'out' } : { label: '승인 · 출발 전', cls: 'work' };
  return { label: r.status, cls: REQ_CLS[r.status] };
}
const reqChip = r => { const l = reqLabel(r); return `<span class="chip st-${l.cls}">${l.label}</span>`; };

const todayRequests = () => {
  const today = now();
  return state.requests
    .filter(r => sameDay(new Date(r.departAt), today) || sameDay(new Date(r.requestedAt), today))
    .sort((a, b) => a.departAt.localeCompare(b.departAt));
};
const recentLogs = () => state.statusLogs.slice(-8).reverse();

/* ---------- 오늘 외근 타임라인 ----------
   시간축 위에 직원별 외근을 막대로 표시
   · 진행(파랑) · 남은 예정(연파랑 점선) · 지연(빨강 빗금) · 복귀 완료(회색)
   · 승인·출발 전(초록 점선) · 승인 대기(주황 점선) · 지금 시각(빨간 세로선) */
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function timelineHTML() {
  const nowD = now();
  const day0 = new Date(nowD); day0.setHours(0, 0, 0, 0);
  const H = iso => (new Date(iso) - day0) / 3600000;
  const nowH = (nowD - day0) / 3600000;
  const list = todayRequests().filter(r => r.status !== '반려' && r.status !== '취소' && sameDay(new Date(r.departAt), nowD));

  // 시간 범위: 기본 08~19시, 일정이 벗어나면 넓힘
  let start = 8, end = 19;
  list.forEach(r => {
    start = Math.min(start, Math.floor(H(r.departAt)));
    end = Math.max(end, Math.ceil(Math.max(H(r.expectedReturnAt), r.returnedAt ? H(r.returnedAt) : 0)));
  });
  if (nowH >= start) end = Math.max(end, Math.ceil(nowH));
  start = Math.max(0, start); end = Math.min(24, end);
  const span = end - start;
  const pct = h => (Math.min(Math.max(h, start), end) - start) / span * 100;

  const seg = (from, to, cls, label, title) => {
    if (to <= from) return null;
    return { from, to, cls, label, title };
  };
  function segments(r) {
    const dep = H(r.status !== '승인' && r.startedAt ? r.startedAt : r.departAt), exp = H(r.expectedReturnAt); // 외근 막대는 실제 출발(외근 시작) 시각부터
    const where = isCoWork(r) ? `공동 · ${r.location}` : r.location;
    const info = `${r.startedAt ? `[외근 시작 ${fmtDT(r.startedAt)}] ` : ''}${r.id} · ${r.location}${r.locationDetail ? ' ' + r.locationDetail : ''} · ${fmtDT(r.departAt)}~${fmtDT(r.expectedReturnAt)}${isCoWork(r) ? ` · 공동작업(${namesOf(members(r))})` : ''}`;
    if (r.status === '복귀 완료') {
      const ret = H(r.returnedAt);
      return [seg(dep, Math.min(ret, exp), 'done', where, `${info} · 복귀 ${fmtDT(r.returnedAt)}`),
              ret > exp ? seg(exp, ret, 'late', `+${Math.round((ret - exp) * 60)}분`, '늦은 복귀') : null];
    }
    if (r.status === '외근 중') {
      if (nowH <= exp) return [seg(dep, nowH, 'active', where, `${info} · 외근 중`), seg(Math.max(dep, nowH), exp, 'planned', '', '복귀 예정')];
      return [seg(dep, exp, 'active', where, `${info} · 외근 중`), seg(exp, nowH, 'late', `+${Math.floor((nowH - exp) * 60)}분`, '복귀 지연')];
    }
    if (r.status === '승인') {
      // 출발 예정이 지났는데 아직 "외근 시작"을 안 누름 → 미출발 구간
      if (isStartLate(r)) return [seg(dep, Math.min(nowH, exp), 'waiting', `미출발 +${startDelayMin(r)}분`, `${info} · 아직 외근 시작 안 함`),
                                  seg(Math.max(dep, nowH), exp, 'approved', '', '승인 · 출발 전')];
      return [seg(dep, exp, 'approved', where, `${info} · 승인 · 출발 전`)];
    }
    if (r.status === '승인 대기') return [seg(dep, exp, 'pending', where, `${info} · 승인 대기`)];
    return [];
  }
  const barsHTML = r => {
    const s = segments(r).filter(Boolean);
    const co = isCoWork(r);
    return s.map((x, i) => `<div class="tl-bar ${x.cls}${co ? ' co' : ''}${i > 0 ? ' joinL' : ''}${i < s.length - 1 ? ' joinR' : ''}"
        style="left:${pct(x.from)}%;width:${pct(x.to) - pct(x.from)}%" title="${esc(x.title)}">${co && x.label && x.cls !== 'late' ? `<i class="tl-co">${IC.team}</i>` : ''}<span>${esc(x.label)}</span></div>`).join('');
  };

  const workers = state.users.filter(u => !isSup(u));
  const rows = workers.map(u => {
    const mine = list.filter(r => isMember(r, u.id));
    const empty = !mine.length ? `<span class="tl-empty">${u.status === '휴가' ? '휴가' : '외근 없음'}</span>` : '';
    return `<div class="tl-row">
      <div class="tl-who">${avatarHTML(u, 'xs')}<span>${esc(u.name)}</span></div>
      <div class="tl-track" style="--n:${span}">${mine.map(barsHTML).join('')}${empty}</div>
    </div>`;
  }).join('');
  const ticks = Array.from({ length: span + 1 }, (_, i) =>
    `<span class="${i % 2 ? 'odd' : ''}" style="left:${i / span * 100}%">${start + i}시</span>`).join('');
  const showNow = nowH >= start && nowH <= end;
  const legend = [['active', '외근 중'], ['planned', '복귀 예정'], ['late', '지연'], ['done', '복귀 완료'], ['approved', '승인·출발 전'], ['waiting', '미출발'], ['pending', '승인 대기'], ['co', '공동작업']]
    .map(([c, t]) => `<span${c === 'co' ? ' class="co-key"' : ''}><i class="tl-key ${c}"></i>${t}</span>`).join('');

  return `
  <div class="panel timeline">
    <div class="tl-head"><b>${ic('car')} 오늘 외근 타임라인</b><span class="muted">${hm(nowD)} 기준</span></div>
    <div class="tl-body">
      <div class="tl-row tl-axis"><div class="tl-who"></div><div class="tl-scale">${ticks}</div></div>
      ${rows}
      ${showNow ? `<div class="tl-nowwrap"><div class="tl-now" style="left:${pct(nowH)}%"><em>${hm(nowD)}</em></div></div>` : ''}
    </div>
    <div class="tl-legend">${legend}</div>
  </div>`;
}

/* ---------- 외근 이력: 기간별 조회 · 엑셀 내보내기 ----------
   기간(오늘 · 이번 주 · 이번 달 · 직접 선택)과 직원으로 골라 보고, 고른 목록 그대로 엑셀(CSV)로 내려받는다.
   출발일 또는 요청일이 기간 안에 있는 요청을 보여 준다. */
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function weekStartOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
const fmtDay = k => { const d = keyDate(k); return `${d.getMonth() + 1}/${d.getDate()} (${DAYS[d.getDay()]})`; };
const lateMinOf = r => r.returnedAt ? Math.floor((new Date(r.returnedAt) - new Date(r.expectedReturnAt)) / 60000) : 0;

const RANGES = [['today', '오늘'], ['week', '이번 주'], ['month', '이번 달'], ['custom', '직접 선택']];
const histF = { range: 'today', from: '', to: '', who: '' };
function histRange() {
  const t = now();
  if (histF.range === 'week') { const s = weekStartOf(t); return [dkey(s), dkey(addDays(s, 6))]; }
  if (histF.range === 'month') return [dkey(new Date(t.getFullYear(), t.getMonth(), 1)), dkey(new Date(t.getFullYear(), t.getMonth() + 1, 0))];
  if (histF.range === 'custom') {
    let a = histF.from || dkey(new Date(t.getFullYear(), t.getMonth(), 1)), b = histF.to || dkey(t);
    if (a > b) [a, b] = [b, a];
    return [a, b];
  }
  return [dkey(t), dkey(t)];
}
function histList() {
  if (histF.range === 'today') return todayRequests().filter(r => !histF.who || isMember(r, histF.who));
  const [a, b] = histRange();
  const inRange = iso => !!iso && iso.slice(0, 10) >= a && iso.slice(0, 10) <= b;
  return state.requests
    .filter(r => (inRange(r.departAt) || inRange(r.requestedAt)) && (!histF.who || isMember(r, histF.who)))
    .sort((x, y) => y.departAt.localeCompare(x.departAt)); // 여러 날은 최근 것부터
}
function histFilterHTML() {
  const [a, b] = histRange();
  const workers = state.users.filter(u => !isSup(u));
  return `
  <div class="panel hist-filter">
    <div class="seg hf-ranges" role="group" aria-label="조회 기간">${RANGES.map(([id, l]) =>
      `<button class="btn small${histF.range === id ? ' on' : ''}" data-action="hist-range" data-range="${id}" aria-pressed="${histF.range === id}">${l}</button>`).join('')}</div>
    ${histF.range === 'custom'
      ? `<span class="hf-dates"><input class="inp" type="date" data-hf="from" value="${a}" aria-label="시작일"><span>~</span><input class="inp" type="date" data-hf="to" value="${b}" aria-label="종료일"></span>`
      : `<span class="hf-period">${a === b ? fmtDay(a) : `${fmtDay(a)} ~ ${fmtDay(b)}`}</span>`}
    <select class="inp hf-who" data-hf="who" aria-label="직원">
      <option value="">전체 직원</option>${workers.map(u => `<option value="${u.id}" ${histF.who === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
    </select>
    <button class="btn small hf-export" data-action="export-csv" title="지금 보이는 목록을 엑셀에서 열 수 있는 CSV 파일로 내려받습니다">${ic('download')} 엑셀 내보내기</button>
  </div>`;
}
function histSummaryHTML(list) {
  const done = list.filter(r => r.status === '복귀 완료');
  const items = [
    ['전체', list.length, ''],
    ['복귀 완료', done.length, 'leave'],
    ['늦은 복귀', done.filter(r => lateMinOf(r) > 0).length, 'late'],
    ['일부 완료 · 미완료', done.filter(r => r.result && r.result.outcome !== '완료').length, 'out'],
    ['진행 · 대기', list.filter(r => ['승인 대기', '승인', '외근 중'].includes(r.status)).length, 'field'],
    ['반려', list.filter(r => r.status === '반려').length, 'late'],
    ['취소', list.filter(r => r.status === '취소').length, 'leave'],
  ];
  return `<div class="hist-sum">${items.map(([l, n, c]) => `<span class="${c ? 'st-' + c : ''}${n ? '' : ' zero'}">${l} <b>${n}</b></span>`).join('')}</div>`;
}

function historyHTML(list) {
  const multi = histF.range !== 'today';
  const lateTxt = r => { const m = lateMinOf(r); return m > 0 ? ` <b class="late-txt">(+${m}분)</b>` : ''; };
  const empty = multi ? '선택한 기간에 외근 이력이 없습니다.' : '오늘 외근 이력이 없습니다.';
  return `
  <div class="panel tablewrap">${list.length ? `<table class="hist">
    <thead><tr>${multi ? '<th>날짜</th>' : ''}<th>요청자</th><th>상태</th><th>작업장소 · 구분</th><th>요청 / 승인</th><th>예정 출발 ~ 복귀</th><th>실제 출발 / 복귀</th><th>작업 결과</th></tr></thead>
    <tbody>${list.map(r => {
      const u = userById(r.requesterId), a = userById(r.approverId);
      // 날짜 칸이 있을 때는 출발일과 같은 날의 시각은 시:분만 표시
      const t = iso => multi && iso && iso.slice(0, 10) === r.departAt.slice(0, 10) ? hm(new Date(iso)) : fmtDT(iso);
      const decided = r.decidedAt ? `${r.status === '반려' ? '반려' : '승인'} ${t(r.decidedAt)} ${esc(a ? a.name : '')}` : '승인 대기';
      const res = r.result ? resultHTML(r, true) : r.status === '반려' && r.rejectReason ? `<span class="muted">반려: ${esc(r.rejectReason)}</span>`
        : r.status === '취소' ? `<span class="muted">취소${r.canceledBy ? `(${esc(userById(r.canceledBy).name)})` : ''}: ${esc(r.cancelReason || '')}</span>` : '-';
      return `<tr>
        ${multi ? `<td class="c-date">${fmtDay(r.departAt.slice(0, 10))}</td>` : ''}
        <td class="c-name"><b>${esc(u ? u.name : '')}</b>${isCoWork(r) ? `<br>${coTag(r, r.requesterId)}` : ''}</td>
        <td class="c-status">${reqChip(r)}</td>
        <td class="wrap">${reqSummary(r)}<br><small class="muted">${esc(r.workType)}</small></td>
        <td class="c-wide" data-label="요청 / 승인">요청 ${t(r.requestedAt)}<br><small class="muted">${decided}</small></td>
        <td class="c-wide" data-label="예정">${t(r.departAt)} ~ ${t(r.expectedReturnAt)}</td>
        <td class="c-wide" data-label="실제">${r.startedAt ? `출발 ${t(r.startedAt)}${r.startSafety ? ` <span class="ss-ok" title="출발 전 안전 재확인 완료">${ic('shield')}</span>` : ''}` : r.status === '승인' ? (isStartLate(r) ? '<b class="late-txt">미출발</b>' : '출발 전') : r.status === '취소' ? `취소 ${t(r.canceledAt)}` : '-'}${r.returnedAt ? `<br>복귀 ${t(r.returnedAt)}${lateTxt(r)}` : ''}</td>
        <td class="c-wide c-result" data-label="작업 결과">${res}</td>
      </tr>`;
    }).join('')}</tbody></table>` : `<p class="empty">${empty}</p>`}</div>`;
}

// 엑셀(CSV) 내보내기: 한글이 깨지지 않도록 BOM을 붙이고, =·+·-·@로 시작하는 값은 수식으로 실행되지 않게 막는다
function csvCell(v) {
  let t = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
  return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
}
const csvTime = iso => iso ? iso.slice(0, 16).replace('T', ' ') : '';
function historyCSV(list) {
  const head = ['요청번호', '요청자', '분야', '공동작업자', '작업 구분', '작업 장소', '상세 장소', '작업 내용', '상태', '요청 시각', '승인/반려',
    '처리 감독원', '처리 시각', '출발 예정', '예상 복귀', '실제 출발(외근 시작)', '실제 복귀', '늦은 복귀(분)', '작업 결과', '조치 내용', '감독원 요청사항', '반려/취소 사유', '취소한 직원', '안전 준수 확인(요청 시)', '출발 전 안전 재확인'];
  const rows = list.slice().sort((x, y) => x.departAt.localeCompare(y.departAt)).map(r => {
    const u = userById(r.requesterId), a = userById(r.approverId), late = lateMinOf(r);
    return [r.id, u ? u.name : r.requesterId, u ? u.part || '' : '', namesOf(r.coWorkerIds || []), r.workType, r.location, r.locationDetail || '', r.description,
      reqLabel(r).label, csvTime(r.requestedAt), r.decidedAt ? (r.status === '반려' ? '반려' : '승인') : '', a ? a.name : '', csvTime(r.decidedAt),
      csvTime(r.departAt), csvTime(r.expectedReturnAt), csvTime(r.startedAt), csvTime(r.returnedAt), late > 0 ? late : '',
      r.result ? r.result.outcome : '', r.result ? r.result.note : '', r.instruction || '', r.rejectReason || r.cancelReason || '', r.canceledBy ? userById(r.canceledBy).name : '', (r.safetyChecked || []).join(' · '), (r.startSafety || []).join(' · ')];
  });
  return '﻿' + [head, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
}
function exportHistory() {
  const list = histList();
  if (!list.length) { toast('내보낼 외근 이력이 없습니다.'); return; }
  const [a, b] = histRange();
  const who = histF.who ? '_' + userById(histF.who).name : '';
  const name = `외근이력_${a === b ? a : `${a}_${b}`}${who}.csv`;
  const url = URL.createObjectURL(new Blob([historyCSV(list)], { type: 'text/csv;charset=utf-8' }));
  const link = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(link); link.click();
  setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 1000);
  toast(`${list.length}건을 "${name}" 파일로 내려받았습니다.`);
}

// 감독원은 상태만 표시하고 변경 시각은 기록하지 않는다
function setStatus(u, to, note) {
  if (!isSup(u) && u.status !== to)
    state.statusLogs.push({ at: toLocalISO(now()), userId: u.id, from: u.status, to, note: note || '' });
  u.status = to;
  u.statusNote = note || '';
  if (to !== '외근') u.currentRequestId = null;
}

function recentLogsHTML() {
  const logs = recentLogs();
  if (!logs.length) return '<div class="panel"><p class="empty">최근 상태 변경이 없습니다.</p></div>';
  return `
  <div class="panel"><ul class="loglist">${logs.map(l => {
    const u = userById(l.userId);
    return `<li><time>${fmtDT(l.at)}</time><b>${esc(u ? u.name : l.userId)}</b>
      <span class="chip st-${STATUS_CLS[l.from] || 'work'}">${stLabel(l.from)}</span><span class="arr" aria-label="에서"></span>
      <span class="chip st-${STATUS_CLS[l.to] || 'work'}">${stLabel(l.to)}</span>
      ${l.note ? `<span class="muted">${esc(l.note)}</span>` : ''}</li>`;
  }).join('')}</ul></div>`;
}

function boardHTML() {
  const counts = {};
  state.users.forEach(u => { const l = statusView(u).label; counts[l] = (counts[l] || 0) + 1; });
  const order = ['근무', '외근', '복귀 지연', '외출', '출장', '휴가'];

  return `
  ${pageHead('board', '근무현황', '감독원 · 용역직원 6명의 근무상황을 실시간으로 함께 봅니다.',
    `<div class="summary">${order.filter(l => counts[l]).map(l => `<span class="st-${STATUS_CLS[l]}">${stLabel(l)} <b>${counts[l]}</b></span>`).join('')}</div>`)}
  ${noticeBarHTML()}
  ${pending ? `<div class="banner">승인 대기 ${pending}건이 있습니다.
     <button class="btn small" data-action="go" data-view="approve">승인 관리로 이동</button></div>` : ''}

       <div class="grid six">${[...state.users.filter(isSup), ...state.users.filter(u => !isSup(u))].map(cardHTML).join('')}</div>`

  <p class="proto-note">시제품: 데이터는 이 브라우저에만 저장됩니다. 같은 브라우저의 다른 탭에서 다른 사용자로 들어가면 실시간 공유를 시험할 수 있습니다.
    <button class="btn small ghost" data-action="reset">더미 데이터로 초기화</button></p>`;

// 근무현황 안의 탭: 근무현황 / 외근 이력(기본 오늘, 기간 조회) / 최근 상태 변경

        data-action="board-tab" data-tab="${t.id}">
