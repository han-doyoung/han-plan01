const WORK_END_HOUR = 18;
function isNoReturn(r) {
  if (!r || r.status !== '외근 중') return false;
  const n = now(), exp = new Date(r.expectedReturnAt);
  if (n <= exp) return false;
  if (dkey(n) > dkey(exp)) return true;
  const end = new Date(exp); end.setHours(WORK_END_HOUR, 0, 0, 0);
  return n > new Date(Math.max(exp.getTime() + 3600000, end.getTime())); // 저녁 늦게 돌아오는 외근도 1시간은 "복귀 지연"
}
function statusView(u) {
  if (u.status === '외근') {
    const r = reqById(u.currentRequestId);
    if (r && new Date(r.expectedReturnAt) < now()) {
      const lateMin = Math.floor((now() - new Date(r.expectedReturnAt)) / 60000);
      return { label: isNoReturn(r) ? '미복귀' : '복귀 지연', cls: 'late', req: r, lateMin };
    }
    return { label: '외근', cls: 'field', req: r };
  }
  return { label: u.status, cls: STATUS_CLS[u.status] || 'work' };
}

/* ---------- 확인 창 (shadcn/ui AlertDialog 모양) — 브라우저 기본 confirm 대신 ---------- */
function uiConfirm(message, { title = '확인해 주세요', ok = '확인', cancel = '취소', danger = false } = {}) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'cf-wrap';
    wrap.innerHTML = `<div class="cf-bg" data-cf="0"></div>
      <section class="cf${danger ? ' danger' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" aria-describedby="cf-msg">
        <div class="cf-head"><span class="cf-ic" aria-hidden="true">${danger ? IC.alert : IC.info}</span>
          <div><h2 class="cf-title" id="cf-title">${esc(title)}</h2><p class="cf-msg" id="cf-msg">${esc(message)}</p></div></div>
        <div class="cf-foot"><button type="button" class="btn" data-cf="0">${esc(cancel)}</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-cf="1">${esc(ok)}</button></div>
      </section>`;
    const btns = () => [...wrap.querySelectorAll('button')];
    const done = v => {
      document.removeEventListener('keydown', onKey, true);
      wrap.remove();
      if (!document.querySelector('.modal-wrap, .np-wrap, .cf-wrap')) document.body.classList.remove('modal-open');
      if (prev && prev.isConnected) prev.focus();
      resolve(v);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === 'Tab') { // 창 안에서만 이동
        const b = btns(), i = b.indexOf(document.activeElement);
        e.preventDefault(); b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length].focus();
      }
    };
    wrap.addEventListener('click', e => { const b = e.target.closest('[data-cf]'); if (b) { e.stopPropagation(); done(b.dataset.cf === '1'); } });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(wrap);
    document.body.classList.add('modal-open');
    wrap.querySelector('[data-cf="1"]').focus();
  });
}

function cardHTML(u) {
  const sv = statusView(u);
  const mine = u.id === currentUserId;
  let body;
  if (sv.req) {
    const r = sv.req;
    body = `<dl class="kv">
      <dt>대상 · 장소</dt><dd>${reqSummary(r)}</dd>
      <dt>출발</dt><dd>${fmtDT(r.startedAt || r.departAt)}${r.startedAt && r.startedAt.slice(0, 16) !== r.departAt.slice(0, 16) ? ` <small class="muted">(예정 ${fmtDT(r.departAt)})</small>` : ''}</dd>
      <dt>예상 복귀</dt><dd>${fmtDT(r.expectedReturnAt)}${sv.cls === 'late' ? ` <b class="late-txt">(${sv.lateMin}분 지연)</b>` : ''}${(r.extensions || []).length ? ` <small class="edited">연장 · 최초 ${fmtDT(r.plannedReturnAt)}</small>` : ''}</dd>
      <dt class="opt-row">작업</dt><dd class="opt-row">${esc(workLabel(r))}</dd>
      ${isCoWork(r) ? `<dt>공동</dt><dd>${coTag(r, u.id)}</dd>` : ''}
    </dl>
    <div class="kv-mini">
      <span class="loc">${reqSummary(r)}</span>
      <span class="time">${fmtDT(r.startedAt || r.departAt)}<span class="arr" aria-label="부터"></span>${fmtDT(r.expectedReturnAt)}${sv.cls === 'late' ? ` <b class="late-txt">+${sv.lateMin}분</b>` : ''}</span>
      ${coTag(r, u.id)}
    </div>`;
  } else {
    // 추가 기재 내용이 있을 때만 표시 (없으면 비워 둠)
    body = u.statusNote ? `<p class="note">${esc(u.statusNote)}</p>` : '';
    // 승인됐지만 아직 출발 전인 오늘 외근
    const ap = approvedFor(u.id).find(x => x.departAt.slice(0, 10) === dkey(now()));
    const rec = state.requests.find(x => isRecord(x) && isMember(x, u.id) && x.departAt.slice(0, 10) === dkey(now()) && new Date(x.expectedReturnAt) > now());
    if (rec) body += `<p class="plan-note res">${ic('office')} 상주지원 ${new Date(rec.departAt) <= now() ? '중' : '예정'} · ${fmtDT(rec.departAt)}~${fmtDT(rec.expectedReturnAt)} ${esc(orgText(rec))}</p>`;
    if (ap) body += `<p class="plan-note${isStartLate(ap) ? ' late' : ''}">${ic('car')} ${isStartLate(ap) ? `출발 지연 · ${startDelayMin(ap)}분 지남` : '승인 · 출발 전'} · ${fmtDT(ap.departAt)} ${esc(orgText(ap))}</p>`;
  }
  return `
  <article class="card st-${sv.cls}${mine ? ' mine' : ''}">
    <header class="card-head">
      <div class="who">${avatarHTML(u)}
        <div><div class="name">${esc(u.name)}${mine ? '<span class="me">본인</span>' : ''}</div><div class="role">${esc(u.part || u.role)}</div></div></div>
      <span class="badge">${stLabel(sv.label)}</span>
    </header>
    ${body}
  </article>`;
}

      <div class="seg">${state.statusOptions[u.role].map(s => {
        const field = s === '외근';
        const cur = u.status === s;
        return `<button class="btn small st-${STATUS_CLS[s]}${cur ? ' cur' : ''}" data-action="set-status" data-status="${s}"
                  ${field ? 'disabled title="작업승인이 나면 자동으로 바뀝니다"' : ''}>${stLabel(s)}</button>`;
      }).join('')}</div>
      <input class="memo" id="memo" maxlength="40" value="${esc(memoDraft)}" placeholder="추가 기재 (선택)" title="꼭 필요한 만큼만 적고 민감한 내용은 적지 마세요">
      ${nextApproved(u.id) ? startBoxHTML(nextApproved(u.id), u) : ''}
      ${scheduleHintHTML(u)}
      ${avatarPickerHTML(u)}
    </div>`;
}

/* ---------- 복귀 처리 + 작업 결과 보고 ----------
   "복귀 처리"를 누르면 결과(완료 · 일부 완료 · 미완료)와 조치 내용을 적고 복귀한다.
   일부 완료 · 미완료는 남은 작업이나 사유를 반드시 적는다. */
const OUTCOMES = [
  { v: '완료', cls: 'work', hint: '요청한 작업을 모두 마침' },
  { v: '일부 완료', cls: 'out', hint: '남은 작업이 있음' },
  { v: '미완료', cls: 'late', hint: '재방문 · 추가 조치 필요' },
];
const OUTCOME_CLS = { ...Object.fromEntries(OUTCOMES.map(o => [o.v, o.cls])), '미보고': 'leave' }; // 미보고: 감독원이 대신 복귀 처리하며 결과를 모를 때
let returnOpen = false;
const returnDraft = { outcome: '', note: '', lateReason: '' }; // 화면이 다시 그려져도 입력 내용 유지
document.addEventListener('input', e => {
  if (e.target.closest && e.target.closest('#return-form')) {
    const f = e.target.form;
    returnDraft.outcome = (f.querySelector('input[name="outcome"]:checked') || {}).value || '';
    returnDraft.note = f.elements.note.value;
    returnDraft.lateReason = f.elements.lateReason ? f.elements.lateReason.value : '';
  }
  if (e.target.closest && e.target.closest('#extend-form')) {
    const f = e.target.form;
    extDraft.to = f.elements.to.value; extDraft.reason = f.elements.reason.value;
  }
});
/* 복귀 연장: 작업이 길어지면 새 복귀 예정 시각 + 사유. 감독원에게 바로 표시, 연장한 시각 기준으로 지연 판단 */
let extendOpen = false;
const extDraft = { to: '', reason: '' };
const roundUp10 = d => { const x = new Date(d); x.setSeconds(0, 0); x.setMinutes(Math.ceil(x.getMinutes() / 10) * 10); return x; };
const extBase = r => new Date(Math.max(new Date(r.expectedReturnAt), now()));
function extendFormHTML(r) {
  const def = extDraft.to || toInputValue(roundUp10(new Date(extBase(r).getTime() + 3600000)));
  return `
    <form class="return-form extend-form" id="extend-form" data-id="${r.id}" novalidate>
      <div class="rf-head">${ic('alarm')} <b>복귀 시각 연장</b><span class="muted">현재 예상 복귀 ${fmtDT(r.expectedReturnAt)}${r.plannedReturnAt ? ` · 최초 ${fmtDT(r.plannedReturnAt)}` : ''}</span></div>
      <p class="hint">작업이 길어질 때 새 복귀 예정 시각과 사유를 적습니다. 감독원 화면에 바로 표시되고, 연장한 시각을 기준으로 복귀 지연을 판단합니다.</p>
      <div class="quick">${[30, 60, 120].map(m => `<button type="button" class="qchip" data-action="ext-quick" data-min="${m}">+${m < 60 ? m + '분' : m / 60 + '시간'}</button>`).join('')}</div>
      <input class="inp" type="datetime-local" name="to" value="${def}" aria-label="새 예상 복귀 시각">
      <input class="inp" name="reason" maxlength="60" placeholder="연장 사유 (필수) 예: 부품 교체 작업 추가" value="${esc(extDraft.reason)}">
      <p class="err" id="extend-err" hidden></p>
      <div class="seg">
        <button class="btn primary">연장 저장</button>
        <button type="button" class="btn" data-action="extend-close">닫기</button>
      </div>
    </form>`;
}
function returnFormHTML(r) {
  return `
    <form class="return-form" id="return-form" novalidate>
      <div class="rf-head">${ic('check')} <b>복귀 · 작업 결과 보고</b>${r ? `<span class="muted">${r.id} · ${reqSummary(r)}</span>` : ''}</div>
      ${r && isCoWork(r) ? `<p class="hint">공동작업입니다. 저장하면 ${esc(namesOf(members(r).filter(id => id !== currentUserId)))}도 함께 복귀 처리됩니다.</p>` : ''}
      <div class="opts rf-outcome">${OUTCOMES.map(o => `
        <label class="opt oc-${o.cls}"><input type="radio" name="outcome" value="${o.v}" ${returnDraft.outcome === o.v ? 'checked' : ''}>
          <span><b>${o.v}</b><small>${o.hint}</small></span></label>`).join('')}</div>
      <textarea class="inp" name="note" maxlength="200" rows="3"
        placeholder="조치 내용 (일부 완료 · 미완료는 필수)&#10;예: 스위치 포트 교체, 링크 정상 확인">${esc(returnDraft.note)}</textarea>
      ${r && now() > new Date(r.expectedReturnAt) ? `<label class="late-lbl">${ic('alarm')} 예상 복귀(${fmtDT(r.expectedReturnAt)})보다 ${Math.floor((now() - new Date(r.expectedReturnAt)) / 60000)}분 늦었습니다. 지연 사유를 적어 주세요.</label>
      <input class="inp" name="lateReason" maxlength="60" placeholder="지연 사유 (필수) 예: 장비 재부팅 대기" value="${esc(returnDraft.lateReason)}">` : ''}
      <p class="err" id="return-err" hidden></p>
      <div class="seg">
        <button class="btn primary">복귀 저장</button>
        <button type="button" class="btn" data-action="cancel-return">취소</button>
      </div>
    </form>`;
}
function resultHTML(r, compact) {
  if (!r.result) return '';
  const cls = OUTCOME_CLS[r.result.outcome] || 'work';
  return compact
    ? `<span class="chip st-${cls}">${esc(r.result.outcome)}</span>${r.result.note ? ` <span class="res-note">${esc(r.result.note)}</span>` : ''}`
    : `<div class="result res-${cls}"><b>${ic('clipboard')} 작업 결과 · <span class="chip st-${cls}">${esc(r.result.outcome)}</span></b>${r.result.note ? `<span>${esc(r.result.note)}</span>` : ''}</div>`;
}

function doReturn(outcome, note, lateReason = '') {
  const u = me();
  const r = reqById(u.currentRequestId);
  const at = toLocalISO(now());
  if (r) { r.status = '복귀 완료'; r.returnedAt = at; r.result = { outcome, note }; r.returnedBy = u.id; if (lateReason) r.lateReason = lateReason; }
  // 공동작업은 함께 나간 직원 모두 복귀 처리
  const team = r ? members(r).map(userById).filter(w => w && w.status === '외근' && w.currentRequestId === r.id) : [u];
  if (!team.includes(u)) team.push(u);
  team.forEach(w => setStatus(w, '근무', r ? `${r.id} 복귀 · ${outcome}${w.id !== u.id ? ` (${u.name} 처리)` : ''}` : '복귀'));
  if (r) audit('field', '복귀', r.id, `${outcome}${note ? ' · ' + note : ''}${lateReason ? ' · 지연 사유: ' + lateReason : ''}${team.length > 1 ? ' · 함께 ' + team.map(w => w.name).join(', ') : ''}`, { to: [...supIds(), ...members(r)] });
  returnOpen = false; returnDraft.outcome = ''; returnDraft.note = ''; returnDraft.lateReason = '';
  commit();
  const late = r ? Math.floor((new Date(at) - new Date(r.expectedReturnAt)) / 60000) : 0;
  const others = team.filter(w => w.id !== u.id);
  const coTxt = others.length ? ` 공동작업자(${others.map(w => w.name).join(', ')})도 함께 "근무"로 바뀝니다.` : '';
  toast((late > 0 ? `복귀 처리했습니다. (예상보다 ${late}분 늦음)` : '복귀 처리했습니다.') + ' 작업 결과를 감독원에게 보고했습니다.' + coTxt);
}

// 요청 상태 표시 (출발 전 승인 / 복귀 지연 구분)
function reqLabel(r) {
  if (isNoReturn(r)) return { label: '미복귀', cls: 'late' };
  if (r.status === '외근 중' && new Date(r.expectedReturnAt) < now()) return { label: '복귀 지연', cls: 'late' };
  if (r.status === '승인' && r.departAt.slice(0, 10) < dkey(now())) return { label: '기한 지남', cls: 'late' };
  if (r.status === '승인') return isStartLate(r) ? { label: '출발 지연', cls: 'out' } : { label: '승인 · 출발 전', cls: 'work' };
  return { label: r.status, cls: REQ_CLS[r.status] };
}
const reqChip = r => { const l = reqLabel(r); return `<span class="chip st-${l.cls}">${l.label}</span>`; };

const todayRequests = () => {
  const today = now();
  return state.requests
    .filter(r => sameDay(new Date(r.departAt), today) || sameDay(new Date(r.requestedAt), today))
    .sort((a, b) => a.departAt.localeCompare(b.departAt));
};
const recentLogs = () => state.statusLogs.slice(-8).reverse();

/* ---------- 오늘 외근 타임라인 ----------
   시간축 위에 직원별 외근을 막대로 표시
   · 진행(파랑) · 남은 예정(연파랑 점선) · 지연(빨강 빗금) · 복귀 완료(회색)
   · 승인·출발 전(초록 점선) · 승인 대기(주황 점선) · 지금 시각(빨간 세로선) */
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function timelineHTML() {
  const nowD = now();
  const day0 = new Date(nowD); day0.setHours(0, 0, 0, 0);
  const H = iso => (new Date(iso) - day0) / 3600000;
  const nowH = (nowD - day0) / 3600000;
  const list = todayRequests().filter(r => r.status !== '반려' && r.status !== '취소' && sameDay(new Date(r.departAt), nowD));

  // 시간 범위: 기본 08~19시, 일정이 벗어나면 넓힘
  let start = 8, end = 19;
  list.forEach(r => {
    start = Math.min(start, Math.floor(H(r.departAt)));
    end = Math.max(end, Math.ceil(Math.max(H(r.expectedReturnAt), r.returnedAt ? H(r.returnedAt) : 0)));
  });
  if (nowH >= start) end = Math.max(end, Math.ceil(nowH));
  start = Math.max(0, start); end = Math.min(24, end);
  const span = end - start;
  const pct = h => (Math.min(Math.max(h, start), end) - start) / span * 100;

  const seg = (from, to, cls, label, title) => {
    if (to <= from) return null;
    return { from, to, cls, label, title };
  };
  function segments(r) {
    const dep = H(r.status !== '승인' && r.startedAt ? r.startedAt : r.departAt), exp = H(r.expectedReturnAt); // 외근 막대는 실제 출발(외근 시작) 시각부터
    const where = isCoWork(r) ? `공동 · ${orgText(r)}` : orgText(r);
    const info = `${r.startedAt ? `[외근 시작 ${fmtDT(r.startedAt)}] ` : ''}${r.id} · ${orgText(r)}${r.locationDetail ? ' ' + r.locationDetail : ''} · ${fmtDT(r.departAt)}~${fmtDT(r.expectedReturnAt)}${isCoWork(r) ? ` · 공동작업(${namesOf(members(r))})` : ''}`;
    if (r.status === '복귀 완료') {
      const ret = H(r.returnedAt);
      return [seg(dep, Math.min(ret, exp), 'done', where, `${info} · 복귀 ${fmtDT(r.returnedAt)}`),
              ret > exp ? seg(exp, ret, 'late', `+${Math.round((ret - exp) * 60)}분`, '늦은 복귀') : null];
    }
    if (r.status === '외근 중') {
      if (nowH <= exp) return [seg(dep, nowH, 'active', where, `${info} · 외근 중`), seg(Math.max(dep, nowH), exp, 'planned', '', '복귀 예정')];
      return [seg(dep, exp, 'active', where, `${info} · 외근 중`), seg(exp, nowH, 'late', `+${Math.floor((nowH - exp) * 60)}분`, '복귀 지연')];
    }
    if (r.status === '승인') {
      // 출발 예정이 지났는데 아직 "외근 시작"을 안 누름 → 미출발 구간
      if (isStartLate(r)) return [seg(dep, Math.min(nowH, exp), 'waiting', `미출발 +${startDelayMin(r)}분`, `${info} · 아직 외근 시작 안 함`),
                                  seg(Math.max(dep, nowH), exp, 'approved', '', '승인 · 출발 전')];
      return [seg(dep, exp, 'approved', where, `${info} · 승인 · 출발 전`)];
    }
    if (r.status === '승인 대기') return [seg(dep, exp, 'pending', where, `${info} · 승인 대기`)];
    if (isRecord(r)) return [seg(dep, exp, 'resident', `상주 · ${orgText(r)}`, `${info} · 상주지원 기록`)];
    return [];
  }
  const barsHTML = r => {
    const s = segments(r).filter(Boolean);
    const co = isCoWork(r);
    return s.map((x, i) => `<div class="tl-bar ${x.cls}${co ? ' co' : ''}${i > 0 ? ' joinL' : ''}${i < s.length - 1 ? ' joinR' : ''}"
        style="left:${pct(x.from)}%;width:${pct(x.to) - pct(x.from)}%" title="${esc(x.title)} (누르면 상세)" data-action="open-detail" data-id="${r.id}" role="button" tabindex="0">${co && x.label && x.cls !== 'late' ? `<i class="tl-co">${IC.team}</i>` : ''}<span>${esc(x.label)}</span></div>`).join('');
  };

  const workers = state.users.filter(u => !isSup(u) && isActive(u));
  const rows = workers.map(u => {
    const mine = list.filter(r => onTrip(r, u.id));
    const empty = !mine.length ? `<span class="tl-empty">${u.status === '휴가' ? '휴가' : '외근 없음'}</span>` : '';
    return `<div class="tl-row">
      <div class="tl-who">${avatarHTML(u, 'xs')}<span>${esc(u.name)}</span></div>
      <div class="tl-track" style="--n:${span}">${mine.map(barsHTML).join('')}${empty}</div>
    </div>`;
  }).join('');
  const ticks = Array.from({ length: span + 1 }, (_, i) =>
    `<span class="${i % 2 ? 'odd' : ''}" style="left:${i / span * 100}%">${start + i}시</span>`).join('');
  const showNow = nowH >= start && nowH <= end;
  const legend = [['active', '외근 중'], ['planned', '복귀 예정'], ['late', '지연'], ['done', '복귀 완료'], ['approved', '승인·출발 전'], ['waiting', '미출발'], ['pending', '승인 대기'], ['resident', '상주지원'], ['co', '공동작업']]
    .map(([c, t]) => `<span${c === 'co' ? ' class="co-key"' : ''}><i class="tl-key ${c}"></i>${t}</span>`).join('');

  return `
  <div class="panel timeline">
    <div class="tl-head"><b>${ic('car')} 오늘 외근 타임라인</b><span class="muted">${hm(nowD)} 기준</span></div>
    <div class="tl-body">
      <div class="tl-row tl-axis"><div class="tl-who"></div><div class="tl-scale">${ticks}</div></div>
      ${rows}
      ${showNow ? `<div class="tl-nowwrap"><div class="tl-now" style="left:${pct(nowH)}%"><em>${hm(nowD)}</em></div></div>` : ''}
    </div>
    <div class="tl-legend">${legend}</div>
  </div>`;
}

/* ---------- 외근 이력: 기간별 조회 · 엑셀 내보내기 ----------
   기간(오늘 · 이번 주 · 이번 달 · 직접 선택)과 직원으로 골라 보고, 고른 목록 그대로 엑셀(CSV)로 내려받는다.
   출발일 또는 요청일이 기간 안에 있는 요청을 보여 준다. */
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function weekStartOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
const fmtDay = k => { const d = keyDate(k); return `${d.getMonth() + 1}/${d.getDate()} (${DAYS[d.getDay()]})`; };
const lateMinOf = r => r.returnedAt ? Math.floor((new Date(r.returnedAt) - new Date(r.expectedReturnAt)) / 60000) : 0;

const RANGES = [['today', '오늘'], ['week', '이번 주'], ['month', '이번 달'], ['custom', '직접 선택']];
const histF = { range: 'today', from: '', to: '', who: '', org: '', support: '', q: '' };
// 검색: 요청번호 · 이름 · 대상 기관 · 장소 · 작업 유형 · 내용 · 결과 · 사유
const histText = r => [r.id, namesOf(members(r)), orgText(r), r.locationDetail, r.workType, r.supportType, r.description, r.result && r.result.note, r.result && r.result.outcome,
  r.rejectReason, r.cancelReason, r.lateReason, r.instruction, r.lateRequest ? '사후 요청' : ''].join(' ').toLowerCase();
const histMatch = r => (!histF.who || isMember(r, histF.who)) && (!histF.org || orgsOf(r).includes(histF.org)) && (!histF.support || r.supportType === histF.support)
  && (!histF.q.trim() || histText(r).includes(histF.q.trim().toLowerCase()));
function histRange() {
  const t = now();
  if (histF.range === 'week') { const s = weekStartOf(t); return [dkey(s), dkey(addDays(s, 6))]; }
  if (histF.range === 'month') return [dkey(new Date(t.getFullYear(), t.getMonth(), 1)), dkey(new Date(t.getFullYear(), t.getMonth() + 1, 0))];
  if (histF.range === 'custom') {
    let a = histF.from || dkey(new Date(t.getFullYear(), t.getMonth(), 1)), b = histF.to || dkey(t);
    if (a > b) [a, b] = [b, a];
    return [a, b];
  }
  return [dkey(t), dkey(t)];
}
function histList() {
  if (histF.range === 'today') return todayRequests().filter(histMatch);
  const [a, b] = histRange();
  const inRange = iso => !!iso && iso.slice(0, 10) >= a && iso.slice(0, 10) <= b;
  return state.requests
    .filter(r => (inRange(r.departAt) || inRange(r.requestedAt)) && histMatch(r))
    .sort((x, y) => y.departAt.localeCompare(x.departAt)); // 여러 날은 최근 것부터
}
function histFilterHTML() {
  const [a, b] = histRange();
  const workers = state.users.filter(u => !isSup(u));
  return `
  <div class="panel hist-filter">
    <div class="seg hf-ranges" role="group" aria-label="조회 기간">${RANGES.map(([id, l]) =>
      `<button class="btn small${histF.range === id ? ' on' : ''}" data-action="hist-range" data-range="${id}" aria-pressed="${histF.range === id}">${l}</button>`).join('')}</div>
    ${histF.range === 'custom'
      ? `<span class="hf-dates"><input class="inp" type="date" data-hf="from" value="${a}" aria-label="시작일"><span>~</span><input class="inp" type="date" data-hf="to" value="${b}" aria-label="종료일"></span>`
      : `<span class="hf-period">${a === b ? fmtDay(a) : `${fmtDay(a)} ~ ${fmtDay(b)}`}</span>`}
    <select class="inp hf-who" data-hf="who" aria-label="직원">

function downloadCSV(name, list) {

// 요청서 미리 채우기: 재방문(원래 요청) 또는 받은 작업 요청에서 시작

let reqDraft = null;
let reqStep = 1; // 휴대폰 요청서 단계 (1 기관 · 일시 / 2 작업 내용 / 3 안전 확인)
// 아직 채우지 않은 항목 (단계 번호와 함께)
function reqMissing(f) {
  if (!f) return [];
  const v = n => (f.elements[n] && f.elements[n].value || '').trim();
  const sup = (f.querySelector('input[name="supportType"]:checked') || {}).value || '';
  const locs = v('locations').split('|').filter(Boolean);
  const out = [];
  if (!locs.length) out.push([1, '대상 기관']);
  if (locs.includes('기타') && !v('locationDetail')) out.push([1, '작업 장소']);
  if (!v('departAt') || !v('expectedReturnAt') || v('expectedReturnAt') <= v('departAt')) out.push([1, '작업 일시']);
  if (!v('description')) out.push([2, '작업 내용']);
  if (!sup) out.push([2, '지원 구분']);
  const checked = [...f.querySelectorAll('input[name="safety"]:checked')].map(c => +c.value);
  const need = state.safetyItems.filter((s, i) => s.required !== false && safetyApplies(s, sup) && !checked.includes(i)).length;
  if (need) out.push([3, `안전 확인 ${need}개`]);
  return out;
}
function updateReqLeft() {
  const f = document.getElementById('req-form'), el = document.getElementById('req-left');
  if (!f || !el) return;
  const m = reqMissing(f);
  el.classList.toggle('ok', !m.length);
  el.innerHTML = m.length ? `<b>남은 항목 ${m.length}</b> ${esc(m.map(x => x[1]).join(' · '))}` : `${IC.check} 모두 입력했습니다`;
  // 단계 표시: 그 단계에 남은 항목이 없으면 완료 표시
  f.querySelectorAll('.rq-steps button').forEach(b => {
    const n = +b.dataset.s, left = m.some(x => x[0] === n);
    b.classList.toggle('left', left && n !== reqStep);
  });
}
function gotoReqStep(n) {
  const f = document.getElementById('req-form'); if (!f) return;
  reqStep = Math.min(3, Math.max(1, n)); f.dataset.step = reqStep;
  f.querySelectorAll('.rq-steps button').forEach(b => {
    const k = +b.dataset.s; b.classList.toggle('on', k === reqStep); b.classList.toggle('done', k < reqStep);
    if (k === reqStep) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.querySelector('i').innerHTML = k < reqStep ? IC.check : k;
  });
  document.getElementById('req-err').hidden = true;
  updateReqLeft();
  if (matchMedia('(max-width: 640px)').matches) f.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

  if (!f || f.id !== 'req-form') return;
  const val = n => (f.querySelector(`input[name="${n}"]:checked`) || {}).value || '';
  reqDraft = {
    ctx: reqCtx(), locations: (f.elements.locations.value || '').split('|').filter(Boolean), locationDetail: f.elements.locationDetail.value, departAt: f.elements.departAt.value,
    expectedReturnAt: f.elements.expectedReturnAt.value, workType: val('workType'), description: f.elements.description.value, supportType: val('supportType'),

  if (e.target.name === 'supportType') applySafetyScope(f);
  updateReqLeft();
  if (e.target.name === 'supportType' && !editingId) { const b = document.getElementById('req-submit'); if (b) b.textContent = e.target.value === '상주지원' ? '상주지원 기록' : '승인 요청'; }
});
// 대상 기관 고르기: 가는 순서대로 누르면 번호가 붙고, 아래 "방문 순서"에서 순서를 바꿀 수 있음

      <button type="button" class="or-mv" data-action="org-move" data-v="${esc(v)}" data-d="-1" ${i ? '' : 'disabled'} aria-label="${esc(v)} 앞으로">${IC.chevL}</button>

    <input type="hidden" name="${name}" value="${esc(sel.join('|'))}">
    <div class="opts opts-5 org-opts" role="group" aria-label="대상 기관 (여러 곳 선택 · 가는 순서대로)">${state.locations.map(v => {
      const i = sel.indexOf(v);
      return `<button type="button" class="org-opt${i >= 0 ? ' on' : ''}" data-action="org-pick" data-v="${esc(v)}" aria-pressed="${i >= 0}">${i >= 0 ? `<i class="org-no" aria-label="${i + 1}번째">${i + 1}</i>` : ''}<span>${esc(v)}</span></button>`;
    }).join('')}</div>
    <div class="org-route" aria-live="polite">${orgRouteHTML(sel)}</div>

}
// 고른 목록을 바꾼 뒤 그 부분만 다시 그림 (다른 입력 내용은 그대로)
function updateOrgPicker(el, fn) {
  const pk = el.closest('.org-picker'); if (!pk) return;
  const hid = pk.querySelector('input[type="hidden"]');
  const sel = fn(hid.value ? hid.value.split('|') : []);
  const v = el.dataset.v, act = el.dataset.action, d = el.dataset.d;
  pk.outerHTML = orgPickerHTML(pk.dataset.name, sel);
  const np = [...document.querySelectorAll('.org-picker')].find(x => x.querySelector('input[type="hidden"]').value === sel.join('|'));
  if (!np) return;
  const h = np.querySelector('input[type="hidden"]'); h.dispatchEvent(new Event('input', { bubbles: true })); // 작성 중 내용 보관
  const back = np.querySelector(`[data-action="${act}"][data-v="${CSS.escape(v)}"]${d ? `[data-d="${d}"]` : ''}`) || np.querySelector(`[data-action="org-pick"][data-v="${CSS.escape(v)}"]`);
  if (back && !back.disabled) back.focus();
}

// 공동작업자 선택: 단독 작업이 기본, 함께 나가는 직원을 체크
// 수정할 때는 등록한 직원은 고정, 수정하는 공동작업자 본인은 빠질 수 없음
function coWorkerFieldHTML(er, pfCo = [], override = null) {

        <div class="opts wo-to co-pick">${others.map(u => {
          const self = u.id === currentUserId;
          const busy = u.status === '휴가' ? '휴가 중' : u.status === '외근' && !(er && u.currentRequestId === er.id) ? '외근 중' : '';

        }).join('')}</div></div>`;

// 안전 준수 항목의 적용 범위: 공통 · 방문지원 · 상주지원 (예: 교통안전 준수는 방문지원만)
const SAFETY_SCOPES = ['공통', '방문지원', '상주지원'];
const scopeOf = s => (SAFETY_SCOPES.includes(s.scope) ? s.scope : '공통');
const safetyApplies = (s, sup) => scopeOf(s) === '공통' || !sup || scopeOf(s) === sup;
const safetyFor = sup => state.safetyItems.filter(s => safetyApplies(s, sup));
// 지원 구분별 안내 문구 (예: 상주지원 2개 · 방문지원 3개 필수)
function safetyRuleText() {
  const part = sup => { const req = safetyFor(sup).filter(s => s.required !== false); return `${sup} ${req.length}개`; };
  return `필수: ${part('방문지원')} · ${part('상주지원')}`;
}
// 요청서에서 지원 구분을 바꾸면 해당 항목만 보이게
function applySafetyScope(f) {
  if (!f) return;
  const sup = (f.querySelector('input[name="supportType"]:checked') || {}).value || '';
  f.querySelectorAll('.check[data-scope]').forEach(l => {
    const on = !sup || l.dataset.scope === '공통' || l.dataset.scope === sup;
    l.hidden = !on;
    const c = l.querySelector('input'); if (c) c.required = on && l.dataset.req === '1';
  });
}
// 필수 항목 확인 여부 + 선택 항목이 있으면 체크했을 때만 함께 표시

  const done = r.safetyChecked || [];

  return `<span class="safety-ok">${ic('check')} ${done.map(esc).join(' · ')}</span>`;
}
function reqSummary(r) {

}

      <span class="muted">${esc(workLabel(r))} · ${isRecord(r) ? '지원 ' : ''}${fmtDT(r.departAt)} ~ ${fmtDT(r.expectedReturnAt)}${r.startedAt ? ` · 출발 ${fmtDT(r.startedAt)}` : ''}${r.returnedAt ? ` · 복귀 ${fmtDT(r.returnedAt)}` : ''}${r.editedAt ? ` · <b class="edited">${editedText(r)}</b>` : ''}</span>

// 취소된 요청: 누가 언제, 사유
function cancelLineHTML(r) {

  const by = userById(r.canceledBy);
  return `<span class="reason cancel">${r.prevStatus === '승인' ? '승인 후 ' : r.prevStatus === '상주 기록' ? '상주 기록 ' : ''}취소 ${fmtDT(r.canceledAt)}${by ? ` · ${esc(by.name)}${isSup(by) ? ' 감독원' : ''}` : ''} — ${esc(r.cancelReason || '')}</span>`;

          <button class="btn small ghost cancel-btn" data-action="cancel-open" data-id="${r.id}">${isRecord(r) ? '기록 취소' : '요청 취소'}</button></div>`;

// 시간 겹침: 같은 직원(공동작업자 포함)의 진행 중 · 예정 외근과 시간이 겹치는지
function busyRange(r) {
  let e = new Date(r.expectedReturnAt);
  if (r.status === '외근 중' && now() > e) e = now();
  return [new Date(r.startedAt || r.departAt), e];
}
function overlapsFor(ids, dep, ret, exceptId) {
  const a = new Date(dep), b = new Date(ret);
  return state.requests.filter(r => r.id !== exceptId && ['승인 대기', '승인', '외근 중', '상주 기록'].includes(r.status) && members(r).some(id => ids.includes(id)))
    .filter(r => { const [s0, e0] = busyRange(r); return s0 < b && a < e0; });
}
const overlapText = (list, ids) => list.map(r => `${namesOf(members(r).filter(id => ids.includes(id)))} ${r.id}(${fmtDT(r.startedAt || r.departAt)}~${fmtDT(r.expectedReturnAt)}, ${reqLabel(r).label})`).join(', ');

// 요청에 붙는 기록: 복귀 연장 · 늦은 복귀 사유 · 감독원 대리 처리 · 재방문 · 작업 요청 연결
function reqNotesHTML(r) {
  const out = [];
  const nm = id => { const u = userById(id); return u ? u.name : ''; };
  (r.extensions || []).forEach(x => out.push(`<span class="note-line">${ic('alarm')} 복귀 연장 ${fmtDT(x.from)} → ${fmtDT(x.to)} · ${esc(x.reason)}${x.by ? ` (${esc(nm(x.by))})` : ''}</span>`));
  if (r.lateReason) out.push(`<span class="note-line late">${ic('alarm')} 늦은 복귀 사유: ${esc(r.lateReason)}</span>`);
  if (r.proxyStart) out.push(`<span class="note-line sup">${ic('car')} 감독원 대신 외근 시작 (${esc(nm(r.proxyStart.by))}) — ${esc(r.proxyStart.reason)}</span>`);
  if ((r.skippedIds || []).length) out.push(`<span class="note-line">${ic('team')} 외근 시작 때 제외: ${esc(namesOf(r.skippedIds))} (휴가 · 다른 외근 중)</span>`);
  if (r.proxyReturn) out.push(`<span class="note-line sup">${ic('check')} 감독원 대신 복귀 처리 (${esc(nm(r.proxyReturn.by))}) — ${esc(r.proxyReturn.reason)}</span>`);
  if (r.followUpOf) out.push(`<span class="note-line">${ic('clipboard')} 재방문 · 원래 요청 ${ridBtn(reqById(r.followUpOf) || { id: r.followUpOf }, 'sm')}</span>`);
  if (r.followUpId) { const f = reqById(r.followUpId); out.push(`<span class="note-line">${ic('clipboard')} 재방문 요청 ${ridBtn(f || { id: r.followUpId }, 'sm')}${f ? ` · ${reqLabel(f).label}` : ''}</span>`); }
  if (r.workOrderId) { const o = (state.workOrders || []).find(x => x.id === r.workOrderId); out.push(`<span class="note-line">${ic('send')} 작업 요청 연결 · ${esc(o ? o.title : r.workOrderId)}</span>`); }
  return out.length ? `<div class="req-notes">${out.join('')}</div>` : '';
}
const extText = r => (r.extensions || []).length ? ` · <b class="edited">연장 ${r.extensions.length}회 (최초 ${fmtDT(r.plannedReturnAt)})</b>` : '';

function nextRequestId() {
  const max = state.requests.reduce((m, r) => Math.max(m, parseInt(r.id.slice(2), 10) || 0), state.reqSeq || 0);
  state.reqSeq = max + 1; // 지우거나 정리해도 같은 번호를 다시 쓰지 않음
  return 'R-' + String(max + 1).padStart(3, '0');
}

// 요청 입력값 검사 (직원 요청서 · 감독원 수정 공통)
// 입력 순서대로 안내: 대상 기관 → 작업 장소 → 출발 · 복귀 → 작업 내용 → 지원 구분
function checkReqFields(x) {
  const orgs = x.locations || (x.location ? [x.location] : []);
  if (!orgs.length) return '대상 기관을 선택하세요.';
  if (orgs.includes('기타') && !x.locationDetail) return '대상 기관에 "기타"가 있으면 작업 장소를 적어야 합니다.';
  if (!x.departAt || !x.expectedReturnAt) return '작업 일시와 예상 복귀 시각을 입력하세요.';
  if (new Date(x.expectedReturnAt) <= new Date(x.departAt)) return '예상 복귀 시각은 출발 시각보다 늦어야 합니다.';
  if (!x.description) return '작업 내용을 입력하세요.';
  if (!SUPPORT_TYPES.includes(x.supportType)) return '지원 구분(상주지원 · 방문지원)을 선택하세요.';
  return '';
}
// 누가 언제 수정했는지 (직원 본인 / 감독원)

const opsRequests = () => state.requests.filter(r => r.status === '승인' || r.status === '외근 중');
// 승인 관리 탭: pending(승인 대기) / ops(진행 중인 외근) / done(오늘 처리). null이면 승인 대기가 있을 때 승인 대기부터
let approveTab = null;
function approveHTML() {
  const pending = pendingRequests();
  const lastAt = r => r.canceledAt || r.decidedAt;
  const decided = state.requests.filter(r => (r.decidedAt && sameDay(new Date(r.decidedAt), now())) || (r.canceledAt && sameDay(new Date(r.canceledAt), now())))
    .sort((a, b) => lastAt(b).localeCompare(lastAt(a)));
  const ops = opsRequests();
  const tab = approveTab || (pending.length || !ops.length ? 'pending' : 'ops');
  const tabs = subTabsHTML([
    { id: 'pending', full: '승인 대기', short: '승인 대기', count: pending.length, icon: IC.squareCheck, hot: true },
    { id: 'ops', full: '진행 중인 외근', short: '진행 중', count: ops.length, icon: IC.car },
    { id: 'done', full: '오늘 처리한 요청', short: '오늘 처리', count: decided.length, icon: IC.history },
  ], tab, 'approve-tab', '승인 관리 보기');
  const desc = { pending: '직원이 보낸 외근 요청입니다. 내용을 확인하고 승인하거나, 사유를 적어 반려합니다.',
    ops: '출발 전 · 외근 중인 건 — 대신 외근 시작 · 승인 취소 · 대신 복귀 처리',
    done: '오늘 승인 · 반려한 요청과 직원이 취소한 요청' }[tab];
  let body;
  if (tab === 'pending') body = pending.length ? `<div class="grid">${pending.map(pendingCardHTML).join('')}</div>`

        ${isCoWork(r) ? `<span class="co-line">${coTag(r)}</span>` : ''}
        ${r.decidedAt ? `<span class="muted">${fmtDT(r.decidedAt)} ${esc(a ? a.name : '')} ${r.status === '반려' ? '반려' : '승인'}</span>` : ''}
        ${r.status === '반려' && r.rejectReason ? `<span class="reason">반려 사유: ${esc(r.rejectReason)}</span>` : ''}

    }).join('')}</ul>` : '<div class="panel"><p class="empty"><b>오늘 처리한 요청이 없습니다</b><small>오늘 승인 · 반려한 요청과 직원이 취소한 요청이 표시됩니다.</small></p></div>';

/* ---------- 외근 시작 ----------
   승인만으로는 "외근"이 되지 않는다. 직원이 실제로 나가면서 "외근 시작"을 누른 시각이 출발 시각.
   공동작업은 한 명이 누르면 함께 가는 직원 모두 외근 시작 (다른 외근 중인 직원은 건너뜀). */
const START_GRACE_MIN = 10; // 출발 예정 시각이 이만큼 지나도 시작하지 않으면 "출발 지연"
const startDelayMin = r => r.status === '승인' ? Math.floor((now() - new Date(r.departAt)) / 60000) : 0;
const isStartLate = r => startDelayMin(r) > START_GRACE_MIN;
// 이 직원이 시작할 수 있는(승인된) 외근 — 출발 예정 순
const approvedFor = id => state.requests.filter(r => r.status === '승인' && isMember(r, id)).sort((a, b) => a.departAt.localeCompare(b.departAt));
// 내 상태의 "외근 시작" 상자: 오늘 건 → 앞으로의 건 (출발일이 지난 승인은 내 요청 · 승인 관리에서 정리)
const nextApproved = id => approvedFor(id).find(r => r.departAt.slice(0, 10) >= dkey(now()));
// 시작 가능 여부: 출발일 당일부터, 다른 외근 중이 아닐 때
function startBlock(r, u) {
  if (r.departAt.slice(0, 10) > dkey(now())) return `${fmtDay(r.departAt.slice(0, 10))} 출발일에 시작할 수 있습니다`;
  if (r.departAt.slice(0, 10) < dkey(now())) return `출발일(${fmtDay(r.departAt.slice(0, 10))})이 지난 승인입니다. 취소하고 다시 요청하세요`;
  if (u.status === '외근' && u.currentRequestId && u.currentRequestId !== r.id) return '다른 외근 중입니다. 복귀 처리 후 시작하세요';
  return '';
}
// 함께 나갈 수 있는 사람: 다른 외근 중이 아니고, (누른 본인이 아니면) 휴가 중도 아닌 사람
const canGo = (r, u, by) => u && !(u.status === '외근' && u.currentRequestId && u.currentRequestId !== r.id) && !(u.id !== by.id && u.status === '휴가');
function startOuting(r, by) {
  const go = members(r).map(userById).filter(u => canGo(r, u, by));
  if (!go.length) return []; // 아무도 나갈 수 없으면 시작하지 않음
  r.status = '외근 중'; r.startedAt = toLocalISO(now()); r.startedBy = by.id;
  r.startedIds = go.map(u => u.id);
  const skipped = members(r).filter(id => !r.startedIds.includes(id));
  if (skipped.length) r.skippedIds = skipped; else delete r.skippedIds;
  go.forEach(u => {
    setStatus(u, '외근', `${r.id} 외근 시작 (${orgText(r)})${isCoWork(r) ? ' · 공동작업' : ''}${u.id !== by.id ? ` (${by.name} 처리)` : ''}`);
    u.currentRequestId = r.id;
  });
  return go;
}
// 실제로 외근에 나간 사람 (시작 전 · 예전 자료는 등록된 인원 전체)
const onTrip = (r, id) => (['외근 중', '복귀 완료'].includes(r.status) && r.startedIds) ? r.startedIds.includes(id) : isMember(r, id);
// 열려 있는 양식: 외근 시작(안전 재확인) / 외근 취소 — 화면이 다시 그려져도 입력 유지
let startOpenId = null, cancelOpenId = null;
const startChecks = {};   // { 요청ID: [체크한 항목 번호] }
const cancelDrafts = {};  // { 요청ID: 사유 }
document.addEventListener('input', e => {
  const f = e.target.form;
  if (!f) return;
  if (f.id === 'start-form') startChecks[f.dataset.id] = [...f.querySelectorAll('input[name="ss"]:checked')].map(c => +c.value);
  if (f.id === 'cancel-form') cancelDrafts[f.dataset.id] = f.elements.reason.value;
});
// 직원이 취소할 수 있는 요청: 승인 대기 · 승인(출발 전)
const cancelable = (r, u) => u && isMember(r, u.id) && (r.status === '승인 대기' || r.status === '승인' || r.status === '상주 기록');

// 출발 직전 안전 재확인 — 모두 체크해야 외근 시작
function startFormHTML(r) {
  const done = startChecks[r.id] || [];
  return `
    <form class="start-form" id="start-form" data-id="${r.id}" novalidate>
      <div class="rf-head">${ic('shield')} <b>출발 전 안전 재확인</b><span class="muted">${r.id} · ${reqSummary(r)}</span></div>
      <p class="hint">출발 직전에 다시 확인하세요. 모든 항목을 체크해야 외근을 시작할 수 있습니다.</p>
      <div class="checks">${state.safetyItems.map((it, i) => safetyApplies(it, '방문지원') ? `
        <label class="check"><input type="checkbox" name="ss" value="${i}" ${done.includes(i) ? 'checked' : ''}>
          <span><b>${esc(it.title)}</b><small>${esc(it.desc)}</small></span></label>` : '').join('')}</div>
      <p class="sf-keep">${ic('alarm')} 예상 복귀 <b>${fmtDT(r.expectedReturnAt)}</b> — 승인된 시각 그대로이며, 늦게 출발해도 바뀌지 않습니다.</p>
      ${isCoWork(r) ? `<p class="hint">공동작업입니다. 함께 가는 ${esc(namesOf(members(r).filter(id => id !== currentUserId)))}의 안전 수칙 준수도 함께 확인해 주세요. 시작하면 모두 외근으로 바뀝니다.</p>` : ''}
      <p class="err" id="start-err" hidden></p>
      <div class="seg">
        <button class="btn primary">${ic('car')} 외근 시작</button>
        <button type="button" class="btn" data-action="start-close">닫기</button>
      </div>
    </form>`;
}
// 외근 취소 — 사유 필수, 되돌릴 수 없음
function cancelFormHTML(r) {
  return `
    <form class="cancel-form" id="cancel-form" data-id="${r.id}" novalidate>
      <div class="rf-head">${ic('alarm')} <b>${isRecord(r) ? '상주지원 기록 취소' : r.status === '승인 대기' ? '요청 취소' : '외근 취소'}</b><span class="muted">${r.id} · ${reqSummary(r)}</span></div>
      <p class="hint">${isRecord(r) ? '잘못 남긴 기록을 취소합니다.' : '작업이 필요 없어졌을 때 취소합니다.'} 취소하면 감독원 화면에 사유와 함께 표시되며 되돌릴 수 없습니다.${isCoWork(r) ? ' 공동작업은 함께 가는 직원 모두에게서 취소됩니다.' : ''}</p>
      <input class="inp" name="reason" maxlength="60" placeholder="취소 사유 (필수) 예: 지사 자체 조치로 작업 불필요" value="${esc(cancelDrafts[r.id] || '')}">
      <p class="err" id="cancel-err" hidden></p>
      <div class="seg">
        <button class="btn danger">취소 확정</button>
        <button type="button" class="btn" data-action="cancel-close">닫기</button>
      </div>
    </form>`;
}
// 내 상태 / 내 요청에 보이는 "외근 시작" 상자
function startBoxHTML(r, u, compact) {
  const block = startBlock(r, u);
  const late = isStartLate(r);
  const when = `${fmtDT(r.departAt)} 출발 예정 · 예상 복귀 ${fmtDT(r.expectedReturnAt)}${late ? ` <b class="late-txt">(출발 ${startDelayMin(r)}분 지남)</b>` : ''}`;
  const cancelBtn = `<button class="btn ghost cancel-btn" data-action="cancel-open" data-id="${r.id}">외근 취소</button>`;
  const controls = startOpenId === r.id ? startFormHTML(r)
    : cancelOpenId === r.id ? cancelFormHTML(r)
    : block ? `<div class="sb-actions"><span class="start-block">${esc(block)}</span>${cancelBtn}</div>`
    : `<div class="sb-actions"><button class="btn primary start-btn" data-action="start-open" data-id="${r.id}">${ic('car')} 외근 시작</button>${cancelBtn}</div>`;
  if (compact) return `<div class="start-inline">${controls}</div>`;
  const open = startOpenId === r.id || cancelOpenId === r.id;
  return `<div class="start-box${late ? ' late' : ''}${open ? ' open' : ''}">
    <span class="sb-ic">${IC.car}</span>
    <div class="sb-txt"><b>승인된 외근 · ${reqSummary(r)}</b><span>${when}${isCoWork(r) ? ` · ${coTag(r, u.id)}` : ''}</span></div>
    ${controls}
    ${block || open ? '' : '<p class="sb-hint">실제로 출발할 때 누르세요. 출발 전 안전 재확인 후, 누른 시각이 출발 시각으로 기록됩니다.</p>'}
  </div>`;
}
function unlinkFollowUp(r) {
  const o = r.followUpOf && reqById(r.followUpOf);
  if (o && o.followUpId === r.id) delete o.followUpId; // 원래 작업이 다시 "재방문 필요"로
}
function cancelRequest(r, by, reason) {
  unlinkFollowUp(r);
  r.prevStatus = r.status;
  Object.assign(r, { status: '취소', cancelReason: reason, canceledAt: toLocalISO(now()), canceledBy: by.id });
}

/* ---------- 공지사항 (6명 누구나 게시) ---------- */
const DEFAULT_NOTICE = '작업장 안전수칙 및 교통안전 준수';
const notices = () => (state.notices || []).slice().sort((a, b) => (!!b.pinned - !!a.pinned) || b.at.localeCompare(a.at)); // 중요 공지 먼저
let noticeEditId = null;
const pinTag = n => n.pinned ? '<span class="nt-pin">중요</span>' : '';

// 근무현황 상단 공지 1칸: 없으면 기본 문구, 여러 건이면 위로 올라가는 티커
let tickerIdx = 0;
function noticeBarHTML() {
  const list = notices();
  const items = list.length
    ? list.map(n => {
        const a = userById(n.authorId);
        return `<li>${pinTag(n)}<span class="nt-title">${esc(n.title)}</span><span class="nt-meta">${esc(a ? a.name : '')} · ${fmtDT(n.at)}</span></li>`;
      })
    : [`<li class="nt-default">${ic("shield")}<span class="nt-title">${DEFAULT_NOTICE}</span></li>`];
  const loop = items.length > 1 ? items.concat(items[0]) : items; // 끝에서 처음으로 자연스럽게 이어지도록 첫 줄 복제
  return `
  <div class="notice-bar" data-action="go" data-view="notice" role="button" tabindex="0" title="공지사항 게시판 열기">
    <span class="nt-tag">${ic("megaphone")} 공지</span>
    <div class="nt-window"><ul class="nt-list" id="nt-list" data-count="${items.length}">${loop.join('')}</ul></div>
    ${list.length > 1 ? `<span class="nt-count">${list.length}건</span>` : ''}
    <span class="nt-more" aria-hidden="true">${IC.chevR}</span>
  </div>`;
}
function placeTicker(animate) {
  const ul = document.getElementById('nt-list');
  if (!ul) return;
  const n = +ul.dataset.count;
  if (tickerIdx > n) tickerIdx = 0;
  const h = ul.firstElementChild ? ul.firstElementChild.offsetHeight : 26;
  ul.style.transition = animate ? 'transform .5s ease' : 'none';
  ul.style.transform = `translateY(-${tickerIdx * h}px)`;
}
setInterval(() => {
  const ul = document.getElementById('nt-list');
  if (!ul || +ul.dataset.count < 2 || ul.closest('.notice-bar').matches(':hover')) return;
  const n = +ul.dataset.count;
  tickerIdx++;
  placeTicker(true);
  if (tickerIdx >= n) setTimeout(() => { tickerIdx = 0; placeTicker(false); }, 550);
}, 3500);

function noticeHTML() {
  const list = notices();
  const ne = (state.notices || []).find(n => n.id === noticeEditId && n.authorId === currentUserId) || null;
  if (!ne) noticeEditId = null;
  return `
  ${pageHead('notice', '공지사항', '근무현황 상단에 표시되는 공지입니다. 누구나 게시할 수 있고, 수정은 작성자 본인, 삭제는 작성자 본인과 감독원이 합니다. 감독원은 중요 공지를 상단에 고정할 수 있습니다.')}
  <div class="layout2">
    <form class="panel form${ne ? ' editing' : ''}" id="notice-form">
      ${ne ? `<div class="edit-banner"><span>${ic('pencil')} 공지를 수정하고 있습니다</span><button type="button" class="btn small" data-action="cancel-notice-edit">수정 취소</button></div>` : ''}
      <div class="field"><label class="lbl" for="nt-title">제목</label>
        <input class="inp" id="nt-title" name="title" maxlength="60" placeholder="예: 11/24 전산실 UPS 점검 안내" required value="${ne ? esc(ne.title) : ''}"></div>
      <div class="field"><label class="lbl" for="nt-body">내용 <small>(선택)</small></label>
        <textarea class="inp" id="nt-body" name="body" maxlength="500" placeholder="자세한 내용을 적어 주세요.">${ne ? esc(ne.body) : ''}</textarea></div>
      ${isSup(me()) ? `<label class="check-inline"><input type="checkbox" name="pinned" ${ne && ne.pinned ? 'checked' : ''}> <span><b>중요 공지</b> — 공지 목록과 근무현황 공지 줄 맨 앞에 고정</span></label>` : ''}
      <button class="btn primary">${ne ? '수정 저장' : '공지 게시'}</button>
    </form>
    <section>
      <h2 style="margin-top:0">게시된 공지 ${list.length}건</h2>
      <div class="panel" id="notice-list">${noticeListHTML()}</div>
    </section>
  </div>`;
}
function noticeListHTML() {
  const list = notices();
  if (!list.length) return `<p class="empty">게시된 공지사항이 없습니다.<br>근무현황에는 기본 문구 "${DEFAULT_NOTICE}"가 표시됩니다.</p>`;
  const u = me();
  return `<ul class="notice-list">${list.map(n => {
    const a = userById(n.authorId);

    return `
    <li class="${n.pinned ? 'pinned' : ''}${n.id === noticeEditId ? ' is-editing' : ''}">

        <span class="nl-actions">
          ${canEdit ? `<button class="btn small ghost" data-action="edit-notice" data-id="${n.id}">수정</button>` : ''}
          ${isSup(u) ? `<button class="btn small ghost" data-action="pin-notice" data-id="${n.id}">${n.pinned ? '고정 해제' : '상단 고정'}</button>` : ''}
          ${canDelete ? `<button class="btn small ghost" data-action="del-notice" data-id="${n.id}">삭제</button>` : ''}
        </span>

      ${n.body ? `<p class="nl-body">${esc(n.body)}</p>` : ''}

/* ---------- 작업 요청 (감독원 → 용역직원, 직원 확인) ---------- */
// 진행 중인 작업 요청이 위로, 완료된 것은 아래로
const workOrders = () => (state.workOrders || []).slice().sort((a, b) => ((orderState(a) === '완료') - (orderState(b) === '완료')) || b.createdAt.localeCompare(a.createdAt));
const ackOf = (o, id) => (o.acks || {})[id];
const myInbox = () => workOrders().filter(o => o.toIds.includes(currentUserId));
function unackedForMe() { return myInbox().filter(o => !ackOf(o, currentUserId)).length; }
const unackedPeople = () => workOrders().reduce((n, o) => n + o.toIds.filter(id => !ackOf(o, id)).length, 0);
// 회신 입력 중인 내용은 화면이 다시 그려져도 남도록 보관
const ackDrafts = {};
const ACK_MAX = 300; // 회신 최대 글자 수 (2~3줄 이상 적을 수 있게)
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.ack) {
    ackDrafts[e.target.dataset.ack] = e.target.value;
    const c = document.querySelector(`[data-ack-count="${e.target.dataset.ack}"]`);
    if (c) c.textContent = `${e.target.value.length}/${ACK_MAX}`;
  }
});
function nextOrderId() {
  const max = (state.workOrders || []).reduce((m, o) => Math.max(m, parseInt(o.id.slice(2), 10) || 0), state.orderSeq || 0);
  state.orderSeq = max + 1; // 삭제한 번호를 다시 쓰지 않음
  return 'W-' + String(max + 1).padStart(3, '0');
}

// 근무현황 상단 안내: 직원은 새 요청, 감독원은 아직 확인 안 한 인원
function orderBannerHTML() {
  const u = me();
  if (!isSup(u)) {
    const n = unackedForMe();
    return n ? `<div class="banner info"><span>${ic('inbox')} 새 작업 요청 ${n}건이 있습니다.</span>
      <button class="btn small" data-action="go" data-view="inbox">확인하기</button></div>` : '';
  }
  const late = state.requests.filter(r => isStartLate(r) && r.departAt.slice(0, 10) === dkey(now()));
  const canceled = state.requests.filter(r => r.status === '취소' && r.prevStatus === '승인' && !isSup(userById(r.canceledBy)) && r.canceledAt && sameDay(new Date(r.canceledAt), now())); // 직원이 취소한 것만
  const cancelBanner = canceled.length ? `<div class="banner"><span>${ic('alarm')} 오늘 직원이 취소한 승인 외근 ${canceled.length}건 · ${esc(canceled.map(r => `${userById(r.canceledBy).name}(${r.cancelReason})`).join(', '))}</span>
    <button class="btn small" data-action="go" data-view="approve" data-tab="done">자세히</button></div>` : '';
  const lateBanner = late.length ? `<div class="banner warn"><span>${ic('alarm')} 출발 예정 시각이 지났는데 아직 "외근 시작"을 하지 않은 승인 건 ${late.length}건 · ${esc(late.map(r => `${namesOf(members(r))}(${fmtDT(r.departAt)})`).join(', '))}</span>
    <button class="btn small" data-action="go" data-view="approve" data-tab="ops">확인</button></div>` : '';
  const noRet = state.requests.filter(isNoReturn);
  const noRetBanner = noRet.length ? `<div class="banner danger"><span>${ic('alarm')} 퇴근 시각이 지났거나 날짜가 바뀌었는데 복귀 처리하지 않은 외근 ${noRet.length}건 · ${esc(noRet.map(r => `${namesOf(members(r))}(예상 ${fmtDT(r.expectedReturnAt)})`).join(', '))}</span>
    <button class="btn small" data-action="go" data-view="approve" data-tab="ops">대신 복귀 처리</button></div>` : '';
  const exts = state.requests.filter(r => r.status === '외근 중' && (r.extensions || []).some(x => sameDay(new Date(x.at), now())));
  const extBanner = exts.length ? `<div class="banner info"><span>${ic('alarm')} 오늘 복귀 연장 ${exts.length}건 · ${esc(exts.map(r => { const x = r.extensions[r.extensions.length - 1]; return `${namesOf(members(r))}(${hm(new Date(x.from))}→${hm(new Date(x.to))}, ${x.reason})`; }).join(', '))}</span></div>` : '';
  const n = unackedPeople();
  return noRetBanner + lateBanner + extBanner + cancelBanner + (n ? `<div class="banner info"><span>${ic('send')} 보낸 작업 요청 중 아직 확인하지 않은 직원 ${n}명</span>
    <button class="btn small" data-action="go" data-view="orders">작업 요청 보기</button></div>` : '');
}

function orderMetaHTML(o) {
  const parts = [];
  if (orgsOf(o).length) parts.push(`${ic('pin')} ${esc(orgText(o))}`);
  if (o.dueAt) parts.push(`${ic('alarm')} 기한 ${fmtDT(o.dueAt)}`);
  const from = userById(o.fromId);
  parts.push(`${ic('send')} ${esc(from ? from.name : '')} 감독원 · ${fmtDT(o.createdAt)}`);
  return `<div class="wo-meta">${parts.map(p => `<span>${p}</span>`).join('')}</div>`;
}
const urgentChip = o => o.priority === '긴급' ? '<span class="chip st-late">긴급</span>' : '';

// 감독원 화면: 작업 요청 보내기 + 보낸 요청의 확인 현황
function ordersHTML() {
  const workers = state.users.filter(u => !isSup(u) && isActive(u));
  return `

}
function sentOrdersHTML() {

    const done = o.toIds.filter(id => ackOf(o, id)).length;

    return `
    <article class="panel wo-card${o.priority === '긴급' && orderState(o) !== '완료' ? ' urgent' : ''}${orderState(o) === '완료' ? ' is-done' : ''}">
      <div class="wo-top"><b class="wo-title">${esc(o.title)}</b>${urgentChip(o)}${orderChip(o)}
        <span class="wo-progress${all ? ' done' : ''}">${all ? ic('check') + ' ' : ''}확인 ${done}/${o.toIds.length}</span></div>

        const link = lr ? `<span class="wo-req">${ic('car')} ${ridBtn(lr, 'sm')} ${reqChip(lr)}</span>` : '';
        return a
          ? `<div class="ack yes">${ic('check')}<b>${esc(w ? w.name : id)}</b><span>확인 ${fmtDT(a.at)}</span>${orderChip(o, id)}${link}${a.note ? `<em>“${esc(a.note)}”</em>` : ''}</div>`

      }).join('')}</div>

        ${o.fromId === currentUserId ? `<button class="btn small ghost" data-action="del-order" data-id="${o.id}">요청 삭제</button>` : ''}</div>`}

               placeholder="예: 15시에 출발하겠습니다.&#10;현장 확인 후 조치 결과를 다시 보고드리겠습니다.">${esc(ackDrafts[o.id] || '')}</textarea>
             <div class="ack-foot"><span class="ack-count" data-ack-count="${o.id}">${(ackDrafts[o.id] || '').length}/${ACK_MAX}</span>
               <button class="btn primary" data-action="ack-order" data-id="${o.id}">${ic('check')} 확인</button></div>
           </div>`}
    </article>`;
  }).join('') : '<div class="panel"><p class="empty"><b>받은 작업 요청이 없습니다</b><small>감독원이 작업을 요청하면 여기와 메뉴의 숫자로 알려 드립니다.</small></p></div>'}</div>`;
}

/* ---------- 휴가 · 출장 일정표 ----------
   본인 휴가 · 출장 · 외출 일정을 미리 등록하고, 6명의 한 주 일정을 한눈에 본다.
   승인된(또는 승인 대기) 외근도 함께 표시. 삭제는 등록한 본인과 감독원. */
const SCHED_TYPES = { '감독원': ['휴가', '출장', '외출'], '용역직원': ['휴가', '외출'] };
// 공휴일 (대체공휴일 포함) — 매년 행정안전부 발표(관공서의 공휴일에 관한 규정)에 맞춰 확인 · 추가
const HOLIDAYS = {
  '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴', '2026-03-01': '삼일절', '2026-03-02': '대체공휴일',
  '2026-05-05': '어린이날', '2026-05-24': '부처님오신날', '2026-05-25': '대체공휴일', '2026-06-03': '지방선거일', '2026-06-06': '현충일',
  '2026-08-15': '광복절', '2026-08-17': '대체공휴일', '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-09-26': '추석 연휴',
  '2026-10-03': '개천절', '2026-10-05': '대체공휴일', '2026-10-09': '한글날', '2026-12-25': '성탄절',
  '2027-01-01': '신정', '2027-02-06': '설날 연휴', '2027-02-07': '설날', '2027-02-08': '설날 연휴', '2027-02-09': '대체공휴일', '2027-03-01': '삼일절',
  '2027-05-05': '어린이날', '2027-05-13': '부처님오신날', '2027-06-06': '현충일', '2027-08-15': '광복절', '2027-08-16': '대체공휴일',
  '2027-09-14': '추석 연휴', '2027-09-15': '추석', '2027-09-16': '추석 연휴', '2027-10-03': '개천절', '2027-10-04': '대체공휴일',
  '2027-10-09': '한글날', '2027-10-11': '대체공휴일', '2027-12-25': '성탄절', '2027-12-27': '대체공휴일',
};
const schedules = () => (state.schedules || []).slice().sort((a, b) => a.start.localeCompare(b.start) || a.userId.localeCompare(b.userId));
const schedOn = (uid, k) => schedules().filter(p => p.userId === uid && p.start <= k && p.end >= k);
const todaySchedule = u => schedOn(u.id, dkey(now()))[0];
let calWeek = 0; // 이번 주 기준 몇 주 앞/뒤
const schedDraft = {};
document.addEventListener('input', e => {
  if (e.target.closest && e.target.closest('#sched-form') && e.target.name) schedDraft[e.target.name] = e.target.value;
});

// 근무현황 "내 상태": 오늘 등록된 일정이 있는데 상태가 다르면 한 번에 반영하도록 안내
function scheduleHintHTML(u) {
  const p = todaySchedule(u);
  if (!p || (u.status === p.type && (u.statusNote || '') === (p.note || ''))) return '';
  return `<div class="sched-hint">${ic('calendar')} <span>오늘 일정: <b>${esc(p.type)}</b>${p.note ? ` · ${esc(p.note)}` : ''}</span>
    <button class="btn small" data-action="apply-schedule" data-id="${p.id}">내 상태에 반영</button></div>`;
}

const SCHED_DESC = { '휴가': '연차 · 반차', '출장': '회의 · 교육', '외출': '잠시 자리 비움' };
const dayDiff = (a, b) => Math.round((keyDate(b) - keyDate(a)) / 86400000);
const weekDays = () => { const s0 = addDays(weekStartOf(now()), calWeek * 7); return Array.from({ length: 7 }, (_, i) => addDays(s0, i)); };
const schedPeople = () => [...state.users.filter(isSup), ...state.users.filter(u => !isSup(u))].filter(isActive);

// 한 주(7칸) 안의 일정 막대: 여러 날 일정은 이어진 막대, 외근은 하루 막대. 겹치면 아래 줄로
function weekEvents(u, days) {
  const k0 = dkey(days[0]), k6 = dkey(days[6]);
  const evs = schedules().filter(p => p.userId === u.id && p.start <= k6 && p.end >= k0).map(p => ({
    from: Math.max(0, dayDiff(k0, p.start)), to: Math.min(6, dayDiff(k0, p.end)), contL: p.start < k0, contR: p.end > k6,
    cls: STATUS_CLS[p.type] || 'out', icon: STATUS_ICON[p.type] || IC.calendar, label: p.type, sub: p.note || '',
    title: `${u.name} · ${p.type}${p.note ? ' · ' + p.note : ''} (${fmtDay(p.start)}${p.end !== p.start ? ' ~ ' + fmtDay(p.end) : ''})`,
  }));
  if (!isSup(u)) state.requests
    .filter(r => isMember(r, u.id) && r.status !== '반려' && r.status !== '취소' && r.departAt.slice(0, 10) >= k0 && r.departAt.slice(0, 10) <= k6)
    .sort((a, b) => a.departAt.localeCompare(b.departAt))
    .forEach(r => {
      const d = dayDiff(k0, r.departAt.slice(0, 10)), co = isCoWork(r), rec = isRecord(r);
      if (!onTrip(r, u.id)) return;
      evs.push({
        rid: r.id, from: d, to: d, cls: rec ? 'res' : 'field', co: co && !rec, pending: r.status === '승인 대기', icon: rec ? IC.office : co ? IC.team : IC.car,
        label: rec ? '상주지원' : `${co ? '공동 ' : ''}외근${r.status === '승인 대기' ? ' · 대기' : ''}`, sub: `${hm(new Date(r.departAt))} ${orgText(r)}`,
        title: `${r.id} ${reqLabel(r).label} · ${namesOf(members(r))} · ${orgText(r)}${r.locationDetail ? ' ' + r.locationDetail : ''} · ${hm(new Date(r.departAt))}~${hm(new Date(r.expectedReturnAt))}`,
      });
    });
  evs.sort((a, b) => a.from - b.from || (b.to - b.from) - (a.to - a.from));
  const ends = [];
  evs.forEach(e => { let l = ends.findIndex(x => x < e.from); if (l < 0) { l = ends.length; ends.push(-1); } ends[l] = e.to; e.lane = l; });
  return { evs, lanes: Math.max(1, ends.length) };
}
const evHTML = (e, style = '') => `<div class="ev st-${e.cls}${e.pending ? ' pending' : ''}${e.co ? ' co' : ''}${e.contL ? ' cont-l' : ''}${e.contR ? ' cont-r' : ''}${e.rid ? ' link' : ''}"${style}${e.rid ? ` data-action="open-detail" data-id="${e.rid}" role="button" tabindex="0"` : ''} title="${esc(e.title)}${e.rid ? ' (누르면 상세)' : ''}">
  <span class="ev-ic">${e.icon}</span><b>${esc(e.label)}</b>${e.sub ? `<small>${esc(e.sub)}</small>` : ''}</div>`;
function weekHTML() {
  const days = weekDays();
  const today = dkey(now());
  const people = schedPeople();
  const dayCls = d => `${d.getDay() === 0 || d.getDay() === 6 ? ' weekend' : ''}${HOLIDAYS[dkey(d)] ? ' holiday' : ''}${dkey(d) === today ? ' today' : ''}`;
  const dayNum = d => d.getDate() === 1 || d === days[0] ? `<small>${d.getMonth() + 1}/</small>${d.getDate()}` : d.getDate();
  const head = days.map(d => `<div class="dh${dayCls(d)}"><span class="dn">${DAYS[d.getDay()]}</span><span class="dd">${dayNum(d)}</span>${HOLIDAYS[dkey(d)] ? `<span class="hol">${HOLIDAYS[dkey(d)]}</span>` : ''}${dkey(d) === today ? '<em>오늘</em>' : ''}</div>`).join('');
  const data = people.map(u => ({ u, ...weekEvents(u, days) }));
  const rows = data.map(({ u, evs, lanes }) => `
    <div class="cal-row${u.id === currentUserId ? ' mine' : ''}" style="grid-template-rows: repeat(${lanes}, minmax(38px, auto))">
      <div class="who-cell">${avatarHTML(u, 'sm')}<span><b>${esc(u.name)}</b><small>${esc(u.part || u.role)}</small></span></div>
      ${days.map((d, i) => `<div class="cal-bg${dayCls(d)}" style="grid-column:${i + 2}"></div>`).join('')}
      ${evs.map(e => evHTML(e, ` style="grid-column:${e.from + 2} / ${e.to + 3};grid-row:${e.lane + 1}"`)).join('')}
    </div>`).join('');
  // 휴대폰: 날짜별 카드
  const agenda = days.map((d, i) => {
    const list = data.flatMap(({ u, evs }) => evs.filter(e => e.from <= i && e.to >= i)
      .map(e => `<li>${avatarHTML(u, 'xs')}<b class="ag-name">${esc(u.name)}</b>${evHTML(e)}</li>`));
    return `<div class="ag-day${dayCls(d)}${list.length ? '' : ' empty'}">
      <div class="ag-tile"${HOLIDAYS[dkey(d)] ? ` title="${HOLIDAYS[dkey(d)]}"` : ''}><span>${DAYS[d.getDay()]}</span><b>${d.getDate()}</b>${HOLIDAYS[dkey(d)] ? `<small class="hol">${HOLIDAYS[dkey(d)]}</small>` : ''}</div>
      ${list.length ? `<ul>${list.join('')}</ul>` : '<p class="ag-none">일정 없음</p>'}</div>`;
  }).join('');
  const sameMonth = days[0].getMonth() === days[6].getMonth();
  const label = `${days[0].getMonth() + 1}월 ${days[0].getDate()}일 – ${sameMonth ? '' : days[6].getMonth() + 1 + '월 '}${days[6].getDate()}일`;
  const rel = calWeek === 0 ? '이번 주' : calWeek === 1 ? '다음 주' : calWeek === -1 ? '지난주' : calWeek > 0 ? `${calWeek}주 뒤` : `${-calWeek}주 전`;
  const legend = [['leave', '휴가', IC.leave], ['trip', '출장', IC.trip], ['out', '외출', IC.out], ['field', '외근', IC.car], ['co', '공동 외근', IC.team]]
    .map(([c, t, i]) => `<span class="lg st-${c}"><i>${i}</i>${t}</span>`).join('') + `<span class="lg lg-pending st-field"><i></i>승인 대기</span>`;
  return `
  <section class="sc-week">
    ${pageHead('schedule', '휴가 · 출장 일정표', '휴가 · 출장 · 외출 일정을 미리 등록하면 6명이 한 주 일정을 함께 봅니다. 승인된 외근도 같이 표시됩니다.', `
      <div class="wk-nav" role="group" aria-label="주 이동">
        <button class="wk-btn" data-action="cal-week" data-d="-1" aria-label="지난주">${IC.chevL}</button>
        <div class="wk-label"><b>${label}</b><span>${rel}</span></div>
        <button class="wk-btn" data-action="cal-week" data-d="1" aria-label="다음 주">${IC.chevR}</button>
        <button class="wk-today" data-action="cal-week" data-d="0" ${calWeek ? '' : 'disabled'}>이번 주</button>
      </div>`)}
    <div class="panel cal">
      <div class="cal-scroll">
        <div class="cal-head"><div class="dh corner" aria-hidden="true"></div>${head}</div>
        <div class="cal-body">${rows}</div>
      </div>
      <div class="cal-agenda">${agenda}</div>
      <div class="cal-foot">${legend}</div>
    </div>
  </section>`;
}

function scheduleHTML() {
  const u = me();
  const types = SCHED_TYPES[u.role] || ['휴가'];
  const today = dkey(now());
  const d = { type: types[0], start: today, end: today, note: '', ...schedDraft };
  if (!types.includes(d.type)) d.type = types[0];
  const quick = [['today', '오늘'], ['tomorrow', '내일'], ['nextmon', '다음 주 월요일'], ['nextweek', '다음 주 월~금']];
  return `
  ${weekHTML()}
  <div class="sc-bottom">
    <form class="panel sc-form" id="sched-form" novalidate>

// 기간 표시: 총 N일 (평일 M일)
function durText(a, b) {

  const n = dayDiff(a, b) + 1;
  let w = 0; for (let i = 0; i < n; i++) { const g = addDays(keyDate(a), i).getDay(); if (g && g !== 6 && !HOLIDAYS[dkey(addDays(keyDate(a), i))]) w++; }
  return `총 ${n}일${w !== n ? ` · 근무일 ${w}일` : ''}`;
}

function nextScheduleId() {

/* ---------- 월간 외근 실적 보고서 (감독원) ----------

let repMonth = 0;
const hoursOf = r => r.returnedAt ? Math.max(0, (new Date(r.returnedAt) - new Date(r.startedAt || r.departAt)) / 3600000) : 0;
const fmtH = h => { const m = Math.round(h * 60); return `${Math.floor(m / 60)}시간 ${pad(m % 60)}분`; };
const startLateMin = r => r.startedAt ? Math.floor((new Date(r.startedAt) - new Date(r.departAt)) / 60000) : 0;
function monthRange() {
  const t = now(), m0 = new Date(t.getFullYear(), t.getMonth() + repMonth, 1), m1 = new Date(m0.getFullYear(), m0.getMonth() + 1, 0);
  return { a: dkey(m0), b: dkey(m1), label: `${m0.getFullYear()}년 ${m0.getMonth() + 1}월` };
}
const monthList = () => { const { a, b } = monthRange(); return state.requests.filter(r => r.departAt.slice(0, 10) >= a && r.departAt.slice(0, 10) <= b); };
/* 대시보드 차트 도우미 — 모든 막대는 마우스를 올리거나 키보드로 초점을 주면 값이 뜬다(data-tip-v · data-tip-l).
   색: 한 가지 값 비교는 파랑 한 색, 구성 비율은 정해진 순서의 범주 색, 작업 결과는 상태 색(범례 · 표와 함께) */
const VIZ = {
  blue: '#0072ce', blueTrack: '#e6f0fa', navy: '#15336f', light: '#a9cdf0',
  cat: ['#0072ce', '#6fb1ea', '#e4572e', '#c3cad6'],            // 처리 현황: 복귀 완료 · 진행 · 반려 · 취소 (고정 순서)
  good: '#0d8a5b', warning: '#f0a020', critical: '#d92d20', none: '#c3cad6', res: '#0e7490',
};
const tipAttr = (v, l) => `tabindex="0" data-tip-v="${esc(v)}" data-tip-l="${esc(l)}"`;
// 순위 막대(가로): 큰 값부터, 한 색, 값은 막대 끝에
function vizBars(rows, aria) {
  if (!rows.length) return '<p class="viz-empty">자료가 없습니다.</p>';
  const max = Math.max(...rows.map(r => r.value), 1);
  return `<ol class="vb" aria-label="${esc(aria)}">${rows.map((r, i) => `
    <li ${tipAttr(r.tipV, r.label)}>
      <span class="vb-rank">${i + 1}</span><span class="vb-name">${esc(r.label)}</span><span class="vb-val">${esc(r.text)}</span>
      <span class="vb-track"><span class="vb-bar" style="width:${Math.max(r.value / max * 100, r.value ? 2 : 0).toFixed(2)}%"></span></span>

// 구성 막대: 한 전체를 부분으로 나눈 굵은 막대(부분 6개 이하) + 범례
function vizSeg(parts, aria) {
  const total = parts.reduce((t, x) => t + x.value, 0);
  if (!total) return '<p class="viz-empty">자료가 없습니다.</p>';
  const shown = parts.filter(x => x.value > 0);
  return `
    <div class="vs" role="group" aria-label="${esc(aria)}">${shown.map(x => {
      const pct = Math.round(x.value / total * 100);
      return `<span class="vs-blk" style="flex:${x.value} 1 0;background:${x.color};color:${x.ink || '#fff'}" ${tipAttr(`${x.value}건 (${pct}%)`, x.name)}>${pct >= 12 ? pct + '%' : ''}</span>`;
    }).join('')}</div>
    <div class="vs-legend">${parts.map(x => `<span><i style="background:${x.color}"></i>${esc(x.name)} <b>${x.value}건</b></span>`).join('')}</div>`;
}
// 일별 세로 막대: 한 색, 가장 많은 날만 값 표시, 가로축은 1 · 5 · 10 · 15 · 20 · 25 · 말일
function vizDays(a, b, list) {
  const days = [];
  for (let d = keyDate(a); dkey(d) <= b; d = addDays(d, 1)) days.push(d);
  const cnt = days.map(d => list.filter(r => r.departAt.slice(0, 10) === dkey(d)).length);
  const max = Math.max(...cnt, 0), yMax = Math.max(max, 2);
  const step = yMax <= 4 ? 1 : Math.ceil(yMax / 4);
  const ticks = []; for (let t = 0; t <= yMax; t += step) ticks.push(t);
  const top = ticks[ticks.length - 1];
  const peak = cnt.indexOf(max);
  return `
    <div class="vc" role="group" aria-label="일별 외근 건수">
      <div class="vc-plot">
        ${ticks.map(t => `<span class="vc-grid" style="bottom:${t / top * 100}%"><em>${t}</em></span>`).join('')}
        <div class="vc-cols">${days.map((d, i) => {
          const k = dkey(d), off = d.getDay() === 0 || d.getDay() === 6 || HOLIDAYS[k];
          return `<span class="vc-col${off ? ' off' : ''}${i === peak && max ? ' peak' : ''}" ${tipAttr(`${cnt[i]}건`, `${fmtDay(k)}${HOLIDAYS[k] ? ' · ' + HOLIDAYS[k] : ''}`)}>
            ${cnt[i] ? `<i style="height:${cnt[i] / top * 100}%">${i === peak ? `<b>${cnt[i]}</b>` : ''}</i>` : ''}</span>`;

    if (isNoReturn(r)) out.push([`nr:${r.id}`, '미복귀', `${who} · 복귀 처리가 되지 않았습니다`]);
  });
  else state.requests.filter(r => isMember(r, u.id)).forEach(r => {
    if (r.status === '승인' && n >= new Date(r.departAt) && dkey(n) === r.departAt.slice(0, 10)) out.push([`sd:${r.id}`, '출발 예정 시각', `${orgText(r)} · 출발할 때 "외근 시작"을 누르세요 (출발 전 안전 재확인)`]);
    const left = (new Date(r.expectedReturnAt) - n) / 60000;
    if (r.status === '외근 중' && left > 0 && left <= 15) out.push([`rs:${r.id}:${r.expectedReturnAt}`, '복귀 15분 전', `예상 복귀 ${fmtDT(r.expectedReturnAt)} · 늦어지면 "복귀 연장"을 눌러 주세요`]);
  });
  return out;
}
// 새로 생긴 변경 이력 중 나에게 해당하는 것 + 시간 기준 안내를 알림으로 (같은 알림은 한 번만)
function checkNotifications() {
  const u = me();
  if (!u) return;
  const pref = notifyPrefs(u);
  const rec = notified[u.id] || (notified[u.id] = { last: state.auditSeq || 0, keys: [] });
  if (!pref.enabled || !notifyGranted()) { rec.last = state.auditSeq || 0; saveNotified(); return; }
  (state.audit || []).filter(a => a.id > rec.last && (a.to || []).includes(u.id) && a.by !== u.id).forEach(a => {
    const t = alertTypeOf(a, u);
    if (t && pref.types[t]) pushNotify(`[Safe-전산ON] ${a.action}`, `${whoName(a.by)} · ${a.target}${a.detail ? ' · ' + a.detail : ''}`.slice(0, 140), 'a' + a.id);
  });
  rec.last = state.auditSeq || rec.last;
  if (pref.types.time) timeAlerts(u).forEach(([key, title, body]) => {
    if (rec.keys.includes(key)) return;
    rec.keys.push(key); pushNotify(`[Safe-전산ON] ${title}`, body, key);
  });
  rec.keys = rec.keys.slice(-300);
  saveNotified();
}

/* ---------- 개인정보 보관 기간 ----------
   기본값은 시제품 제안값이다. 실제 운영 전 기관 기록관리 · 개인정보 담당 부서와 확인해 정한다.
   · 휴가 · 외출 사유와 상태 메모: 기간이 지나면 내용만 자동으로 지움(일정 · 기록 자체는 남김)
   · 외근 기록 · 변경 이력: 기간이 지난 것은 감독원이 확인하고 정리(삭제)하며, 정리한 사실도 이력에 남김 */
const retention = () => ({ ...DEFAULT_RET, ...((state.settings || {}).retention || {}) });
function retentionCut() {
  const R = retention(), n = now();
  const yAgo = y => dkey(new Date(n.getFullYear() - y, n.getMonth(), n.getDate()));
  return { note: dkey(addDays(n, -R.noteDays)), record: yAgo(R.recordYears), audit: yAgo(R.auditYears) };
}
const recordEnd = r => (r.returnedAt || r.canceledAt || r.decidedAt || r.requestedAt || r.departAt).slice(0, 10);
function expiredItems() {
  const c = retentionCut();
  return {
    records: state.requests.filter(r => ['복귀 완료', '반려', '취소'].includes(r.status) && recordEnd(r) < c.record),
    audits: (state.audit || []).filter(a => a.at.slice(0, 10) < c.audit),
  };
}
function maskExpiredNotes() {
  const c = retentionCut();
  let n = 0;
  (state.schedules || []).forEach(p => { if (p.note && p.end < c.note) { p.note = ''; p.noteExpired = true; n++; } });
  (state.statusLogs || []).forEach(l => { if (l.note && l.at.slice(0, 10) < c.note) { l.note = ''; n++; } });
  if (n) { audit('setting', '보관 기간 지난 사유 삭제', '', `휴가 · 외출 사유와 상태 메모 ${n}건의 내용을 지움 (보관 ${retention().noteDays}일)`, { by: 'SYSTEM' }); save(); }
}

    st.push({ label: '지원 시간', at: r.departAt, sub: `${fmtDT(r.departAt)} ~ ${fmtDT(r.expectedReturnAt)}`, future: new Date(r.departAt) > now() });
  } else {

let safetyDraft = null;
function adminHTML() {
  if (!safetyDraft) safetyDraft = JSON.parse(JSON.stringify(state.safetyItems));
  const listEditor = (key, icon, title, desc) => `
    <section class="panel set-card">

    <form class="panel set-card" id="users-form" novalidate>
      <h2>${ic('team')} 직원 · 감독원</h2>
      <div class="rep-scroll"><table class="rep-table ad-users"><thead><tr><th>구분</th><th>이름</th><th>담당 분야</th><th>사용</th></tr></thead><tbody>
        ${state.users.map(u => `<tr${isActive(u) ? '' : ' class="off"'}>
          <td class="au-role">${esc(u.role)}</td>
          <td data-label="이름"><input class="inp" name="name-${u.id}" value="${esc(u.name)}" maxlength="10" aria-label="${esc(u.name)} 이름"></td>
          <td data-label="담당 분야">${isSup(u) ? '<span class="muted">-</span>' : `<input class="inp" name="part-${u.id}" value="${esc(u.part || '')}" maxlength="15" aria-label="${esc(u.name)} 담당 분야">`}</td>
          <td class="au-use">${u.id === currentUserId ? '<span class="muted">본인</span>' : `<label class="check-row"><input type="checkbox" name="active-${u.id}" ${isActive(u) ? 'checked' : ''}> 사용</label>`}</td>
        </tr>`).join('')}
      </tbody></table></div>
      <p class="err" id="users-err" hidden></p>
      <button class="btn primary">변경 저장</button>
      <p class="hint">사용을 끄면 로그인 화면 · 현황판 · 선택 목록에서 빠지고, 지난 기록과 보고서에는 그대로 남습니다. 외근 중인 사람은 끌 수 없습니다.</p>
    </form>

      <h2>${ic('plus')} 용역직원 추가</h2>
      <label class="sa-field"><span>이름</span><input class="inp" name="name" maxlength="10" placeholder="예: 홍길동"></label>
      <label class="sa-field"><span>담당 분야</span><input class="inp" name="part" maxlength="15" placeholder="예: 네트워크"></label>
      <p class="err" id="user-add-err" hidden></p>
      <button class="btn primary">${ic('plus')} 직원 추가</button>
    </form>
    <form class="panel set-card" id="pin-change-form" novalidate>
      <h2>${ic('shield')} 내 PIN 변경</h2>
      <label class="sa-field"><span>지금 PIN</span><input class="inp" name="cur" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <label class="sa-field"><span>새 PIN (숫자 4자리)</span><input class="inp" name="next" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <label class="sa-field"><span>새 PIN 확인</span><input class="inp" name="again" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <p class="err" id="pin-change-err" hidden></p>
      <button class="btn primary">PIN 변경</button>

    </form>
    <form class="panel set-card ad-safety-card" id="safety-form" novalidate>
      <h2>${ic('shield')} 안전 준수 항목</h2>
      <p class="hint">요청할 때와 출발 직전(외근 시작) 확인하는 항목입니다. "적용"으로 지원 구분별 항목을 정합니다(예: 교통안전 준수는 방문지원만). 위 · 아래 단추로 순서를 바꾸면 요청서에도 같은 순서로 나옵니다. 바꾼 항목은 새 요청부터 적용되고, 지난 요청의 확인 기록은 그대로 남습니다.</p>
      <p class="hint safety-rule">${ic('shield')} 저장된 기준 — ${safetyRuleText()}</p>
      ${safetyDraft.map((it, i) => `
        <div class="ad-safety">
          <span class="ad-n">${i + 1}</span>
          <input class="inp" name="t-${i}" value="${esc(it.title)}" maxlength="20" placeholder="항목 이름" aria-label="안전 항목 ${i + 1} 이름">
          <input class="inp" name="d-${i}" value="${esc(it.desc || '')}" maxlength="60" placeholder="설명" aria-label="안전 항목 ${i + 1} 설명">
          <select class="inp" name="s-${i}" aria-label="안전 항목 ${i + 1} 적용">${SAFETY_SCOPES.map(sc => `<option value="${sc}" ${scopeOf(it) === sc ? 'selected' : ''}>${sc === '공통' ? '공통' : sc + '만'}</option>`).join('')}</select>
          <label class="check-row"><input type="checkbox" name="r-${i}" ${it.required !== false ? 'checked' : ''}> 필수</label>
          <span class="ad-btns">
            <button type="button" class="icon-btn sm" data-action="ad-safety-move" data-i="${i}" data-d="-1" ${i ? '' : 'disabled'} aria-label="안전 항목 ${i + 1} 위로">${IC.up}</button>
            <button type="button" class="icon-btn sm" data-action="ad-safety-move" data-i="${i}" data-d="1" ${i < safetyDraft.length - 1 ? '' : 'disabled'} aria-label="안전 항목 ${i + 1} 아래로">${IC.down}</button>
            <button type="button" class="icon-btn sm del" data-action="ad-safety-del" data-i="${i}" aria-label="안전 항목 ${i + 1} 삭제">${IC.trash}</button>
          </span>
        </div>`).join('')}
      <div class="seg"><button type="button" class="btn" data-action="ad-safety-add">${ic('plus')} 항목 추가</button><button class="btn primary">안전 항목 저장</button></div>
      <p class="err" id="safety-err" hidden></p>
