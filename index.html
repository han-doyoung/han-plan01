/* ---------- 화면 ③: 작업승인 요청 (용역직원) ---------- */
const REQ_CLS = { '승인 대기': 'out', '승인': 'work', '외근 중': 'field', '복귀 완료': 'leave', '반려': 'late', '취소': 'leave' };

function toInputValue(d) { return toLocalISO(d).slice(0, 16); }
function defaultTimes() {
  const d = now();
  d.setSeconds(0, 0);
  d.setMinutes(Math.ceil((d.getMinutes() + 1) / 10) * 10); // 다음 10분 단위
  const back = new Date(d.getTime() + 2 * 3600 * 1000);
  return [toInputValue(d), toInputValue(back)];
}

// 승인 전(승인 대기) 본인 요청만 수정할 수 있다
let editingId = null;
const editableRequest = id => {
  const r = reqById(id);
  return r && r.status === '승인 대기' && isMember(r, currentUserId) ? r : null;
};

function requestHTML() {
  const er = editableRequest(editingId);
  if (!er) editingId = null;
  const [dep, ret] = er ? [er.departAt.slice(0, 16), er.expectedReturnAt.slice(0, 16)] : defaultTimes();
  const radios = (name, list, checked) => list.map(v =>
    `<label class="opt"><input type="radio" name="${name}" value="${v}" ${v === checked ? 'checked' : ''} required><span>${v}</span></label>`).join('');
  const safetyOn = (s, req) => er ? (er.safetyChecked || []).includes(s.title) : false;
  return `
  ${pageHead('request', '작업승인 요청', `외근 작업 전에 감독원에게 승인을 요청합니다. 승인된 뒤 실제로 출발할 때 "외근 시작"을 누르면 현황판이 "외근"으로 바뀝니다. 2명 이상 함께 나가면 공동작업자를 선택하세요. 승인 전까지는 내 요청(공동작업은 공동작업자 모두)을 수정할 수 있습니다.`)}
  <div class="layout2">
    <form class="panel form${er ? ' editing' : ''}" id="req-form" novalidate>
      ${er ? `<div class="edit-banner"><span>${ic("pencil")} <b>${er.id}</b> 요청을 수정하고 있습니다</span>
        <button type="button" class="btn small" data-action="cancel-edit">수정 취소</button></div>` : ''}
      <div class="field"><span class="lbl">작업 구분</span>
        <div class="opts">${radios('workType', state.workTypes, er ? er.workType : state.workTypes[0])}</div></div>
      <div class="field"><span class="lbl">작업 장소</span>
        <div class="opts">${radios('location', state.locations, er ? er.location : undefined)}</div>
        <input class="inp mt6" name="locationDetail" maxlength="40" placeholder="상세 장소 (예: 2층 통신실) · 기타는 필수" value="${er ? esc(er.locationDetail || '') : ''}"></div>
      <div class="row2">
        <div class="field"><label class="lbl" for="departAt">작업 일시 (출발)</label>
          <input class="inp" type="datetime-local" id="departAt" name="departAt" value="${dep}" required></div>
        <div class="field"><label class="lbl" for="expectedReturnAt">예상 복귀 시각</label>
          <input class="inp" type="datetime-local" id="expectedReturnAt" name="expectedReturnAt" value="${ret}" required></div>
      </div>
      ${coWorkerFieldHTML(er)}
      <div class="field"><label class="lbl" for="description">작업 내용</label>
        <textarea class="inp" id="description" name="description" maxlength="200" placeholder="예: 통신실 스위치 링크 다운 장애 조치" required>${er ? esc(er.description) : ''}</textarea></div>
      <div class="field"><span class="lbl">안전 준수 확인 <small>(필수 항목은 모두 확인해야 요청할 수 있습니다)</small></span>
        <div class="checks">${state.safetyItems.map((s, i) => {
          const req = s.required !== false;
          return `
          <label class="check"><input type="checkbox" name="safety" value="${i}" ${req ? 'required' : ''} ${safetyOn(s) ? 'checked' : ''}>
            <span><b>${esc(s.title)} <em class="tag ${req ? 'req' : 'opt'}">${req ? '필수' : '선택'}</em></b><small>${esc(s.desc)}</small></span></label>`;
        }).join('')}
        </div></div>
      <p class="err" id="req-err" hidden></p>
      <button class="btn primary">${er ? '수정 내용 저장' : '승인 요청'}</button>
    </form>
    <section>
      <h2 style="margin-top:0">내 요청</h2>
      <div class="panel" id="my-req">${myRequestsHTML()}</div>
    </section>
  </div>`;
}

// 공동작업자 선택: 단독 작업이 기본, 함께 나가는 직원을 체크
// 수정할 때는 등록한 직원은 고정, 수정하는 공동작업자 본인은 빠질 수 없음
function coWorkerFieldHTML(er) {
  const owner = er ? er.requesterId : currentUserId;
  const picked = er ? (er.coWorkerIds || []) : [];
  const others = state.users.filter(u => !isSup(u) && u.id !== owner);
  const ownerU = userById(owner);
  return `
      <div class="field"><span class="lbl">공동작업자 <small>(선택 · 혼자 작업하면 비워 두세요)</small></span>
        ${er && owner !== currentUserId ? `<p class="hint co-owner">${ic('team')} 등록한 직원: <b>${esc(ownerU ? ownerU.name : owner)}</b> (고정)</p>` : ''}
        <div class="opts wo-to co-pick">${others.map(u => {
          const self = u.id === currentUserId;
          const busy = u.status === '휴가' ? '휴가 중' : u.status === '외근' && !(er && u.currentRequestId === er.id) ? '외근 중' : '';
          return `<label class="opt"><input type="checkbox" name="coWorker" value="${u.id}" ${picked.includes(u.id) ? 'checked' : ''} ${self ? 'disabled' : ''}>
          <span>${esc(u.name)}<small>${self ? '본인 (공동작업자)' : busy ? `${esc(u.part || '')} · ${busy}` : esc(u.part || u.role)}</small></span></label>`;
        }).join('')}</div></div>`;
}

// 필수 항목 확인 여부 + 선택 항목이 있으면 체크했을 때만 함께 표시
function safetyText(r) {
  const done = r.safetyChecked || [];
  const missing = state.safetyItems.filter(s => s.required !== false && !done.includes(s.title));
  if (missing.length) return '<span class="late-txt">안전 준수 확인 없음</span>';
  return `<span class="safety-ok">${ic('check')} ${done.map(esc).join(' · ')}</span>`;
}
function reqSummary(r) {
  return `${esc(r.location)}${r.locationDetail ? ` · ${esc(r.locationDetail)}` : ''}`;
}
function myRequestsHTML() {
  const list = state.requests.filter(r => isMember(r, currentUserId)).slice().reverse();
  if (!list.length) return '<p class="empty">아직 요청이 없습니다.</p>';
  return `<ul class="reqlist">${list.map(r => `
    <li class="${r.id === editingId ? 'is-editing' : ''}">
      <div class="top"><b>${reqSummary(r)}</b>${reqChip(r)}</div>
      ${isCoWork(r) ? `<span class="co-line">${coTag(r, currentUserId)}${r.requesterId !== currentUserId ? `<small class="muted">${esc(userById(r.requesterId).name)} 등록</small>` : ''}</span>` : ''}
      <span class="muted">${esc(r.workType)} · ${fmtDT(r.departAt)} ~ ${fmtDT(r.expectedReturnAt)}${r.startedAt ? ` · 출발 ${fmtDT(r.startedAt)}` : ''}${r.returnedAt ? ` · 복귀 ${fmtDT(r.returnedAt)}` : ''}${r.editedAt ? ` · <b class="edited">${editedText(r)}</b>` : ''}</span>
      <span>${esc(r.description)}</span>
      ${safetyText(r)}
      ${r.status === '반려' && r.rejectReason ? `<span class="reason">반려 사유: ${esc(r.rejectReason)}</span>` : ''}
      ${cancelLineHTML(r)}
      ${r.startSafety ? `<span class="safety-ok">${ic('shield')} 출발 전 안전 재확인 완료 · ${fmtDT(r.startedAt)}</span>` : ''}
      ${instructionHTML(r)}
      ${resultHTML(r)}
      ${myRequestActions(r)}
    </li>`).join('')}</ul>`;
}
// 취소된 요청: 누가 언제, 사유
function cancelLineHTML(r) {
  if (r.status !== '취소') return '';
  const by = userById(r.canceledBy);
  return `<span class="reason cancel">${r.prevStatus === '승인' ? '승인 후 ' : ''}취소 ${fmtDT(r.canceledAt)}${by ? ` · ${esc(by.name)}` : ''} — ${esc(r.cancelReason || '')}</span>`;
}
function myRequestActions(r) {
  const u = me();
  if (r.status === '승인' && u && isMember(r, u.id)) return startBoxHTML(r, u, true);
  if (r.status === '외근 중' && u && u.currentRequestId === r.id)
    return returnOpen ? returnFormHTML(r) : '<div><button class="btn small primary" data-action="return">복귀 처리</button></div>';
  if (r.status === '승인 대기' && u && isMember(r, u.id)) {
    if (cancelOpenId === r.id) return cancelFormHTML(r);
    return r.id === editingId
      ? `<div><span class="editing-tag">${ic('pencil')} 왼쪽에서 수정 중</span></div>`
      : `<div class="seg"><button class="btn small" data-action="edit-req" data-id="${r.id}">${ic("pencil")} 수정</button>
          <button class="btn small ghost cancel-btn" data-action="cancel-open" data-id="${r.id}">요청 취소</button></div>`;
  }
  return '';
}

function nextRequestId() {
  const max = state.requests.reduce((m, r) => Math.max(m, parseInt(r.id.slice(2), 10) || 0), 0);
  return 'R-' + String(max + 1).padStart(3, '0');
}

/* ---------- 화면 ④: 승인 관리 (감독원) ---------- */
let rejectTarget = null;
const pendingRequests = () => state.requests.filter(r => r.status === '승인 대기');

// 감독원 추가 요청사항: 입력 중인 내용은 화면이 다시 그려져도 남도록 따로 보관
const instrDrafts = {};
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.instr) instrDrafts[e.target.dataset.instr] = e.target.value;
});
function instructionHTML(r) {
  if (!r.instruction) return '';
  const a = userById(r.approverId);
  return `<div class="instr"><b>${ic("clipboard")} 감독원 요청사항${a ? ` · ${esc(a.name)}` : ''}</b><span>${esc(r.instruction)}</span></div>`;
}

// 요청 입력값 검사 (직원 요청서 · 감독원 수정 공통)
function checkReqFields(x) {
  if (!x.location) return '작업 장소를 선택하세요.';
  if (x.location === '기타' && !x.locationDetail) return '"기타"를 선택하면 상세 장소를 적어야 합니다.';
  if (!x.departAt || !x.expectedReturnAt) return '작업 일시와 예상 복귀 시각을 입력하세요.';
  if (new Date(x.expectedReturnAt) <= new Date(x.departAt)) return '예상 복귀 시각은 출발 시각보다 늦어야 합니다.';
  if (!x.description) return '작업 내용을 입력하세요.';
  return '';
}
// 누가 언제 수정했는지 (직원 본인 / 감독원)
function editedText(r) {
  if (!r.editedAt) return '';
  const by = userById(r.editedBy);
  const who = !by ? '' : isSup(by) ? `${esc(by.name)} 감독원` : by.id === currentUserId ? '본인' : isCoWork(r) ? esc(by.name) : '본인';
  return `수정됨 ${fmtDT(r.editedAt)} · ${who}`;
}

// 감독원: 승인 전 요청을 직접 수정
let supEditId = null;
function supEditFormHTML(r) {
  const opts = (list, cur) => list.map(v => `<option value="${v}" ${v === cur ? 'selected' : ''}>${v}</option>`).join('');

    <form class="sup-edit" id="sup-edit-form" data-id="${r.id}" novalidate>
      <div class="edit-banner"><span>${ic("pencil")} <b>${r.id}</b> 요청을 감독원이 수정합니다</span></div>
      <label>작업 구분<select class="inp" name="workType">${opts(state.workTypes, r.workType)}</select></label>
      <div class="row2">
        <label>작업 장소<select class="inp" name="location">${opts(state.locations, r.location)}</select></label>
        <label>상세 장소<input class="inp" name="locationDetail" maxlength="40" value="${esc(r.locationDetail || '')}" placeholder="기타는 필수"></label>
      </div>
      <div class="row2 dates">
        <label>출발<input class="inp" type="datetime-local" name="departAt" value="${r.departAt.slice(0, 16)}"></label>
        <label>예상 복귀<input class="inp" type="datetime-local" name="expectedReturnAt" value="${r.expectedReturnAt.slice(0, 16)}"></label>
      </div>
      <label>작업 내용<textarea class="inp" name="description" maxlength="200" rows="2">${esc(r.description)}</textarea></label>
      <p class="hint">안전 준수 확인은 직원 본인이 체크한 항목 그대로 유지됩니다.</p>
      <p class="err" id="sup-edit-err" hidden></p>
      <div class="seg">

        <button type="button" class="btn" data-action="cancel-sup-edit">취소</button>
      </div>
    </form>`;
}

// 공동작업 인원과 지금 상태 (휴가 · 다른 외근 중이면 표시)
function coMembersHTML(r) {
  return `<span class="co-members">${members(r).map(id => {
    const w = userById(id);
    const busy = !w ? '' : w.status === '휴가' ? '휴가 중' : w.status === '외근' && w.currentRequestId !== r.id ? '다른 외근 중' : '';

  }).join('')}</span>`;
}
function pendingCardHTML(r) {
  const u = userById(r.requesterId);
  if (supEditId === r.id) {
    return `
    <article class="card st-out editing-card">
      <header class="card-head">
        <div><div class="name">${esc(u ? u.name : r.requesterId)}</div><div class="role">${r.id} · 요청 ${fmtDT(r.requestedAt)}</div></div>
        <span class="badge">승인 대기</span>
      </header>
      ${supEditFormHTML(r)}
    </article>`;
  }
  const actionsHTML = rejectTarget === r.id
    ? `<form class="actions" id="reject-form" data-id="${r.id}">
         <input class="memo" name="reason" maxlength="60" placeholder="반려 사유 (필수) 예: 일정 재조정 필요" required>
         <div class="seg"><button class="btn small danger">반려 확정</button>
           <button type="button" class="btn small" data-action="cancel-reject">취소</button></div>
       </form>`
    : `<div class="actions">
         <label class="instr-lbl" for="instr-${r.id}">${ic("clipboard")} 추가 요청사항 <small>(선택 · 승인 시 직원에게 전달)</small></label>
         <textarea class="inp instr-inp" id="instr-${r.id}" data-instr="${r.id}" maxlength="200" rows="2"

         <div class="seg">

  return `
  <article class="card st-out">
    <header class="card-head">
      <div><div class="name">${esc(u ? u.name : r.requesterId)}${isCoWork(r) ? ` <small class="co-plus">외 ${r.coWorkerIds.length}명</small>` : ''}</div><div class="role">${r.id} · 요청 ${fmtDT(r.requestedAt)}</div>${r.editedAt ? `<div class="role"><b class="edited">${ic("pencil")} ${editedText(r)}</b></div>` : ''}</div>
      <span class="badge">승인 대기</span>
    </header>
    <dl class="kv">
      ${isCoWork(r) ? `<dt>공동</dt><dd>${coMembersHTML(r)}</dd>` : ''}
      <dt>작업</dt><dd>${esc(r.workType)}</dd>
      <dt>작업장소</dt><dd>${reqSummary(r)}</dd>
      <dt>출발</dt><dd>${fmtDT(r.departAt)}</dd>

      <dt>내용</dt><dd>${esc(r.description)}</dd>
      <dt>안전</dt><dd>${safetyText(r)}</dd>

}

function approveHTML() {
  const pending = pendingRequests();
  const lastAt = r => r.canceledAt || r.decidedAt;
  const decided = state.requests.filter(r => (r.decidedAt && sameDay(new Date(r.decidedAt), now())) || (r.canceledAt && sameDay(new Date(r.canceledAt), now())))
    .sort((a, b) => lastAt(b).localeCompare(lastAt(a)));
  return `
  ${pageHead('approve', '승인 관리', `승인해도 바로 "외근"이 되지 않습니다. 직원이 실제로 출발하면서 "외근 시작"을 누르면 외근이 되고, 그 시각이 출발 시각으로 기록됩니다. 반려할 때는 사유를 한 줄 적습니다.`)}
  <h2>승인 대기 ${pending.length}건</h2>
  ${pending.length ? `<div class="grid">${pending.map(pendingCardHTML).join('')}</div>`
                   : '<div class="panel"><p class="empty">승인 대기 중인 요청이 없습니다.</p></div>'}
  <h2>오늘 처리한 요청 <small class="h2-sub">직원이 취소한 요청 포함</small></h2>
  <div class="panel">${decided.length ? `<ul class="reqlist">${decided.map(r => {
      const u = userById(r.requesterId), a = userById(r.approverId);
      return `<li><div class="top"><b>${esc(u ? u.name : '')}${isCoWork(r) ? ` 외 ${r.coWorkerIds.length}명` : ''} · ${reqSummary(r)}</b>${reqChip(r)}</div>
        ${isCoWork(r) ? `<span class="co-line">${coTag(r)}</span>` : ''}
        ${r.decidedAt ? `<span class="muted">${fmtDT(r.decidedAt)} ${esc(a ? a.name : '')} ${r.status === '반려' ? '반려' : '승인'}</span>` : ''}
        ${r.status === '반려' && r.rejectReason ? `<span class="reason">반려 사유: ${esc(r.rejectReason)}</span>` : ''}
        ${cancelLineHTML(r)}

    }).join('')}</ul>` : '<p class="empty">오늘 처리한 요청이 없습니다.</p>'}</div>`;
}

/* ---------- 외근 시작 ----------
   승인만으로는 "외근"이 되지 않는다. 직원이 실제로 나가면서 "외근 시작"을 누른 시각이 출발 시각.
   공동작업은 한 명이 누르면 함께 가는 직원 모두 외근 시작 (다른 외근 중인 직원은 건너뜀). */
const START_GRACE_MIN = 10; // 출발 예정 시각이 이만큼 지나도 시작하지 않으면 "출발 지연"
const startDelayMin = r => r.status === '승인' ? Math.floor((now() - new Date(r.departAt)) / 60000) : 0;
const isStartLate = r => startDelayMin(r) > START_GRACE_MIN;
// 이 직원이 시작할 수 있는(승인된) 외근 — 출발 예정 순
const approvedFor = id => state.requests.filter(r => r.status === '승인' && isMember(r, id)).sort((a, b) => a.departAt.localeCompare(b.departAt));
// 시작 가능 여부: 출발일 당일부터, 다른 외근 중이 아닐 때
function startBlock(r, u) {
  if (r.departAt.slice(0, 10) > dkey(now())) return `${fmtDay(r.departAt.slice(0, 10))} 출발일에 시작할 수 있습니다`;
  if (u.status === '외근' && u.currentRequestId && u.currentRequestId !== r.id) return '다른 외근 중입니다. 복귀 처리 후 시작하세요';
  return '';
}
function startOuting(r, by) {
  const at = toLocalISO(now());
  r.status = '외근 중'; r.startedAt = at; r.startedBy = by.id;
  const started = [];
  members(r).forEach(id => {
    const u = userById(id);
    if (!u || (u.status === '외근' && u.currentRequestId && u.currentRequestId !== r.id)) return;
    setStatus(u, '외근', `${r.id} 외근 시작 (${r.location})${isCoWork(r) ? ' · 공동작업' : ''}${u.id !== by.id ? ` (${by.name} 처리)` : ''}`);
    u.currentRequestId = r.id;
    started.push(u);
  });
  return started;
}
// 열려 있는 양식: 외근 시작(안전 재확인) / 외근 취소 — 화면이 다시 그려져도 입력 유지
let startOpenId = null, cancelOpenId = null;
const startChecks = {};   // { 요청ID: [체크한 항목 번호] }
const cancelDrafts = {};  // { 요청ID: 사유 }
document.addEventListener('input', e => {
  const f = e.target.form;
  if (!f) return;
  if (f.id === 'start-form') startChecks[f.dataset.id] = [...f.querySelectorAll('input[name="ss"]:checked')].map(c => +c.value);
  if (f.id === 'cancel-form') cancelDrafts[f.dataset.id] = f.elements.reason.value;
});
// 직원이 취소할 수 있는 요청: 승인 대기 · 승인(출발 전)
const cancelable = (r, u) => u && isMember(r, u.id) && (r.status === '승인 대기' || r.status === '승인');

// 출발 직전 안전 재확인 — 모두 체크해야 외근 시작
function startFormHTML(r) {
  const done = startChecks[r.id] || [];
  return `
    <form class="start-form" id="start-form" data-id="${r.id}" novalidate>
      <div class="rf-head">${ic('shield')} <b>출발 전 안전 재확인</b><span class="muted">${r.id} · ${reqSummary(r)}</span></div>
      <p class="hint">출발 직전에 다시 확인하세요. 모든 항목을 체크해야 외근을 시작할 수 있습니다.</p>
      <div class="checks">${state.safetyItems.map((it, i) => `
        <label class="check"><input type="checkbox" name="ss" value="${i}" ${done.includes(i) ? 'checked' : ''}>
          <span><b>${esc(it.title)}</b><small>${esc(it.desc)}</small></span></label>`).join('')}</div>
      <p class="sf-keep">${ic('alarm')} 예상 복귀 <b>${fmtDT(r.expectedReturnAt)}</b> — 승인된 시각 그대로이며, 늦게 출발해도 바뀌지 않습니다.</p>
      ${isCoWork(r) ? `<p class="hint">공동작업입니다. 함께 가는 ${esc(namesOf(members(r).filter(id => id !== currentUserId)))}의 안전 수칙 준수도 함께 확인해 주세요. 시작하면 모두 외근으로 바뀝니다.</p>` : ''}
      <p class="err" id="start-err" hidden></p>
      <div class="seg">
        <button class="btn primary">${ic('car')} 외근 시작</button>
        <button type="button" class="btn" data-action="start-close">닫기</button>
      </div>
    </form>`;
}
// 외근 취소 — 사유 필수, 되돌릴 수 없음
function cancelFormHTML(r) {
  return `
    <form class="cancel-form" id="cancel-form" data-id="${r.id}" novalidate>
      <div class="rf-head">${ic('alarm')} <b>외근 취소</b><span class="muted">${r.id} · ${reqSummary(r)}</span></div>
      <p class="hint">작업이 필요 없어졌을 때 취소합니다. 취소하면 감독원 화면에 사유와 함께 표시되며 되돌릴 수 없습니다.${isCoWork(r) ? ' 공동작업은 함께 가는 직원 모두에게서 취소됩니다.' : ''}</p>
      <input class="inp" name="reason" maxlength="60" placeholder="취소 사유 (필수) 예: 지사 자체 조치로 작업 불필요" value="${esc(cancelDrafts[r.id] || '')}">
      <p class="err" id="cancel-err" hidden></p>
      <div class="seg">
        <button class="btn danger">취소 확정</button>
        <button type="button" class="btn" data-action="cancel-close">닫기</button>
      </div>
    </form>`;
}
// 내 상태 / 내 요청에 보이는 "외근 시작" 상자
function startBoxHTML(r, u, compact) {
  const block = startBlock(r, u);
  const late = isStartLate(r);
  const when = `${fmtDT(r.departAt)} 출발 예정 · 예상 복귀 ${fmtDT(r.expectedReturnAt)}${late ? ` <b class="late-txt">(출발 ${startDelayMin(r)}분 지남)</b>` : ''}`;
  const cancelBtn = `<button class="btn ghost cancel-btn" data-action="cancel-open" data-id="${r.id}">외근 취소</button>`;
  const controls = startOpenId === r.id ? startFormHTML(r)
    : cancelOpenId === r.id ? cancelFormHTML(r)
    : block ? `<div class="sb-actions"><span class="start-block">${esc(block)}</span>${cancelBtn}</div>`
    : `<div class="sb-actions"><button class="btn primary start-btn" data-action="start-open" data-id="${r.id}">${ic('car')} 외근 시작</button>${cancelBtn}</div>`;
  if (compact) return `<div class="start-inline">${controls}</div>`;
  const open = startOpenId === r.id || cancelOpenId === r.id;
  return `<div class="start-box${late ? ' late' : ''}${open ? ' open' : ''}">
    <span class="sb-ic">${IC.car}</span>
    <div class="sb-txt"><b>승인된 외근 · ${reqSummary(r)}</b><span>${when}${isCoWork(r) ? ` · ${coTag(r, u.id)}` : ''}</span></div>
    ${controls}
    ${block || open ? '' : '<p class="sb-hint">실제로 출발할 때 누르세요. 출발 전 안전 재확인 후, 누른 시각이 출발 시각으로 기록됩니다.</p>'}
  </div>`;
}
function cancelRequest(r, by, reason) {
  r.prevStatus = r.status;
  Object.assign(r, { status: '취소', cancelReason: reason, canceledAt: toLocalISO(now()), canceledBy: by.id });
}

/* ---------- 공지사항 (6명 누구나 게시) ---------- */
const DEFAULT_NOTICE = '작업장 안전수칙 및 교통안전 준수';
const notices = () => (state.notices || []).slice().sort((a, b) => b.at.localeCompare(a.at));

// 근무현황 상단 공지 1칸: 없으면 기본 문구, 여러 건이면 위로 올라가는 티커
let tickerIdx = 0;
function noticeBarHTML() {
  const list = notices();
  const items = list.length
    ? list.map(n => {
        const a = userById(n.authorId);
        return `<li><span class="nt-title">${esc(n.title)}</span><span class="nt-meta">${esc(a ? a.name : '')} · ${fmtDT(n.at)}</span></li>`;
      })
    : [`<li class="nt-default">${ic("shield")}<span class="nt-title">${DEFAULT_NOTICE}</span></li>`];
  const loop = items.length > 1 ? items.concat(items[0]) : items; // 끝에서 처음으로 자연스럽게 이어지도록 첫 줄 복제
  return `
  <div class="notice-bar" data-action="go" data-view="notice" role="button" tabindex="0" title="공지사항 게시판 열기">
    <span class="nt-tag">${ic("megaphone")} 공지</span>
    <div class="nt-window"><ul class="nt-list" id="nt-list" data-count="${items.length}">${loop.join('')}</ul></div>
    ${list.length > 1 ? `<span class="nt-count">${list.length}건</span>` : ''}
    <span class="nt-more" aria-hidden="true">${IC.chevR}</span>
  </div>`;
}
function placeTicker(animate) {
  const ul = document.getElementById('nt-list');
  if (!ul) return;
  const n = +ul.dataset.count;
  if (tickerIdx > n) tickerIdx = 0;
  const h = ul.firstElementChild ? ul.firstElementChild.offsetHeight : 26;
  ul.style.transition = animate ? 'transform .5s ease' : 'none';
  ul.style.transform = `translateY(-${tickerIdx * h}px)`;
}
setInterval(() => {
  const ul = document.getElementById('nt-list');
  if (!ul || +ul.dataset.count < 2 || ul.closest('.notice-bar').matches(':hover')) return;
  const n = +ul.dataset.count;
  tickerIdx++;
  placeTicker(true);
  if (tickerIdx >= n) setTimeout(() => { tickerIdx = 0; placeTicker(false); }, 550);
}, 3500);

function noticeHTML() {
  const list = notices();
  return `
  ${pageHead('notice', '공지사항', '근무현황 상단에 표시되는 공지입니다. 누구나 게시할 수 있고, 삭제는 작성자 본인과 감독원이 합니다.')}
  <div class="layout2">
    <form class="panel form" id="notice-form">
      <div class="field"><label class="lbl" for="nt-title">제목</label>
        <input class="inp" id="nt-title" name="title" maxlength="60" placeholder="예: 11/24 전산실 UPS 점검 안내" required></div>
      <div class="field"><label class="lbl" for="nt-body">내용 <small>(선택)</small></label>
        <textarea class="inp" id="nt-body" name="body" maxlength="500" placeholder="자세한 내용을 적어 주세요."></textarea></div>
      <button class="btn primary">공지 게시</button>
    </form>
    <section>
      <h2 style="margin-top:0">게시된 공지 ${list.length}건</h2>
      <div class="panel" id="notice-list">${noticeListHTML()}</div>
    </section>
  </div>`;
}
function noticeListHTML() {
  const list = notices();
  if (!list.length) return `<p class="empty">게시된 공지사항이 없습니다.<br>근무현황에는 기본 문구 "${DEFAULT_NOTICE}"가 표시됩니다.</p>`;
  const u = me();
  return `<ul class="notice-list">${list.map(n => {
    const a = userById(n.authorId);
    const canDelete = u && (u.id === n.authorId || isSup(u));
    return `
    <li>
      <div class="nl-head">
        <b class="nl-title">${esc(n.title)}</b>
        ${canDelete ? `<button class="btn small ghost" data-action="del-notice" data-id="${n.id}">삭제</button>` : ''}
      </div>
      <div class="nl-meta">${a ? avatarHTML(a, 'xs') : ''}<span>${esc(a ? a.name : '')}</span><span>·</span><time>${fmtDT(n.at)}</time></div>
      ${n.body ? `<p class="nl-body">${esc(n.body)}</p>` : ''}
    </li>`;
  }).join('')}</ul>`;
}

/* ---------- 작업 요청 (감독원 → 용역직원, 직원 확인) ---------- */
const workOrders = () => (state.workOrders || []).slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
const ackOf = (o, id) => (o.acks || {})[id];
const myInbox = () => workOrders().filter(o => o.toIds.includes(currentUserId));
function unackedForMe() { return myInbox().filter(o => !ackOf(o, currentUserId)).length; }
const unackedPeople = () => workOrders().reduce((n, o) => n + o.toIds.filter(id => !ackOf(o, id)).length, 0);
// 회신 입력 중인 내용은 화면이 다시 그려져도 남도록 보관
const ackDrafts = {};
const ACK_MAX = 300; // 회신 최대 글자 수 (2~3줄 이상 적을 수 있게)
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.ack) {
    ackDrafts[e.target.dataset.ack] = e.target.value;
    const c = document.querySelector(`[data-ack-count="${e.target.dataset.ack}"]`);
    if (c) c.textContent = `${e.target.value.length}/${ACK_MAX}`;
  }
});
function nextOrderId() {
  const max = (state.workOrders || []).reduce((m, o) => Math.max(m, parseInt(o.id.slice(2), 10) || 0), 0);
  return 'W-' + String(max + 1).padStart(3, '0');
}

// 근무현황 상단 안내: 직원은 새 요청, 감독원은 아직 확인 안 한 인원
function orderBannerHTML() {
  const u = me();
  if (!isSup(u)) {
    const n = unackedForMe();
    return n ? `<div class="banner info"><span>${ic('inbox')} 새 작업 요청 ${n}건이 있습니다.</span>
      <button class="btn small" data-action="go" data-view="inbox">확인하기</button></div>` : '';
  }
  const late = state.requests.filter(r => isStartLate(r) && r.departAt.slice(0, 10) === dkey(now()));
  const canceled = state.requests.filter(r => r.status === '취소' && r.prevStatus === '승인' && r.canceledAt && sameDay(new Date(r.canceledAt), now()));
  const cancelBanner = canceled.length ? `<div class="banner"><span>${ic('alarm')} 오늘 직원이 취소한 승인 외근 ${canceled.length}건 · ${esc(canceled.map(r => `${userById(r.canceledBy).name}(${r.cancelReason})`).join(', '))}</span>
    <button class="btn small" data-action="go" data-view="approve">자세히</button></div>` : '';
  const lateBanner = late.length ? `<div class="banner warn"><span>${ic('alarm')} 출발 예정 시각이 지났는데 아직 "외근 시작"을 하지 않은 승인 건 ${late.length}건 · ${esc(late.map(r => `${namesOf(members(r))}(${fmtDT(r.departAt)})`).join(', '))}</span></div>` : '';
  const n = unackedPeople();
  return lateBanner + cancelBanner + (n ? `<div class="banner info"><span>${ic('send')} 보낸 작업 요청 중 아직 확인하지 않은 직원 ${n}명</span>
    <button class="btn small" data-action="go" data-view="orders">작업 요청 보기</button></div>` : '');
}

function orderMetaHTML(o) {

  const from = userById(o.fromId);
  parts.push(`${ic('send')} ${esc(from ? from.name : '')} 감독원 · ${fmtDT(o.createdAt)}`);
  return `<div class="wo-meta">${parts.map(p => `<span>${p}</span>`).join('')}</div>`;
}
const urgentChip = o => o.priority === '긴급' ? '<span class="chip st-late">긴급</span>' : '';

// 감독원 화면: 작업 요청 보내기 + 보낸 요청의 확인 현황
function ordersHTML() {

          <span>${esc(u.name)}<small>${esc(u.part || u.role)}</small></span></label>`).join('')}</div></div>

        <input class="inp" id="wo-title" name="title" maxlength="60" placeholder="예: 담양지사 프린터 용지 걸림 점검" required></div>
      <div class="row2">

}

    const done = o.toIds.filter(id => ackOf(o, id)).length;

      <div class="wo-acks">${o.toIds.map(id => {

          : `<div class="ack no"><i class="dot"></i><b>${esc(w ? w.name : id)}</b><span>아직 확인 안 함</span></div>`;

      ${o.fromId === currentUserId ? `<div class="wo-foot"><button class="btn small ghost" data-action="del-order" data-id="${o.id}">요청 삭제</button></div>` : ''}

}

function inboxHTML() {

      ${a

        : `<div class="wo-ack-form">

               placeholder="예: 15시에 출발하겠습니다.&#10;현장 확인 후 조치 결과를 다시 보고드리겠습니다.">${esc(ackDrafts[o.id] || '')}</textarea>
             <div class="ack-foot"><span class="ack-count" data-ack-count="${o.id}">${(ackDrafts[o.id] || '').length}/${ACK_MAX}</span>

/* ---------- 휴가 · 출장 일정표 ----------
   본인 휴가 · 출장 · 외출 일정을 미리 등록하고, 6명의 한 주 일정을 한눈에 본다.
   승인된(또는 승인 대기) 외근도 함께 표시. 삭제는 등록한 본인과 감독원. */
const SCHED_TYPES = { '감독원': ['휴가', '출장', '외출'], '용역직원': ['휴가', '외출'] };
const schedules = () => (state.schedules || []).slice().sort((a, b) => a.start.localeCompare(b.start) || a.userId.localeCompare(b.userId));
const schedOn = (uid, k) => schedules().filter(p => p.userId === uid && p.start <= k && p.end >= k);
const todaySchedule = u => schedOn(u.id, dkey(now()))[0];
let calWeek = 0; // 이번 주 기준 몇 주 앞/뒤
const schedDraft = {};
document.addEventListener('input', e => {
  if (e.target.closest && e.target.closest('#sched-form') && e.target.name) schedDraft[e.target.name] = e.target.value;
});

// 근무현황 "내 상태": 오늘 등록된 일정이 있는데 상태가 다르면 한 번에 반영하도록 안내
function scheduleHintHTML(u) {
  const p = todaySchedule(u);
  if (!p || (u.status === p.type && (u.statusNote || '') === (p.note || ''))) return '';
  return `<div class="sched-hint">${ic('calendar')} <span>오늘 일정: <b>${esc(p.type)}</b>${p.note ? ` · ${esc(p.note)}` : ''}</span>
    <button class="btn small" data-action="apply-schedule" data-id="${p.id}">내 상태에 반영</button></div>`;
}

const SCHED_DESC = { '휴가': '연차 · 반차', '출장': '회의 · 교육', '외출': '잠시 자리 비움' };
const dayDiff = (a, b) => Math.round((keyDate(b) - keyDate(a)) / 86400000);
const weekDays = () => { const s0 = addDays(weekStartOf(now()), calWeek * 7); return Array.from({ length: 7 }, (_, i) => addDays(s0, i)); };
const schedPeople = () => [...state.users.filter(isSup), ...state.users.filter(u => !isSup(u))];

// 한 주(7칸) 안의 일정 막대: 여러 날 일정은 이어진 막대, 외근은 하루 막대. 겹치면 아래 줄로
function weekEvents(u, days) {
  const k0 = dkey(days[0]), k6 = dkey(days[6]);
  const evs = schedules().filter(p => p.userId === u.id && p.start <= k6 && p.end >= k0).map(p => ({
    from: Math.max(0, dayDiff(k0, p.start)), to: Math.min(6, dayDiff(k0, p.end)), contL: p.start < k0, contR: p.end > k6,
    cls: STATUS_CLS[p.type] || 'out', icon: STATUS_ICON[p.type] || IC.calendar, label: p.type, sub: p.note || '',
    title: `${u.name} · ${p.type}${p.note ? ' · ' + p.note : ''} (${fmtDay(p.start)}${p.end !== p.start ? ' ~ ' + fmtDay(p.end) : ''})`,
  }));
  if (!isSup(u)) state.requests
    .filter(r => isMember(r, u.id) && r.status !== '반려' && r.status !== '취소' && r.departAt.slice(0, 10) >= k0 && r.departAt.slice(0, 10) <= k6)
    .sort((a, b) => a.departAt.localeCompare(b.departAt))
    .forEach(r => {
      const d = dayDiff(k0, r.departAt.slice(0, 10)), co = isCoWork(r);
      evs.push({
        from: d, to: d, cls: 'field', co, pending: r.status === '승인 대기', icon: co ? IC.team : IC.car,
        label: `${co ? '공동 ' : ''}외근${r.status === '승인 대기' ? ' · 대기' : ''}`, sub: `${hm(new Date(r.departAt))} ${r.location}`,
        title: `${r.id} ${reqLabel(r).label} · ${namesOf(members(r))} · ${r.location}${r.locationDetail ? ' ' + r.locationDetail : ''} · ${hm(new Date(r.departAt))}~${hm(new Date(r.expectedReturnAt))}`,
      });
    });
  evs.sort((a, b) => a.from - b.from || (b.to - b.from) - (a.to - a.from));
  const ends = [];
  evs.forEach(e => { let l = ends.findIndex(x => x < e.from); if (l < 0) { l = ends.length; ends.push(-1); } ends[l] = e.to; e.lane = l; });
  return { evs, lanes: Math.max(1, ends.length) };
}
const evHTML = (e, style = '') => `<div class="ev st-${e.cls}${e.pending ? ' pending' : ''}${e.co ? ' co' : ''}${e.contL ? ' cont-l' : ''}${e.contR ? ' cont-r' : ''}"${style} title="${esc(e.title)}">
  <span class="ev-ic">${e.icon}</span><b>${esc(e.label)}</b>${e.sub ? `<small>${esc(e.sub)}</small>` : ''}</div>`;
function weekHTML() {
  const days = weekDays();
  const today = dkey(now());
  const people = schedPeople();
  const dayCls = d => `${d.getDay() === 0 || d.getDay() === 6 ? ' weekend' : ''}${dkey(d) === today ? ' today' : ''}`;
  const dayNum = d => d.getDate() === 1 || d === days[0] ? `<small>${d.getMonth() + 1}/</small>${d.getDate()}` : d.getDate();
  const head = days.map(d => `<div class="dh${dayCls(d)}"><span class="dn">${DAYS[d.getDay()]}</span><span class="dd">${dayNum(d)}</span>${dkey(d) === today ? '<em>오늘</em>' : ''}</div>`).join('');
  const data = people.map(u => ({ u, ...weekEvents(u, days) }));
  const rows = data.map(({ u, evs, lanes }) => `
    <div class="cal-row${u.id === currentUserId ? ' mine' : ''}" style="grid-template-rows: repeat(${lanes}, minmax(38px, auto))">
      <div class="who-cell">${avatarHTML(u, 'sm')}<span><b>${esc(u.name)}</b><small>${esc(u.part || u.role)}</small></span></div>
      ${days.map((d, i) => `<div class="cal-bg${dayCls(d)}" style="grid-column:${i + 2}"></div>`).join('')}
      ${evs.map(e => evHTML(e, ` style="grid-column:${e.from + 2} / ${e.to + 3};grid-row:${e.lane + 1}"`)).join('')}
    </div>`).join('');
  // 휴대폰: 날짜별 카드
  const agenda = days.map((d, i) => {
    const list = data.flatMap(({ u, evs }) => evs.filter(e => e.from <= i && e.to >= i)
      .map(e => `<li>${avatarHTML(u, 'xs')}<b class="ag-name">${esc(u.name)}</b>${evHTML(e)}</li>`));
    return `<div class="ag-day${dayCls(d)}${list.length ? '' : ' empty'}">
      <div class="ag-tile"><span>${DAYS[d.getDay()]}</span><b>${d.getDate()}</b></div>
      ${list.length ? `<ul>${list.join('')}</ul>` : '<p class="ag-none">일정 없음</p>'}</div>`;
  }).join('');
  const sameMonth = days[0].getMonth() === days[6].getMonth();
  const label = `${days[0].getMonth() + 1}월 ${days[0].getDate()}일 – ${sameMonth ? '' : days[6].getMonth() + 1 + '월 '}${days[6].getDate()}일`;
  const rel = calWeek === 0 ? '이번 주' : calWeek === 1 ? '다음 주' : calWeek === -1 ? '지난주' : calWeek > 0 ? `${calWeek}주 뒤` : `${-calWeek}주 전`;
  const legend = [['leave', '휴가', IC.leave], ['trip', '출장', IC.trip], ['out', '외출', IC.out], ['field', '외근', IC.car], ['co', '공동 외근', IC.team]]
    .map(([c, t, i]) => `<span class="lg st-${c}"><i>${i}</i>${t}</span>`).join('') + `<span class="lg lg-pending st-field"><i></i>승인 대기</span>`;
  return `
  <section class="sc-week">
    ${pageHead('schedule', '휴가 · 출장 일정표', '휴가 · 출장 · 외출 일정을 미리 등록하면 6명이 한 주 일정을 함께 봅니다. 승인된 외근도 같이 표시됩니다.', `
      <div class="wk-nav" role="group" aria-label="주 이동">
        <button class="wk-btn" data-action="cal-week" data-d="-1" aria-label="지난주">${IC.chevL}</button>
        <div class="wk-label"><b>${label}</b><span>${rel}</span></div>
        <button class="wk-btn" data-action="cal-week" data-d="1" aria-label="다음 주">${IC.chevR}</button>
        <button class="wk-today" data-action="cal-week" data-d="0" ${calWeek ? '' : 'disabled'}>이번 주</button>
      </div>`)}
    <div class="panel cal">
      <div class="cal-scroll">
        <div class="cal-head"><div class="dh corner" aria-hidden="true"></div>${head}</div>
        <div class="cal-body">${rows}</div>
      </div>
      <div class="cal-agenda">${agenda}</div>
      <div class="cal-foot">${legend}</div>
    </div>
  </section>`;
}

function scheduleHTML() {
  const u = me();
  const types = SCHED_TYPES[u.role] || ['휴가'];
  const today = dkey(now());
  const d = { type: types[0], start: today, end: today, note: '', ...schedDraft };
  if (!types.includes(d.type)) d.type = types[0];
  const quick = [['today', '오늘'], ['tomorrow', '내일'], ['nextmon', '다음 주 월요일'], ['nextweek', '다음 주 월~금']];
  return `
  ${weekHTML()}
  <div class="sc-bottom">
    <form class="panel sc-form" id="sched-form" novalidate>
      <div class="form-head"><span class="fh-ic">${IC.plus}</span><div><b>새 일정 등록</b><small>본인 일정만 등록할 수 있습니다</small></div></div>
      <div class="field"><span class="lbl">구분</span>
        <div class="type-tiles" style="--n:${types.length}">${types.map(t => `
          <label class="tile st-${STATUS_CLS[t]}"><input type="radio" name="type" value="${t}" ${d.type === t ? 'checked' : ''}>
            <span class="tile-in"><span class="tile-ic">${STATUS_ICON[t]}</span><b>${t}</b><small>${SCHED_DESC[t] || ''}</small></span></label>`).join('')}
        </div></div>
      <div class="field"><span class="lbl">기간 <span class="dur" id="sched-dur">${durText(d.start, d.end)}</span></span>
        <div class="quick">${quick.map(([k, l]) => `<button type="button" class="qchip" data-action="sched-quick" data-k="${k}">${l}</button>`).join('')}</div>
        <div class="date-range">
          <label><small>시작일</small><input class="inp" type="date" id="sc-start" name="start" value="${esc(d.start)}" required></label>
          <span class="dr-arrow" aria-hidden="true">${IC.arrowR}</span>
          <label><small>종료일</small><input class="inp" type="date" id="sc-end" name="end" value="${esc(d.end)}" required></label>
        </div></div>
      <div class="field"><label class="lbl" for="sc-note">내용 <small>(선택 · 현황판 추가 기재로도 쓰임)</small></label>
        <input class="inp" id="sc-note" name="note" maxlength="40" value="${esc(d.note)}" placeholder="예: 연차, 오전 반차, 본사 회의">
        <div class="quick mt6">${['연차', '오전 반차', '오후 반차', '교육', '회의'].map(v => `<button type="button" class="qchip soft" data-action="sched-note" data-v="${v}">${v}</button>`).join('')}</div></div>
      <p class="err" id="sched-err" hidden></p>
      <button class="btn primary sc-submit">${ic('calendar')} 일정 등록</button>
    </form>
    <section class="panel sc-up">
      <div class="up-head"><b>다가오는 일정</b><span class="up-count">${schedules().filter(p => p.end >= today).length}</span></div>
      <div id="sched-list">${scheduleListHTML()}</div>
    </section>
  </div>`;
}
// 기간 표시: 총 N일 (평일 M일)
function durText(a, b) {
  if (!a || !b) return '날짜를 고르세요';
  if (b < a) return '종료일이 시작일보다 빠릅니다';
  const n = dayDiff(a, b) + 1;
  let w = 0; for (let i = 0; i < n; i++) { const g = addDays(keyDate(a), i).getDay(); if (g && g !== 6) w++; }
  return `총 ${n}일${w !== n ? ` · 평일 ${w}일` : ''}`;
}
function updateSchedDur() {
  const f = document.getElementById('sched-form'), el = document.getElementById('sched-dur');
  if (!f || !el) return;
  el.textContent = durText(f.elements.start.value, f.elements.end.value);
  el.classList.toggle('bad', !!f.elements.start.value && f.elements.end.value < f.elements.start.value);
}
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#sched-form')) updateSchedDur(); });
function scheduleListHTML() {
  const today = dkey(now());
  const list = schedules().filter(p => p.end >= today);
  if (!list.length) return `<div class="up-empty">${IC.calendar}<p>등록된 일정이 없습니다.</p></div>`;
  const u = me();
  return `<ul class="up-list">${list.map(p => {
    const w = userById(p.userId), sd = keyDate(p.start);
    const canDelete = u && (u.id === p.userId || isSup(u));
    const n = dayDiff(p.start, p.end) + 1;
    const period = p.start === p.end ? fmtDay(p.start) : `${fmtDay(p.start)} – ${fmtDay(p.end)}`;
    const dd = p.start <= today ? '<em class="dday now">진행 중</em>' : `<em class="dday">D-${dayDiff(today, p.start)}</em>`;
    return `<li class="st-${STATUS_CLS[p.type] || 'out'}${p.userId === currentUserId ? ' mine' : ''}">
      <div class="dt"><small>${sd.getMonth() + 1}월</small><b>${sd.getDate()}</b><span>${DAYS[sd.getDay()]}</span></div>
      <div class="up-body">
        <div class="up-line">${w ? avatarHTML(w, 'xs') : ''}<b>${esc(w ? w.name : p.userId)}</b><span class="up-type">${stLabel(p.type)}</span>${dd}</div>
        <div class="up-meta">${period}${n > 1 ? ` · ${n}일` : ''}${p.note ? ` · ${esc(p.note)}` : ''}</div>
      </div>
      ${canDelete ? `<button class="icon-btn" data-action="del-schedule" data-id="${p.id}" aria-label="일정 삭제" title="삭제">${IC.trash}</button>` : '<span></span>'}
    </li>`;
  }).join('')}</ul>`;
}
function nextScheduleId() {
  const max = (state.schedules || []).reduce((m, p) => Math.max(m, parseInt(p.id.slice(2), 10) || 0), 0);
  return 'P-' + String(max + 1).padStart(3, '0');
}

/* ---------- 렌더링 ---------- */
const VIEWS = { board: boardHTML, request: requestHTML, approve: approveHTML, notice: noticeHTML, orders: ordersHTML, inbox: inboxHTML, schedule: scheduleHTML };

// partial=true: 타이머·다른 탭 갱신. 요청서처럼 입력 중인 화면은 목록만 갱신한다.
function render(partial = false) {
  document.getElementById('top').innerHTML = topHTML();
  const app = document.getElementById('app');
  if (!me()) { app.innerHTML = loginHTML(); const p = document.getElementById('pin'); if (p) p.focus(); return; }
  if (!VIEWS[view] || !navTabs(me()).some(t => t.id === view)) view = 'board';
  if (partial && view === 'request' && document.getElementById('req-form')) {
    document.getElementById('my-req').innerHTML = myRequestsHTML();
    return;
  }
  if (partial && view === 'approve' && document.getElementById('sup-edit-form')) return; // 감독원 수정 중에는 다시 그리지 않음
  if (partial && view === 'orders' && document.getElementById('order-form')) {
    document.getElementById('wo-list').innerHTML = sentOrdersHTML();
    return;
  }
  if (partial && view === 'schedule' && document.getElementById('sched-form')) {
    document.getElementById('sched-list').innerHTML = scheduleListHTML();
    const wk = document.querySelector('#app .sc-week');
    if (wk) wk.outerHTML = weekHTML();
    return;
  }
  if (partial && view === 'notice' && document.getElementById('notice-form')) {
    document.getElementById('notice-list').innerHTML = noticeListHTML();
    return;
  }
  app.innerHTML = VIEWS[view]();
  placeTicker(false);
}

// 입력 중일 때는 다시 그리지 않는다 (입력 내용이 지워지지 않도록)
let pendingRender = false;
function safeRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pendingRender = true; return; }
  render(true);

    if (!title) { t.focus(); return; }
    if (!state.notices) state.notices = [];
    state.notices.push({ id: 'N-' + Date.now(), authorId: currentUserId, at: toLocalISO(now()), title, body });
    tickerIdx = 0;
    commit();
    toast('공지사항을 게시했습니다. 근무현황 상단에 표시됩니다.');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el, e);
});
// 공지 바처럼 버튼 역할을 하는 영역은 키보드 Enter/Space로도 열리게
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-action]')) {
    e.preventDefault(); e.target.click();
  }
});
// 외근 이력 조회 조건(기간 · 직원)을 바꾸면 바로 다시 조회
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.hf;
  if (!k) return;
  histF[k] = e.target.value;
  if (k === 'from' || k === 'to') { const [a, b] = histRange(); histF.from = a; histF.to = b; }
  render();
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (forms[f.id]) { e.preventDefault(); forms[f.id](f); }
});

// 다른 탭에서 바뀐 내용을 실시간 반영
window.addEventListener('storage', e => {
  if (e.key === STORE_KEY) { state = load(); safeRender(); }
});
// 시계와 복귀 지연 표시를 30초마다 갱신
setInterval(() => {
  const c = document.getElementById('clock'); if (c) c.innerHTML = fmtClock();
  safeRender();
}, 30000);

/* ---------- 앱 설치 (PWA) ---------- */
let installPrompt = null; // 안드로이드·PC 크롬/엣지가 주는 설치 기회
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function canInstall() { return !isStandalone() && (!!installPrompt || isIOS()); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; render(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

render();
</script>
</body>
</html>
