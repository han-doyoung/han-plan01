}
// 안전 항목 입력칸 → 초안에 반영 (추가 · 삭제 전에 쓰던 내용을 잃지 않게)
function syncSafetyDraft() {
  const f = document.getElementById('safety-form');
  if (!f || !safetyDraft) return;
  safetyDraft = safetyDraft.map((it, i) => ({ title: (f.elements['t-' + i] || {}).value ?? it.title, desc: (f.elements['d-' + i] || {}).value ?? it.desc, scope: (f.elements['s-' + i] || {}).value || scopeOf(it), required: f.elements['r-' + i] ? f.elements['r-' + i].checked : it.required }));
}

/* ---------- 작업 요청 진행 상태 ----------
   새 요청 → 확인 → 진행 중(연결된 외근 진행) → 완료(연결된 외근 복귀 완료 · 상주 기록, 또는 감독원이 완료 처리) */
const ORDER_CLS = { '새 요청': 'field', '확인': 'work', '진행 중': 'out', '완료': 'leave' };
const orderLinks = (o, id) => state.requests.filter(r => r.workOrderId === o.id && (!id || isMember(r, id)));
function recipientState(o, id) {
  if (o.doneAt) return '완료';
  const ls = orderLinks(o, id);
  if (ls.some(r => r.status === '복귀 완료' || isRecord(r))) return '완료';
  if (ls.some(r => ['승인 대기', '승인', '외근 중'].includes(r.status))) return '진행 중';
  return ackOf(o, id) ? '확인' : '새 요청';
}
function orderState(o) {
  if (o.doneAt) return '완료';
  const st = o.toIds.map(id => recipientState(o, id));
  if (st.every(x => x === '완료')) return '완료';
  if (st.some(x => x === '진행 중' || x === '완료')) return '진행 중';
  return st.every(x => x !== '새 요청') ? '확인' : '새 요청';
}
const orderChip = (o, id) => { const v = id ? recipientState(o, id) : orderState(o); return `<span class="chip st-${ORDER_CLS[v]}">${v}</span>`; };
let orderDoneId = null;

/* ---------- 렌더링 ---------- */
const VIEWS = { admin: adminHTML, settings: settingsHTML, audit: auditHTML, board: boardHTML, request: requestHTML, approve: approveHTML, notice: noticeHTML, orders: ordersHTML, inbox: inboxHTML, schedule: scheduleHTML, report: reportHTML };

// 화면을 다시 그려도 펼쳐 둔 내용(변경 이력 · 표로 보기)은 그대로 펼쳐 둔다
function render(partial = false) {
  const open = new Set([...document.querySelectorAll('#app details[data-key][open]')].map(d => d.dataset.key));
  renderView(partial);
  if (open.size) document.querySelectorAll('#app details[data-key]').forEach(d => { if (open.has(d.dataset.key)) d.open = true; });
  updateReqLeft();
  // 요청 상세 · 알림 목록 (화면 위에 겹쳐 표시)
  const ov = document.getElementById('overlay');
  if (ov) {
    const keepOpen = ov.querySelector('.md-body .alog') ? ov.querySelector('.md-body .alog').open : true;
    const scrollTop = ov.querySelector('.md-body') ? ov.querySelector('.md-body').scrollTop : 0;
    ov.innerHTML = me() ? detailHTML() + notifHTML() : '';
    const b = ov.querySelector('.md-body'); if (b) { b.scrollTop = scrollTop; const al = b.querySelector('.alog'); if (al) al.open = keepOpen; }
    document.body.classList.toggle('modal-open', !!ov.innerHTML.trim());
  }
}
// partial=true: 타이머·다른 탭 갱신. 요청서처럼 입력 중인 화면은 목록만 갱신한다.
function renderView(partial = false) {
  document.getElementById('top').innerHTML = topHTML();
  const app = document.getElementById('app');
  if (!me()) { app.innerHTML = loginHTML(); const p = document.getElementById('pin'); if (p) p.focus(); return; }
  const allowed = navTabs(me()).map(t => t.id).concat(['settings'], isSup(me()) ? ['report', 'audit', 'admin'] : []); // 메뉴 없이 버튼으로 여는 화면
  if (!VIEWS[view] || !allowed.includes(view)) view = 'board';
  if (partial && view === 'request' && document.getElementById('req-form')) {
    document.getElementById('my-req').innerHTML = myRequestsHTML();
    return;
  }
  if (partial && (view === 'settings' || view === 'admin')) return; // 설정 · 기준정보 입력 중에는 다시 그리지 않음
  if (partial && view === 'approve' && (document.getElementById('sup-edit-form') || document.getElementById('sup-act-form') || document.getElementById('reject-form'))) return; // 감독원 입력 중에는 다시 그리지 않음
  if (partial && view === 'board' && (document.getElementById('extend-form') || document.getElementById('return-form') || document.getElementById('start-form') || document.getElementById('cancel-form'))) return; // 직원 입력 중
  if (partial && view === 'orders' && document.getElementById('order-form')) {
    document.getElementById('wo-list').innerHTML = sentOrdersHTML();
    return;
  }
  if (partial && view === 'schedule' && document.getElementById('sched-form')) {
    document.getElementById('sched-list').innerHTML = scheduleListHTML();
    const wk = document.querySelector('#app .sc-week');
    if (wk) wk.outerHTML = weekHTML();
    return;
  }
  if (partial && view === 'notice' && document.getElementById('notice-form')) {
    document.getElementById('notice-list').innerHTML = noticeListHTML();
    return;
  }
  app.innerHTML = VIEWS[view]();
  placeTicker(false);
}

// 입력 중일 때는 다시 그리지 않는다 (입력 내용이 지워지지 않도록)
let pendingRender = false;
function safeRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app') && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.closest('#app form'))) { pendingRender = true; return; }
  render(true);
}
document.addEventListener('focusout', () => {
  // 입력칸을 벗어나며 바로 버튼을 누른 경우, 그 클릭이 먼저 처리되도록 잠시 기다렸다가 갱신
  if (pendingRender) setTimeout(() => { if (pendingRender) { pendingRender = false; safeRender(); } }, 300);
});

let toastTimer;
// 종류: success(초록 체크) · error(빨강 경고) · info(파랑 안내). 지정하지 않으면 문구로 판단
function toastType(msg) {
  if (/수 없|실패|맞지 않|불가|않았습니다/.test(msg)) return 'error';
  if (/없습니다|이미|먼저|확인하세요|아닙니다/.test(msg)) return 'info';
  return 'success';
}
function toast(msg, type) {
  const t = document.getElementById('toast');
  const k = type || toastType(msg);
  t.dataset.type = k;
  t.setAttribute('role', k === 'error' ? 'alert' : 'status');
  const ic0 = document.createElement('span'); ic0.className = 'toast-ic'; ic0.innerHTML = k === 'error' ? IC.alert : k === 'info' ? IC.info : IC.check;
  const tx = document.createElement('span'); tx.textContent = msg;
  t.replaceChildren(ic0, tx); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, k === 'error' ? 4000 : 2800);
}

function commit() { save(); render(); }

// 하단 기관 정보 (공공기관 표준 형식: 기관 로고 · 기관명 · 이용 안내)
function footHTML() {
  return `<div class="sf-inner">
    <p class="sf-row"><span class="exmark sf-mark" role="img" aria-label="한국도로공사 CI"></span><b>한국도로공사 광주전남본부</b><span>전산 작업관리 소통포털</span></p>
    <p class="sf-note">이 시스템은 내부 업무용입니다. 업무 외 목적으로 사용하거나 정보를 외부에 제공하지 마십시오.</p>
  </div>`;
}
document.getElementById('foot').innerHTML = footHTML();

/* ---------- 동작 ---------- */
const actions = {
  pick(el) {
    const u = userById(el.dataset.id);
    if (isSup(u)) { pinTarget = u.id; pinError = ''; render(); return; }
    login(u.id);
  },
  'cancel-pin'() { pinTarget = null; pinError = ''; render(); },
  logout() { if (me()) { audit('access', '로그아웃', me().name, ''); save(); } currentUserId = null; setSessionUser(null); pinTarget = null; resetUI(); render(); },
  async install() {
    if (installPrompt) {
      installPrompt.prompt();
      const choice = await installPrompt.userChoice.catch(() => null);
      installPrompt = null;
      render();
      if (choice && choice.outcome === 'accepted') toast('홈 화면에 앱을 설치했습니다.');
      return;
    }
    // 아이폰·아이패드(사파리)는 설치 창을 띄울 수 없어 방법을 안내
    toast('사파리 아래쪽 공유 버튼 → "홈 화면에 추가"를 누르면 앱으로 설치됩니다.');
  },
  go(el) {
    view = el.dataset.view; editingId = null; supEditId = null; returnOpen = false; startOpenId = null; cancelOpenId = null;
    extendOpen = false; supAct = null; reqPrefill = null; noticeEditId = null; detailId = null; notifOpen = false; orderDoneId = null;
    if (view === 'admin') safetyDraft = null;
    if (view === 'audit') auditF.page = 1;
    if (view === 'schedule') calWeek = 0;
    if (view === 'board') boardTab = 'status'; // 근무현황 메뉴는 항상 "근무현황" 탭부터
    if (view === 'request') reqStep = 1;
    if (view === 'approve') approveTab = el.dataset.tab || null; // 안내 띠에서 오면 해당 탭
    render(); window.scrollTo(0, 0);
  },
  'edit-req'(el) {
    if (!editableRequest(el.dataset.id)) { toast('이미 처리된 요청이라 수정할 수 없습니다.'); render(); return; }
    editingId = el.dataset.id; reqStep = 1;
    render();
    document.getElementById('req-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  'cancel-edit'() { editingId = null; reqDraft = null; render(); },
  async approve(el) {
    if (!isSup(me())) return; // 감독원 전용
    const r = reqById(el.dataset.id);
    if (!r || r.status !== '승인 대기') return;
    const ov = overlapsFor(members(r), r.departAt, r.expectedReturnAt, r.id);
    if (ov.length && !await uiConfirm(`시간이 겹치는 외근이 있습니다.\n${overlapText(ov, members(r))}`, { title: '그래도 승인할까요?', ok: '승인' })) return;
    if (r.status !== '승인 대기') return; // 확인하는 사이 다른 곳에서 처리됨
    const box = document.getElementById(`instr-${r.id}`);
    const instruction = ((box ? box.value : instrDrafts[r.id]) || '').trim().slice(0, 200);
    r.approverId = currentUserId;
    r.decidedAt = toLocalISO(now());
    r.status = '승인';
    if (instruction) r.instruction = instruction;
    delete instrDrafts[r.id];
    audit('approve', '승인', r.id, `${locText(r)}${instruction ? ' · 요청사항: ' + instruction : ''}`, { to: members(r) });
    commit();
    const extra = instruction ? ' 요청사항도 전달했습니다.' : '';
    toast(`${namesOf(members(r))}: 승인했습니다. 직원이 출발하면서 "외근 시작"을 누르면 외근으로 바뀝니다.` + extra);
  },
  return() {
    returnOpen = true; extendOpen = false; render();
    const f = document.getElementById('return-form');
    if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  },
  'cancel-return'() { returnOpen = false; render(); },
  'extend-open'() {
    extendOpen = true; returnOpen = false; render();
    const f = document.getElementById('extend-form'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  'extend-close'() { extendOpen = false; render(); },
  'ext-quick'(el) {
    const f = document.getElementById('extend-form'), r = f && reqById(f.dataset.id);
    if (!r) return;
    f.elements.to.value = extDraft.to = toInputValue(roundUp10(new Date(extBase(r).getTime() + (+el.dataset.min) * 60000)));
  },
  'sup-act'(el) {
    const r = reqById(el.dataset.id);
    if (!r || !isSup(me())) return;
    supAct = { id: r.id, type: el.dataset.type }; render();
    const f = document.getElementById('sup-act-form');
    if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); f.elements.reason.focus({ preventScroll: true }); }
  },
  'sup-act-close'() { supAct = null; render(); },
  revisit(el) {

    Object.assign(r, x, {
      departAt: x.departAt + ':00', expectedReturnAt: x.expectedReturnAt + ':00',
      editedAt: toLocalISO(now()), editedBy: currentUserId,
    });
    const chgS = diffOf(before, r, REQ_FIELDS);
    if (before.status !== r.status) chgS.push({ f: '상태', from: before.status, to: r.status });
    audit('req', '요청 수정 (감독원)', r.id, locText(r), { changes: chgS, to: members(r) });
    supEditId = null;
    commit();
    toast(`${r.id} 요청을 수정했습니다. 직원의 "내 요청"에도 감독원 수정으로 표시됩니다.`);
  },
  'reject-form'(f) {
    if (!isSup(me())) return; // 감독원 전용
    const reason = f.reason.value.trim();
    if (!reason) { f.reason.focus(); return; }
    const r = reqById(f.dataset.id);
    if (!r || r.status !== '승인 대기') { rejectTarget = null; render(); return; }
    Object.assign(r, { status: '반려', rejectReason: reason, approverId: currentUserId, decidedAt: toLocalISO(now()) });
    unlinkFollowUp(r);
    audit('approve', '반려', r.id, `사유: ${reason}`, { to: members(r) });
    rejectTarget = null; delete rejectDrafts[r.id];
    commit();
    toast('반려했습니다. 요청한 직원 화면에 사유가 표시됩니다.');
  },
  async 'req-form'(f) {
    const err = document.getElementById('req-err');
    const fail = msg => {
      const m = reqMissing(f); if (m.length && matchMedia('(max-width: 640px)').matches && m[0][0] !== reqStep) gotoReqStep(m[0][0]);
      err.textContent = msg; err.hidden = false;
    };
    const v = name => (f.elements[name].value || '').trim();
    const supportType = v('supportType'), workType = v('workType'), locationDetail = v('locationDetail');
    const locations = v('locations').split('|').filter(Boolean), location = locations[0] || '';
    const departAt = v('departAt'), expectedReturnAt = v('expectedReturnAt'), description = v('description');
    const bad = checkReqFields({ supportType, locations, locationDetail, departAt, expectedReturnAt, description });
    if (bad) return fail(bad);
    const checkedIdx = [...f.querySelectorAll('input[name="safety"]:checked')].map(c => +c.value);
    const safetyChecked = state.safetyItems.filter((s, i) => checkedIdx.includes(i) && safetyApplies(s, supportType)).map(s => s.title);
    // 공동작업자: 체크한 직원 (수정하는 공동작업자 본인은 항상 포함)
    const owner = editingId ? (reqById(editingId) || {}).requesterId : currentUserId;
    const coWorkerIds = [...f.querySelectorAll('input[name="coWorker"]:checked')].map(c => c.value);
    if (owner && owner !== currentUserId && !coWorkerIds.includes(currentUserId)) coWorkerIds.push(currentUserId);
    const coIds = state.users.filter(u => coWorkerIds.includes(u.id) && u.id !== owner).map(u => u.id); // 순서 고정
    const needSafety = safetyFor(supportType).filter(s => s.required !== false);
    if (needSafety.some(s => !safetyChecked.includes(s.title)))
      return fail(`${supportType}이면 필수 안전 준수 항목(${needSafety.map(s => s.title.replace(/ (준수|착용)$/, '')).join(', ')})을 모두 확인해야 ${supportType === '상주지원' ? '기록할' : '승인 요청을 할'} 수 있습니다.`);
    // 사후 요청: 방문지원인데 출발 시각이 이미 10분 넘게 지났으면 한 번 확인하고 "사후 요청"으로 표시
    const lateReq = supportType === '방문지원' && new Date(departAt) < new Date(now().getTime() - 10 * 60000);
    if (lateReq && !await uiConfirm(`출발 시각(${departAt.replace('T', ' ')})이 이미 지났습니다.\n이미 다녀왔거나 출발한 외근을 사후에 요청하는 건가요?\n확인을 누르면 "사후 요청"으로 표시되어 감독원에게 전달됩니다.`, { title: '사후 요청인가요?' })) return;
    const ids = [owner || currentUserId, ...coIds];
    const ov = overlapsFor(ids, departAt + ':00', expectedReturnAt + ':00', editingId);
    if (ov.length && !await uiConfirm(`같은 시간에 이미 잡힌 외근이 있습니다.\n${overlapText(ov, ids)}`, { title: `그래도 ${editingId ? '저장' : '요청'}할까요?`, ok: editingId ? '저장' : '요청' })) return;
    if (editingId) {
      // 저장 직전에 다시 확인: 그사이 감독원이 승인·반려했으면 수정 불가
      const r = editableRequest(editingId);
      if (!r) { editingId = null; render(); toast('그사이 감독원이 처리한 요청이라 수정할 수 없습니다.'); return; }
      const before = JSON.parse(JSON.stringify(r)); before.locations = orgsOf(r);
      r.status = supportType === '상주지원' ? '상주 기록' : '승인 대기'; // 지원 구분을 바꾸면 기록 ↔ 승인 요청으로 전환
      if (lateReq) r.lateRequest = true; else delete r.lateRequest;
      Object.assign(r, {
        supportType, workType, locations, location, locationDetail, description, safetyChecked, coWorkerIds: coIds,
        departAt: departAt + ':00', expectedReturnAt: expectedReturnAt + ':00', editedAt: toLocalISO(now()), editedBy: currentUserId,
      });
      const id = r.id;
      const chg = diffOf(before, r, REQ_FIELDS);
      if (before.status !== r.status) chg.push({ f: '상태', from: before.status, to: r.status });
      audit('req', isRecord(r) ? '상주 기록 수정' : '요청 수정', r.id, locText(r), { changes: chg, to: [...(isRecord(r) && before.status === r.status ? [] : supIds()), ...members(r), ...(before.coWorkerIds || [])] });
      editingId = null; reqDraft = null; reqStep = 1;
      commit();
      toast(isRecord(r) ? `${id} 상주지원 기록을 수정했습니다.` : `${id} 요청을 수정했습니다. 감독원 승인 화면${coIds.length ? '과 공동작업자 화면' : ''}에도 바로 반영됩니다.`);
      return;
    }
    const newId = nextRequestId(), pf = reqPrefill;
    state.requests.push({
      id: newId, requesterId: currentUserId, coWorkerIds: coIds, supportType, workType, locations, location, locationDetail,
      departAt: departAt + ':00', expectedReturnAt: expectedReturnAt + ':00', description,
      requestedAt: toLocalISO(now()), safetyChecked, status: supportType === '상주지원' ? '상주 기록' : '승인 대기', approverId: null, decidedAt: null, returnedAt: null,
      ...(pf && pf.followUpOf ? { followUpOf: pf.followUpOf } : {}), ...(pf && pf.workOrderId ? { workOrderId: pf.workOrderId } : {}), ...(lateReq ? { lateRequest: true } : {}),
    });
    if (pf && pf.followUpOf) { const o = reqById(pf.followUpOf); if (o) o.followUpId = newId; }
    if (pf && pf.workOrderId) {
      // 작업 요청으로 승인 요청을 만들면, 아직 확인 전이었다면 확인한 것으로 기록
      const o = (state.workOrders || []).find(x => x.id === pf.workOrderId);
      if (o && o.toIds.includes(currentUserId) && !ackOf(o, currentUserId)) { o.acks = o.acks || {}; o.acks[currentUserId] = { at: toLocalISO(now()), note: `${newId} 승인 요청 작성` };
        audit('order', '작업 요청 확인', o.id, `${o.title} · 회신: ${newId} 승인 요청 작성`, { to: [o.fromId] }); }
    }
    reqPrefill = null; reqDraft = null; reqStep = 1;
    audit('req', supportType === '상주지원' ? '상주지원 기록' : '승인 요청', newId, `${supportType} · ${locations.join(' → ')}${locationDetail ? ' ' + locationDetail : ''} · ${departAt.slice(5).replace('T', ' ')}~${expectedReturnAt.slice(11)}${coIds.length ? ' · 공동 ' + namesOf(coIds) : ''}${pf && pf.followUpOf ? ` · 재방문(${pf.followUpOf})` : ''}${pf && pf.workOrderId ? ` · 작업 요청 ${pf.workOrderId}` : ''}${lateReq ? ' · 사후 요청' : ''}`,
      { to: [...supIds(), ...coIds] });
    commit();
    toast(supportType === '상주지원' ? `상주지원 기록을 남겼습니다${coIds.length ? ` (함께: ${namesOf(coIds)})` : ''}. 승인 없이 기록만 남습니다.`
      : coIds.length ? `공동작업(${namesOf(coIds)})으로 승인을 요청했습니다. 공동작업자도 수정할 수 있습니다.` : '승인을 요청했습니다. 감독원 승인을 기다립니다.');
  },
  'order-form'(f) {
    if (!isSup(me())) return; // 감독원 전용
    const err = document.getElementById('wo-err');
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    const toIds = [...f.querySelectorAll('input[name="to"]:checked')].map(c => c.value);
    const title = f.elements.title.value.trim();
    const dueAt = f.elements.dueAt.value;
    const locations = (f.elements.locations.value || '').split('|').filter(Boolean);
    if (!toIds.length) return fail('작업 요청을 받을 직원을 한 명 이상 선택하세요.');
    if (!title) return fail('요청 제목을 입력하세요.');
    if (!state.workOrders) state.workOrders = [];
    state.workOrders.push({
      id: nextOrderId(), fromId: currentUserId, toIds,
      priority: f.elements.priority.value || '보통', title,
      locations, location: locations[0] || '', dueAt: dueAt ? dueAt + ':00' : '',
      detail: f.elements.detail.value.trim(), createdAt: toLocalISO(now()), acks: {},
    });
    { const o = state.workOrders[state.workOrders.length - 1]; audit('order', '작업 요청', o.id, `${o.priority === '긴급' ? '[긴급] ' : ''}${title}${locations.length ? ` (${locations.join(' → ')})` : ''} → ${namesOf(toIds)}`, { to: toIds }); }
    commit();
    toast(`${toIds.map(id => userById(id).name).join(', ')}에게 작업 요청을 보냈습니다.`);
  },
  'notice-form'(f) {
    const t = f.elements.title, b = f.elements.body; // f.title은 폼 자체 속성이라 elements로 접근
    const title = t.value.trim(), body = b.value.trim();
    if (!title) { t.focus(); return; }
    const pinned = isSup(me()) && f.elements.pinned ? f.elements.pinned.checked : undefined;
    if (!state.notices) state.notices = [];
    const ne = state.notices.find(n => n.id === noticeEditId && n.authorId === currentUserId);
    if (ne) {
      const nb = { title: ne.title, body: ne.body, pinned: !!ne.pinned };
      Object.assign(ne, { title, body, editedAt: toLocalISO(now()) });
      if (pinned !== undefined) ne.pinned = pinned;
      audit('notice', '공지 수정', ne.title, '', { changes: diffOf(nb, { title: ne.title, body: ne.body, pinned: !!ne.pinned }, ['title', 'body', 'pinned']) });
      noticeEditId = null; tickerIdx = 0;
      commit();
      toast('공지사항을 수정했습니다.');
      return;
    }
    state.notices.push({ id: 'N-' + Date.now(), authorId: currentUserId, at: toLocalISO(now()), title, body, ...(pinned ? { pinned: true } : {}) });
    audit('notice', '공지 게시', title, pinned ? '중요 공지' : '', { to: state.users.map(x => x.id) });
    tickerIdx = 0;
    commit();
    toast(pinned ? '중요 공지로 게시했습니다. 공지 줄 맨 앞에 고정됩니다.' : '공지사항을 게시했습니다. 근무현황 상단에 표시됩니다.');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el, e);
});
// 알림 설정: "알림 받기"를 끄면 받을 알림 목록을 잠금
document.addEventListener('change', e => {
  if (e.target.name === 'enabled' && e.target.form && e.target.form.id === 'notify-form') {
    const fs = e.target.form.querySelector('.alert-types'); if (fs) fs.disabled = !e.target.checked;
  }
});
// Esc: 요청 상세 · 알림 목록 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (detailId || notifOpen)) { detailId = null; notifOpen = false; render(); }
});
// 공지 바처럼 버튼 역할을 하는 영역은 키보드 Enter/Space로도 열리게
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-action]')) {
    e.preventDefault(); e.target.click();
  }
});
// 외근 이력 조회 조건(기간 · 직원)을 바꾸면 바로 다시 조회
document.addEventListener('change', e => {
  const af = e.target.dataset && e.target.dataset.af;
  if (af) { auditF[af] = e.target.value; auditF.page = 1; render(); return; }
  const k = e.target.dataset && e.target.dataset.hf;
  if (!k) return;
  histF[k] = e.target.value;
  if (k === 'from' || k === 'to') { const [a, b] = histRange(); histF.from = a; histF.to = b; }
  render();
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (forms[f.id]) { e.preventDefault(); forms[f.id](f); }
});

// 다른 탭에서 바뀐 내용을 실시간 반영
window.addEventListener('storage', e => {
  if (e.key === STORE_KEY) { state = load(); safeRender(); checkNotifications(); }
});
// 시계와 복귀 지연 표시를 30초마다 갱신
setInterval(() => {
  document.querySelectorAll('.js-clock').forEach(c => { c.innerHTML = fmtClock(); });
  safeRender();
  checkNotifications();
}, 30000);

/* ---------- 앱 설치 (PWA) ---------- */
let installPrompt = null; // 안드로이드·PC 크롬/엣지가 주는 설치 기회
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function canInstall() { return !isStandalone() && (!!installPrompt || isIOS()); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; render(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

maskExpiredNotes();
render();
checkNotifications();
</script>
</body>
</html>
